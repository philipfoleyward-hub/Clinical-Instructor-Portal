}


function downloadClinicalReviewPdf() {
  if (APP.clinicalReviewPdfBusy || !APP.clinicalReviewResult) return;

  APP.clinicalReviewPdfBusy = true;
  APP.clinicalReviewPdfMessage = 'Creating PDF...';
  APP.clinicalReviewError = '';
  render();

  google.script.run
    .withSuccessHandler(result => {
      APP.clinicalReviewPdfBusy = false;

      if (!result || !result.success || !result.base64) {
        APP.clinicalReviewPdfMessage = '';
        APP.clinicalReviewError = 'The Assessment PDF could not be created.';
        render();
        return;
      }

      const bytes = atob(result.base64);
      const buffer = new Uint8Array(bytes.length);
      for (let i = 0; i < bytes.length; i++) buffer[i] = bytes.charCodeAt(i);

      const blob = new Blob([buffer], { type: result.mimeType || 'application/pdf' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = result.filename || 'Assessment.pdf';
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);

      APP.clinicalReviewPdfMessage = 'PDF created.';
      render();
    })
    .withFailureHandler(error => {
      APP.clinicalReviewPdfBusy = false;
      APP.clinicalReviewPdfMessage = '';
      APP.clinicalReviewError = clinicalReviewErrorMessage(error);
      render();
    })
    .dashboardGenerateClinicalReviewPdf(clinicalReviewRequest());
}


function clinicalReviewErrorMessage(error) {

function showFatalError(error) {

      ? error.message

  document.getElementById(
    'content'
  ).innerHTML = `

    <div class="error">

      <strong>
        Dashboard error:
      </strong>

      ${escapeHtml(message)}

    </div>

  `;
}


function escapeHtml(value) {

  return String(
    value ?? ''
  )
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}


function escapeJs(value) {

  return String(
    value ?? ''
  )
    .replace(/\\/g, '\\\\')
    .replace(/'/g, "\\'");
}

    .concat(selected.approvedEvents || [])
    .concat(selected.pendingEvents || [])
    .sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')))
    .slice(0,5) : [];

  modalHost.innerHTML = `

        </div>

        <div class="attendance-modal-body">

              <label>Student</label>

                <option value="">Select student</option>${options}
              </select>
            </div>
            <div>
              <label>Clinical Term</label>
              <input id="attendanceEntryTerm" value="${escapeHtml(APP.scheduleClinicalTerm||'')}" readonly>
            </div>
            <div>
              <label>Date</label>
              <input id="attendanceEntryDate" type="date" value="${todayInputValue()}">
            </div>
            <div>
              <label>Event Type</label>
              <select id="attendanceEntryType" onchange="attendanceEntryTypeChanged()">
                <option value="ABSENCE">Absence / Call-Out</option>
                <option value="LATE_ARRIVAL">Late Arrival</option>
                <option value="EARLY_DEPARTURE">Early Departure</option>
                <option value="LATE_RETURN">Late Return</option>
                <option value="DISCIPLINARY_REMOVAL">Disciplinary Removal</option>
                <option value="EARNED_TIME">Earned Time Credit</option>
                <option value="MAKE_UP_TIME">Make-Up Time Completed</option>
                <option value="EVENING_ROTATION_REPLACEMENT">Evening Rotation Replacement</option>
                <option value="ATTENDANCE_ADJUSTMENT">Attendance Adjustment</option>
              </select>
            </div>
            <div>
              <label>Hours</label>
              <input id="attendanceEntryHours" type="number" min="0" step="0.25">
            </div>
            <div>
              <label>ETO Impact <span class="muted small">(optional)</span></label>
              <input id="attendanceEntryEtoImpact" type="number" step="0.25" placeholder="Blank = use event hours">
            </div>
            <div>
              <label>Approval</label>
              <select id="attendanceEntryApproval">
                <option value="APPROVED">Approved — apply now</option>
                <option value="PENDING">Pending — do not affect balance yet</option>
              </select>
            </div>
            <div>
              <label>Related Event ID <span class="muted small">(optional)</span></label>
              <input id="attendanceEntryRelated" placeholder="For linked make-up / replacement">
            </div>

              <label class="attendance-check"><input id="attendanceEntryMakeup" type="checkbox"> Make-up required</label>
            </div>
            <div>
              <label>Reason</label>
              <input id="attendanceEntryReason" placeholder="Brief reason / context">
            </div>
            <div>
              <label>Notes</label>
              <textarea id="attendanceEntryNotes" rows="3" placeholder="Optional coordinator notes"></textarea>
            </div>
          </div>

          ${selected ? `
          <div class="attendance-modal-history">
            <div class="section-title">Recent Attendance</div>
            ${events.length ? events.map(e=>`
              <div class="attendance-modal-history-row">
                <strong>${escapeHtml(e.eventType||'Event')}</strong>
                <span>${escapeHtml(String(e.date||'').slice(0,10))}</span>
                <span>${v3Hours(e.hours)}</span>
                <span>${escapeHtml(e.approvalStatus||'')}</span>
                <span>${escapeHtml(e.reason||e.notes||'')}</span>

          </div>` : ''}

          <div id="attendanceEntryMessage"></div>
        </div>

        <div class="attendance-modal-footer">
          <button class="secondary-button" type="button" onclick="closeAttendanceEntry()">Cancel</button>
          <button id="saveAttendanceEntryButton" class="primary-button" type="button" onclick="saveAttendanceEntry()">Save Attendance Event</button>
        </div>
      </div>
    </div>`;
}

function closeAttendanceEntry() {
  APP.attendanceEntryStudentId = '';
  APP.attendanceEntryBusy = false;
  const host = document.getElementById('attendanceModalHost');
  if (host) host.remove();
}

function toggleAttendanceStudent(studentId) {
  openAttendanceEntry(studentId);
}

function attendanceModalBackdropCancel(event) {
  if (event && event.target && event.target.classList.contains('attendance-modal-backdrop')) {
    closeAttendanceEntry();
  }
}

<script id="ccms-v2-shell-script">

/* =====================================================================
 * CCMS COORDINATOR V2 SHELL — wires the approved V2 visual design to the
 * existing, working Dashboard pages and services. Real data only.
 * ===================================================================== */
const V2 = {
  map: {home: 'home', students: 'students', instructors: 'instructors', sites: 'sites', schedules: 'schedules',
    paperwork: 'administration', system: 'system', help: 'help'},
  home: null, homeLoading: false, homeError: '', assets: null, pcs: null, attendance: null,
  chip: 'all', pendingEntry: '', review: null, reviewBusy: false, reviewMsg: ''
};
function v2Ico(id) {return '<span class="v2-icon"><svg><use href="#v2i-' + id + '"/></svg></span>';}
function v2Esc(v) {return escapeHtml(v == null ? '' : String(v));}
function v2Run(fn, args, ok, fail) {
  const r = google.script.run.withSuccessHandler(ok).withFailureHandler(fail || function(e) {alert(errorMessage(e));});
  r[fn].apply(r, args || []);
}

/* ---------- navigation ---------- */
const v2OriginalShowPage = showPage;
showPage = function(page) {
  v2OriginalShowPage(page);
  v2SetActive(page);
  window.scrollTo(0, 0);
};
function v2SetActive(page) {
  const key = {administration: 'paperwork', reports: 'paperwork', newEntry: 'paperwork', clinicalReview: 'paperwork',
    attendance: 'schedules', ciAvailability: 'schedules', ciMileage: 'paperwork', review: 'home'}[page] || page;
  document.querySelectorAll('.v2-nav button[data-v2]').forEach(function(b) {b.classList.toggle('active', b.dataset.v2 === key);});
  const help = document.querySelector('.v2-help');
  if (help) help.classList.toggle('active', page === 'help');
  const c = document.getElementById('content');
  if (c) c.classList.toggle('v2-homepage', page === 'home');
}
function v2Go(key) {showPage(V2.map[key] || key);}
const v2OriginalRender = render;
render = function() {
  if (APP.page === 'system') return v2RenderSystem();
  if (APP.page === 'help') return v2RenderHelp();
  if (APP.page === 'ciAvailability') return v2RenderCiHours();
  if (APP.page === 'ciMileage') return v2RenderMileage();
  if (APP.page === 'instructors') return v2RenderInstructors();
  return v2OriginalRender();
};

/* ---------- data ---------- */
function v2LoadHome(force) {
  if (V2.homeLoading || (V2.home && !force)) return;
  V2.homeLoading = true; V2.homeError = '';
  v2Run('dashboardV2GetHome', [], function(h) {
    V2.homeLoading = false; V2.home = h || {}; v2PaintTop();
    if (APP.page === 'home') renderHome();
  }, function(e) {
    V2.homeLoading = false; V2.homeError = errorMessage(e);
    if (APP.page === 'home') renderHome();
  });
  if (!V2.attendance) v2Run('dashboardGetAttendanceActionItems', [], function(r) {
    V2.attendance = r || {}; if (APP.page === 'home') renderHome();
  }, function() {V2.attendance = {error: true};});
}
function v2RefreshAll() {
  v2Run('getDashboardBootstrap', [], function(data) {
    APP.students = data.students || []; APP.reviewStats = data.reviewStats || {};
    APP.addNewCapabilities = data.addNew || {}; APP.documentCapabilities = data.documents || {};
    V2.pcs = null; v2LoadHome(true);
    if (APP.page === 'review') loadReviewQueue(); else render();
  });
}
function v2LoadAssets() {
  if (V2.assets) return v2ApplyAssets();
  v2Run('dashboardHomeV2GetAssets', [], function(a) {V2.assets = a || {}; v2ApplyAssets();}, function() {});
}
function v2ApplyAssets() {
  const a = V2.assets || {};
  document.querySelectorAll('[data-asset-bg]').forEach(function(el) {
    const k = el.getAttribute('data-asset-bg');
    if (a[k]) el.style.backgroundImage = (k === 'HOME_HERO'
      ? 'linear-gradient(90deg,#fdebd9 0%,#fdead7 54%,rgba(253,234,215,0) 60%),'
      : '') + 'url("' + a[k] + '")';
  });
  document.querySelectorAll('[data-asset-img]').forEach(function(el) {
    const k = el.getAttribute('data-asset-img'); if (a[k]) el.src = a[k];
  });
}

/* ---------- top bar ---------- */
function v2PaintTop() {
  const h = V2.home || {}, u = h.user || {};
  const name = u.name || 'Coordinator';
  const el = document.getElementById('v2-pname'); if (el) el.textContent = name;
  const av = document.getElementById('v2-avatar');
  if (av) av.textContent = name.split(/[\s.]+/).filter(Boolean).map(function(x) {return x[0];}).join('').slice(0, 2).toUpperCase();
  const s = APP.reviewStats || {};
  const count = Number(h.inboxUnread || 0) + Number(s.flagged || 0);
  const b = document.getElementById('v2-bell-count');
  if (b) {b.textContent = String(count); b.hidden = !count;}
}
function v2ToggleBell(ev) {
  if (ev) ev.stopPropagation();
  const box = document.getElementById('v2-bell-panel');
  if (!box.hidden) {box.hidden = true; return;}
  const h = V2.home || {}, s = APP.reviewStats || {};
  const inbox = (h.inbox || []).slice(0, 10);
  box.innerHTML = '<div class="v2-bp-head">Notifications</div>' +
    (Number(s.flagged || 0) ? '<button class="v2-bp-item" onclick="v2CloseBell();showPage(\'review\');loadReviewQueue(\'flagged\')"><b>' +
      Number(s.flagged) + ' flagged evaluation' + (s.flagged == 1 ? '' : 's') + '</b><span>Open the flagged review queue</span></button>' : '') +
    (Number(s.awaitingReview || 0) ? '<button class="v2-bp-item" onclick="v2CloseBell();showPage(\'review\');loadReviewQueue(\'pending\')"><b>' +
      Number(s.awaitingReview) + ' awaiting review</b><span>New submissions</span></button>' : '') +
    inbox.map(function(n) {
      return '<button class="v2-bp-item ' + (n.status === 'Unread' ? 'unread' : '') + '" onclick="v2OpenInbox(\'' + escapeJs(n.id) + '\')"><b>' +
        v2Esc(n.title || 'Instructor reply') + '</b><span>' + v2Esc(n.from) + ' · ' + v2Esc(n.student) + ' · ' +
        v2Esc(String(n.createdAt).slice(0, 10)) + '</span><span>' + v2Esc(String(n.message).slice(0, 140)) + '</span></button>';
    }).join('') +
    (!inbox.length && !Number(s.flagged || 0) && !Number(s.awaitingReview || 0) ? '<div class="v2-bp-empty">You are all caught up.</div>' : '');
  box.hidden = false;
}
function v2CloseBell() {const b = document.getElementById('v2-bell-panel'); if (b) b.hidden = true;}
document.addEventListener('click', function(e) {if (!e.target.closest('.v2-bellwrap')) v2CloseBell(); if (!e.target.closest('.v2-search')) v2CloseSearch();});
function v2OpenInbox(id) {
  v2CloseBell();
  const n = ((V2.home || {}).inbox || []).filter(function(x) {return x.id === id;})[0];
  if (!n) return;
  if (n.itemKind === 'availability') return v2OpenAvailability(n.id);
  if (n.itemKind === 'reflection') {if (n.status === 'Unread') v2Run('dashboardV2MarkInboxRead', [id], function() {n.status = 'Read'; v2LoadHome(true);}, function() {});
    const m = /\(([^()]+)\)\s*$/.exec(n.from || ''); V2.ci.openAfter = m ? m[1] : ''; V2.ci.data = null; return showPage('instructors');}
  if (/^mileage/.test(n.itemKind || '')) {if (n.status === 'Unread') v2Run('dashboardV2MarkInboxRead', [id], function() {n.status = 'Read'; v2LoadHome(true);}, function() {}); return showPage('ciMileage');}
  if (n.status === 'Unread') v2Run('dashboardV2MarkInboxRead', [id], function() {n.status = 'Read'; v2LoadHome(true);}, function() {});
  if (n.itemId) v2OpenReview(n.itemKind || 'evaluation', n.itemId);
}
function v2Search(q) {
  const box = document.getElementById('v2-search-results');
  q = String(q || '').trim().toLowerCase();
  if (!q) {box.hidden = true; return;}
  const hits = (APP.students || []).filter(function(s) {
    return (String(s.student || '') + ' ' + String(s.studentId || '') + ' ' + String(s.cohort || '')).toLowerCase().indexOf(q) >= 0;
  }).slice(0, 8);
  box.innerHTML = hits.length ? hits.map(function(s) {
    return '<button onclick="v2OpenStudent(\'' + escapeJs(s.studentId) + '\')"><b>' + v2Esc(s.student) + '</b><span>' +
      v2Esc(s.studentId) + (s.cohort ? ' · ' + v2Esc(s.cohort) : '') + '</span></button>';
  }).join('') : '<div class="v2-bp-empty">No matching students</div>';
  box.hidden = false;
}
function v2CloseSearch() {const b = document.getElementById('v2-search-results'); if (b) b.hidden = true;}
function v2OpenStudent(id) {
  v2CloseSearch(); const i = document.getElementById('v2-search-input'); if (i) i.value = '';
  showPage('students'); selectStudent(id);
}

/* ---------- Home ---------- */
renderHome = function() {
  const c = document.getElementById('content');
  c.classList.add('v2-homepage');
  v2LoadHome(false);
  const h = V2.home || {}, s = APP.reviewStats || {}, u = h.user || {};
  const pc = h.pc || {pending: 0, returned: 0};
  const hour = new Date().getHours();
  const greet = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
  const today = new Date().toLocaleDateString(undefined, {weekday: 'long', month: 'long', day: 'numeric', year: 'numeric'});
  const first = String(u.name || '').trim();
  const flagged = Number(s.flagged || 0) + Number(pc.returned || 0);
  const waiting = Number(s.awaitingReview || 0) + Number(pc.pending || 0);
  const att = V2.attendance || {}, attCount = (att.actionRequired || []).length;
  c.innerHTML =
  '<section class="v2-hero" data-asset-bg="HOME_HERO"><div class="v2-hero-copy">' +
    '<h1><span class="v2-sun">☀</span> ' + greet + (first ? ', ' + v2Esc(first) : '') + '</h1>' +
    '<p>Here’s what’s happening in your clinical program today.</p><div class="v2-meta">' +
    '<span class="v2-mi"><svg><use href="#v2i-calendar"/></svg>' + v2Esc(today) + '</span>' +
    (h.clinicalTerm ? '<span class="v2-divider"></span><span class="v2-mi"><svg><use href="#v2i-cap"/></svg>' + v2Esc(h.clinicalTerm) + '</span>' : '') +
    '<span class="v2-divider"></span><span class="v2-mi"><svg><use href="#v2i-users"/></svg>' + (APP.students || []).length + ' Students Active</span></div></div>' +
    '<div class="v2-status-grid">' +
    v2Status('flag', 'HOME_FLAGGED', flagged, 'Flagged', 'Needs your attention', "showPage('review');loadReviewQueue('flagged')") +
    v2Status('wait', 'HOME_WAITING_REVIEW', waiting, 'Waiting for Review', 'New submissions', "showPage('review');loadReviewQueue('pending')") +
    v2Status('done', 'HOME_REVIEWED', Number(s.reviewedToday || 0), 'Reviewed', 'Completed today', "showPage('review');loadReviewQueue('reviewedToday')") +
    v2Status('sched', 'HOME_TODAYS_SCHEDULE', '', 'Today’s Schedule', 'View site assignments', "showPage('schedules')") +
  '</div></section>' +
  '<div class="v2-content"><div class="v2-grid"><section class="v2-panel">' +
    '<div class="v2-panel-head"><div class="v2-panel-title">' + v2Ico('clock') + 'Recent Activity</div>' +
    '<button class="v2-link" onclick="showPage(\'review\');loadReviewQueue(\'all\')">View All →</button></div>' +
    '<div class="v2-chips">' + [['all', 'All Activity'], ['evaluation', 'Competencies'], ['professional', 'Professional Competency'],
      ['pending', 'Awaiting Review'], ['flagged', 'Flagged']].map(function(x) {
      return '<button class="v2-chip ' + (V2.chip === x[0] ? 'active' : '') + '" onclick="V2.chip=\'' + x[0] + '\';renderHome()">' + x[1] + '</button>';
    }).join('') + '</div>' + v2Activity() + '</section>' +
  '<aside class="v2-right"><section class="v2-panel v2-entry"><div class="v2-entrytop"><strong><span style="font-size:25px;line-height:1;color:#fff">✦</span>New Entry</strong><span>Add a new record to the clinical program.</span></div><div class="v2-entrygrid">' +
    v2EntryBtn('eo', 'clipboard', 'Competency<br>Evaluation', 'competencyEvaluation') +
    v2EntryBtn('eb', 'file', 'Clinical<br>Test', 'clinicalTest') +
    v2EntryBtn('ep', 'file', 'Quiz', 'quizzes') +
    v2EntryBtn('eb', 'clipboard', 'Case<br>Presentation', 'casePresentation') +
    v2EntryBtn('eg', 'check', 'Professional<br>Competency', 'professional') +
    v2EntryBtn('er', 'alert', 'Grade Points<br>Reduction', 'deduction') +
    '<button class="v2-entrybtn" onclick="showPage(\'attendance\')"><span class="v2-eicon v2-er"><svg><use href="#v2i-calendar"/></svg></span><span>Attendance<br>Event</span><span>›</span></button>' +
  '</div></section>' +
  '<section class="v2-panel v2-snapshot"><h3>' + v2Ico('chart') + 'Program Snapshot</h3>' +
    v2Snap('sg', 'users', (APP.students || []).length, 'Active Students', "showPage('students')") +
    v2Snap('sy', 'clipboard', Number(s.awaitingReview || 0), 'Evaluations Awaiting Review', "showPage('review');loadReviewQueue('pending')") +
    v2Snap('sb', 'check', Number(pc.pending || 0), 'Professional Competencies to Review', "V2.chip='professional';renderHome()") +
    v2Snap('sb', 'alert', V2.attendance ? attCount : '…', 'Attendance Concerns', "showPage('attendance')") +
    v2Snap('sy', 'flag', Number(s.failed || 0), 'Failed Evaluations', "showPage('review');loadReviewQueue('failed')") +
    v2Snap('sg', 'calendar', Number(h.availabilityUnread || 0), 'Availability Requests to Review', 'v2ToggleBell(event)') +
  '</section>' +
  '<section class="v2-panel v2-snapshot" id="homeAttendanceActions"><div class="muted small">Loading attendance…</div></section>' +
  '</aside></div>' +
  '<section class="v2-quick"><div class="v2-qintro"><div class="v2-qstar">★</div><div><strong>Quick Access</strong><span>Jump to a section or view key information.</span></div></div>' +
    v2Quick('QUICK_STUDENTS', 'Students', 'View and manage student records', 'students') +
    v2Quick('QUICK_INSTRUCTORS', 'Clinical Instructors', 'Manage CI information and availability', 'instructors') +
    v2Quick('QUICK_SITES', 'Clinical Sites', 'Site details and placement information', 'sites') +
    v2Quick('QUICK_SCHEDULING', 'Scheduling', 'View rotations and assignments', 'schedules') +
    v2Quick('QUICK_PAPERWORK', 'Clinical Paperwork', 'Generate and print forms and reports', 'paperwork') +
    v2Quick('QUICK_SYSTEM_SETUP', 'System & Setup', 'Manage program settings and data', 'system') +
  '</section></div>';
  v2LoadAssets();
  setTimeout(loadHomeAttendanceActions, 0);
};
function v2Status(cls, asset, n, title, sub, onclick) {
  return '<button class="v2-status v2-' + cls + '" onclick="' + onclick + '"><div class="v2-status-img" data-asset-bg="' + asset + '"></div>' +
    (n !== '' ? '<span class="v2-count">' + v2Esc(n) + '</span>' : '') +
    '<div class="v2-status-copy"><strong>' + title + '</strong><span>' + sub + '</span></div><span class="v2-arrow">›</span></button>';
}
function v2EntryBtn(color, icon, label, category) {
  return '<button class="v2-entrybtn" onclick="v2NewEntry(\'' + category + '\')"><span class="v2-eicon v2-' + color + '"><svg><use href="#v2i-' + icon + '"/></svg></span><span>' + label + '</span><span>›</span></button>';
}
function v2Snap(cls, icon, n, label, onclick) {
  return '<div class="v2-snaprow" style="cursor:pointer" onclick="' + onclick + '"><span class="v2-snapico v2-' + cls + '"><svg><use href="#v2i-' + icon + '"/></svg></span><strong>' + v2Esc(n) + '</strong><span>' + v2Esc(label) + '</span><span>›</span></div>';
}
function v2Quick(asset, title, sub, key) {
  return '<button class="v2-qcard" onclick="v2Go(\'' + key + '\')"><div class="v2-qphoto" data-asset-bg="' + asset + '"></div><div class="v2-qcopy"><strong>' + title + '</strong><span>' + sub + '</span></div></button>';
}
function v2Activity() {
  if (V2.homeError) return '<div class="v2-rows"><div class="entry-message error">Recent activity could not be loaded: ' + v2Esc(V2.homeError) + ' <button class="secondary-button" onclick="v2LoadHome(true)">Retry</button></div></div>';
  if (!V2.home) return '<div class="v2-rows"><div class="muted small" style="padding:14px">Loading recent activity…</div></div>';
  let items = (V2.home.recent || []).filter(function(x) {
    const st = String(x.coordinatorReviewStatus || '').toLowerCase();
    if (V2.chip === 'evaluation') return x.kind === 'evaluation';
    if (V2.chip === 'professional') return x.kind === 'professional';
    if (V2.chip === 'pending') return st !== 'reviewed' && !x.flagged;
    if (V2.chip === 'flagged') return x.flagged;
    return true;
  }).slice(0, 12);
  if (!items.length) return '<div class="v2-rows"><div class="muted small" style="padding:14px">Nothing here right now.</div></div>';
  let day = '', out = '';
  items.forEach(function(x) {
    const d = v2DayKey(x);
    if (d !== day) {day = d; out += (out ? '</div>' : '') + '<div class="v2-day">' + v2Esc(v2DayLabel(d)) + '</div><div class="v2-rows">';}
    const reviewed = String(x.coordinatorReviewStatus || '').toLowerCase() === 'reviewed';
    const color = x.flagged ? 'r' : reviewed ? 'g' : x.kind === 'professional' ? 'p' : 'y';
    const label = x.kind === 'professional' ? 'Professional Competency' : (x.evaluationType || 'Evaluation');
    const title = x.flagged ? label + ' flagged' : reviewed ? label + ' reviewed' : label + ' received';
    out += '<div class="v2-row ' + (x.flagged ? 'v2-alert' : '') + '"><div class="v2-eventicon v2-' + color + '"><svg><use href="#v2i-' +
      (x.flagged ? 'flag' : reviewed ? 'check' : 'clipboard') + '"/></svg></div><div class="v2-rmain"><strong>' + v2Esc(title) +
      (x.result ? '<span class="v2-received-time">' + v2Esc(x.result) + (x.gradeDisplay ? ' · ' + v2Esc(x.gradeDisplay) : '') + '</span>' : '') +
      '</strong><div class="v2-rmeta"><a onclick="v2OpenStudent(\'' + escapeJs(x.studentId) + '\')" style="cursor:pointer">' + v2Esc(x.student) + '</a>' +
      (x.examination && x.kind !== 'professional' ? '<span>' + v2Esc(x.examination) + '</span>' : '') +
      (x.anatomicalArea && x.kind === 'professional' ? '<span>' + v2Esc(x.anatomicalArea) + '</span>' : '') +
      (x.clinicalSite ? '<span>' + v2Esc(x.clinicalSite) + '</span>' : '') +
      (x.evaluator ? '<span>' + v2Esc(x.evaluator) + '</span>' : '') + '</div></div>' +
      '<button class="v2-action ' + (x.flagged ? 'red' : reviewed ? 'green' : '') + '" onclick="v2OpenReview(\'' + x.kind + '\',\'' + escapeJs(x.itemId) + '\')">' +
      (reviewed ? 'Open' : 'Review') + '</button></div>';
  });
  return out + '</div>';
}
function v2DayKey(x) {
  const t = Number(x.dateValue || 0);
  if (!t) return String(x.date || '').slice(0, 10);
  const p = new Date(t);
  return p.getFullYear() + '-' + String(p.getMonth() + 1).padStart(2, '0') + '-' + String(p.getDate()).padStart(2, '0');
}
function v2DayLabel(d) {
  if (!d) return 'Undated';
  const t = new Date(), y = new Date(Date.now() - 864e5);
  const k = function(x) {return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0');};
  if (d === k(t)) return 'Today';
  if (d === k(y)) return 'Yesterday';
  const p = new Date(d + 'T12:00:00');
  return isNaN(p) ? d : p.toLocaleDateString(undefined, {weekday: 'short', month: 'short', day: 'numeric', year: 'numeric'});
}

/* ---------- New Entry shortcuts ---------- */
function v2NewEntry(category) {V2.pendingEntry = category; showNewEntry(); v2SetActive('newEntry');}
const v2OriginalRenderNewEntry = renderNewEntry;
renderNewEntry = function() {
  v2OriginalRenderNewEntry();
  const sel = document.getElementById('entryCategory');
  if (V2.pendingEntry && sel && [].some.call(sel.options, function(o) {return o.value === V2.pendingEntry;})) {
    sel.value = V2.pendingEntry; V2.pendingEntry = '';
    if (typeof updateGradeEntryFields === 'function') updateGradeEntryFields();
  }

/* ---------- Review page: per-row Review + Professional Competency list ---------- */

function v2ReviewAction(action) {

  if (r) {
    h += '<div class="small" style="margin-bottom:6px">Status: ' + v2CiPill(r.status === 'Requested' ? 'Waiting for instructor' : r.status, {Accepted: 'green', Submitted: 'amber', Returned: 'red'}[r.status] || 'blue') +
      (r.sharedAt ? ' · summary shared ' + v2Esc(v2CiDate(r.sharedAt.slice(0, 10))) : '') + (r.summaryUrl ? ' · <a target="_blank" rel="noopener" href="' + v2Esc(r.summaryUrl) + '">Summary PDF</a>' : '') + '</div>';
    if (r.status === 'Submitted' || r.status === 'Accepted' || (r.status === 'Returned' && r.observations)) {
      h += '<div style="font-weight:700;margin-top:6px">1. Observations and Insights</div>' + para(r.observations) +
        '<div style="font-weight:700;margin-top:6px">2. Learning Experiences</div>' + para(r.learning) +
        '<div style="font-weight:700;margin-top:6px">3. Goals for the future, Improvements</div>' + para(r.goals) +
        '<div class="small" style="margin-top:6px">' + (r.docUrl ? '<a target="_blank" rel="noopener" href="' + v2Esc(r.docUrl) + '">Open reflection (Doc)</a>' : '') + (r.pdfUrl ? ' · <a target="_blank" rel="noopener" href="' + v2Esc(r.pdfUrl) + '">PDF</a>' : '') +
        (r.submittedAt ? ' · submitted ' + v2Esc(v2CiDate(r.submittedAt.slice(0, 10))) : '') + (r.coordinatorNote ? ' · your note: ' + v2Esc(r.coordinatorNote) : '') + '</div>';
    }
    if (r.status === 'Submitted') {
      h += '<label class="v2-dlabel" for="v2rf-notes">Note to the instructor (required to return)</label><textarea id="v2rf-notes" rows="2" maxlength="2000" style="width:100%"></textarea>' +
        '<div style="display:flex;gap:10px;align-items:center;justify-content:flex-end;margin-top:6px"><label class="small"><input type="checkbox" id="v2rf-demail" checked> E-mail the instructor</label>' +
        '<button class="v2-btn-red" onclick="v2CiReflDecide(\'' + escapeJs(r.reflectionId) + '\',\'Returned\')">Return</button><button class="primary-button" onclick="v2CiReflDecide(\'' + escapeJs(r.reflectionId) + '\',\'Accepted\')">Accept</button></div><div id="v2rf-dmsg" class="small"></div>';
    }
  } else h += '<div class="small muted" style="margin-bottom:6px">No feedback summary shared for ' + v2Esc(d.term) + ' yet.</div>';
  if (!r || r.status === 'Requested' || r.status === 'Returned') {
    h += '<details' + (r ? '' : ' open') + ' style="margin-top:8px"><summary class="small" style="cursor:pointer;font-weight:700">' + (r ? 'Update the feedback summary' : 'Share the student feedback summary and request the reflection') + '</summary>' +
      '<label class="v2-dlabel" for="v2rf-text">Summary of student feedback (shown to the instructor)</label><textarea id="v2rf-text" rows="5" maxlength="20000" style="width:100%" placeholder="Paste the summary of what students said about this instructor.">' + v2Esc(r ? r.summaryText : '') + '</textarea>' +
      '<div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-top:6px"><div><label class="small muted">Or attach the summary (PDF)</label><br><input type="file" id="v2rf-pdf" accept="application/pdf"></div>' +
      '<div><label class="small muted">Complete by (optional)</label><br><input id="v2rf-due" placeholder="e.g. Dec 15" style="width:120px"></div>' +
      '<label class="small"><input type="checkbox" id="v2rf-email" checked> E-mail the instructor</label>' +
      '<button class="primary-button" id="v2rf-go" onclick="v2CiReflShare(\'' + escapeJs(c.evaluatorId) + '\')">' + (r ? 'Update summary' : 'Share &amp; request reflection') + '</button></div><div id="v2rf-msg" class="small" style="margin-top:4px"></div></details>';
  }
  const past = (c.reflections || []).filter(function(x) {return x.term !== d.term;});
  if (past.length) h += '<div class="small" style="margin-top:10px"><b>Earlier semesters:</b> ' + past.map(function(x) {return v2Esc(x.term) + ' ' + v2Esc(x.status) + (x.docUrl ? ' (<a target="_blank" rel="noopener" href="' + v2Esc(x.docUrl) + '">Doc</a>)' : '');}).join(' · ') + '</div>';
  return h;
}
function v2CiReflShare(id) {
  const g = function(x) {return document.getElementById(x);}, f = g('v2rf-pdf').files[0], m = g('v2rf-msg');
  if (!g('v2rf-text').value.trim() && !f) {m.textContent = 'Paste the summary or attach it as a PDF.'; return;}
  if (f && f.size > 10 * 1024 * 1024) {m.textContent = 'The PDF must be 10 MB or smaller.'; return;}
  g('v2rf-go').disabled = true; m.textContent = 'Saving…';
  const send = function(b64) {
    v2Run('dashboardV2ReflectionShare', [{evaluatorId: id, term: V2.ci.data.term, summaryText: g('v2rf-text').value, pdfBase64: b64 || '', due: g('v2rf-due').value, email: g('v2rf-email').checked}],
      function(r) {v2CloseReview(); V2.ci.msg = '✓ Summary shared · instructor notified' + (r.emailed ? ' and e-mailed' : ''); v2LoadInstructors();},
      function(e) {g('v2rf-go').disabled = false; m.textContent = errorMessage(e);});
  };
  if (!f) return send('');
  const rd = new FileReader(); rd.onload = function() {send(String(rd.result).split(',')[1] || '');}; rd.onerror = function() {g('v2rf-go').disabled = false; m.textContent = 'Could not read the file.';}; rd.readAsDataURL(f);
}
function v2CiReflDecide(id, decision) {
  const n = document.getElementById('v2rf-notes').value, m = document.getElementById('v2rf-dmsg');
  if (decision === 'Returned' && !n.trim()) {m.textContent = 'Add a note so the instructor knows what to change.'; return;}
  m.textContent = 'Saving…';
  v2Run('dashboardV2ReflectionDecide', [{reflectionId: id, decision: decision, notes: n, email: document.getElementById('v2rf-demail').checked}],
    function(r) {v2CloseReview(); V2.ci.msg = '✓ Reflection ' + (decision === 'Accepted' ? 'accepted' : 'returned') + (r.emailed ? ' · instructor e-mailed' : ''); v2LoadInstructors(); v2LoadHome(true);},
    function(e) {m.textContent = errorMessage(e);});
}
function v2CiRecordDos(id) {
  const g = function(x) {return document.getElementById(x);};
  const req = {evaluatorId: id, dosimeterId: g('v2ci-dos').value, start: g('v2ci-ds').value, end: g('v2ci-de').value};
  if (!req.dosimeterId || !req.start || !req.end) {g('v2ci-dmsg').textContent = 'Enter the dosimeter ID and the wear start and end dates.'; return;}
  g('v2ci-dgo').disabled = true; g('v2ci-dmsg').textContent = 'Saving…';
  v2Run('dashboardV2RecordDosimeter', [req], function() {v2CloseReview(); V2.ci.msg = '✓ Dosimeter wear period recorded'; v2LoadInstructors();},
    function(e) {g('v2ci-dgo').disabled = false; g('v2ci-dmsg').textContent = errorMessage(e);});
}

/* ---------- System & Setup, Help ---------- */
function v2RenderSystem() {
  const c = document.getElementById('content');
  c.innerHTML = '<h1 class="page-title">System &amp; Setup</h1><div class="page-subtitle">Program data lives in the CCMS workbook. Open a tab to maintain reference data.</div><div class="section" id="v2-system">Loading…</div>';
  v2Run('dashboardV2SystemLinks', [], function(r) {
    const el = document.getElementById('v2-system'); if (!el) return;
    el.innerHTML = '<p><a class="primary-button" target="_blank" rel="noopener" href="' + v2Esc(r.workbook) + '">Open CCMS workbook</a></p><div class="landing-grid">' +
      (r.sheets || []).map(function(s) {return '<a class="landing-card" style="text-decoration:none;color:inherit" target="_blank" rel="noopener" href="' + v2Esc(s.url) + '"><h3>' + v2Esc(s.name) + '</h3><p>Open tab ›</p></a>';}).join('') + '</div>';
  }, function(e) {const el = document.getElementById('v2-system'); if (el) el.innerHTML = '<div class="entry-message error">' + v2Esc(errorMessage(e)) + '</div>';});
}
function v2RenderHelp() {
  document.getElementById('content').innerHTML = '<h1 class="page-title">Help &amp; Support</h1><div class="page-subtitle">Where things are in the Coordinator Dashboard.</div><div class="landing-grid">' +
    [['Home', 'Flagged, waiting and reviewed counts, recent submissions from the Clinical Instructor Portal and Google Forms, New Entry shortcuts and the program snapshot.'],
     ['Review / Return', 'Open any submission to accept it or return it to the clinical instructor with notes. The instructor sees returns and acceptances on their Portal home and notifications; their replies appear under the bell.'],
     ['Students', 'Student summary, clinical history, requirements, grades and documents.'],
     ['Scheduling', 'Semester planning, room rotations and attendance / ETO.'],
     ['Reports & Paperwork', 'Records & documents, New Entry, and Assessment (clinical review analysis).'],
     ['System & Setup', 'Links to the CCMS workbook tabs that hold reference data.']].map(function(x) {
      return '<div class="landing-card"><h3>' + x[0] + '</h3><p>' + x[1] + '</p></div>';
    }).join('') + '</div>';
}

/* ---------- start ---------- */
(function() {
  const go = function() {v2SetActive(APP.page || 'home'); v2LoadHome(false); v2LoadAssets();};
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go); else go();
})();

</script>
