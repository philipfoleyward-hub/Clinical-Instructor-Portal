<!DOCTYPE html>
<html>

<head>

  <base target="_top">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f7fb;
      color: #172033;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .topbar {
      min-height: 68px;
      background: white;
      border-bottom: 1px solid #dde3ec;
      padding: 0 28px;

      display: flex;
      align-items: center;
      gap: 28px;

      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      font-size: 20px;
      font-weight: 700;
      white-space: nowrap;
    }

    .nav {
      flex: 1;
      display: flex;
      gap: 5px;
    }

    .nav-button {
      border: 0;
      background: transparent;
      color: #5f6c81;
      padding: 11px 15px;
      border-radius: 8px;
      cursor: pointer;
    }

    .nav-button:hover {
      background: #f1f4f8;
    }

    .nav-button.active {
      background: #e9eef7;
      color: #172033;
      font-weight: 600;
    }

    .new-entry {
      border: 0;
      background: #263a59;
      color: white;
      padding: 11px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    .new-entry:hover {
      background: #1b2c45;
    }

    .entry-grid {
      display: grid;
      grid-template-columns:
        repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .entry-field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    [hidden] {
      display: none !important;
    }

    .entry-field.full {
      grid-column: 1 / -1;
    }

    .entry-field label {
      color: #435168;
      font-size: 13px;
      font-weight: 700;
    }

    .entry-field input,
    .entry-field select,
    .entry-field textarea {
      width: 100%;
      border: 1px solid #cfd7e3;
      border-radius: 8px;
      background: white;
      color: #172033;
      padding: 11px 12px;
    }

    .entry-field textarea {
      min-height: 95px;
      resize: vertical;
      font: inherit;
    }

    .entry-field input:focus,
    .entry-field select:focus,
    .entry-field textarea:focus {
      outline: 2px solid #b8c8e0;
      border-color: #516d94;
    }

    .entry-help {
      color: #748096;
      font-size: 12px;
      line-height: 1.4;
    }

    .supporting-document-field {
      margin-top: 8px;
      padding: 16px;
      border: 1px solid #cfd8e6;
      border-radius: 9px;
      background: #f8fafc;
    }

    .supporting-document-field label {
      display: block;
      margin-bottom: 9px;
      color: #172033;
      font-size: 14px;
      font-weight: 700;
    }

    .supporting-document-field input[type="file"] {
      display: block;
      width: 100%;
      padding: 10px;
      background: white;
      border: 1px solid #bdc8d8;
      border-radius: 7px;
      cursor: pointer;
    }

    .supporting-document-name {
      min-height: 18px;
      color: #263a59;
      font-size: 13px;
      font-weight: 600;
    }

    .entry-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 22px;
    }

    .primary-button,
    .secondary-button {
      border-radius: 8px;
      padding: 11px 17px;
      cursor: pointer;
      font-weight: 700;
    }

    .primary-button {
      border: 0;
      background: #263a59;
      color: white;
    }

    .secondary-button {
      border: 1px solid #cfd7e3;
      background: white;
      color: #35445b;
    }

    .primary-button:disabled,
    .secondary-button:disabled {
      cursor: wait;
      opacity: .55;
    }

    .entry-message {
      border-radius: 8px;
      margin-bottom: 18px;
      padding: 12px 14px;
      line-height: 1.4;
    }

    .entry-message.success {
      border: 1px solid #a9d7bd;
      background: #edf9f2;
      color: #1f663d;
    }

    .entry-message.error {
      border: 1px solid #e5b3b3;
      background: #fff2f2;
      color: #8a2727;
    }

    .entry-summary {
      border-left: 4px solid #516d94;
      background: #f4f7fb;
      border-radius: 7px;
      margin-bottom: 20px;
      padding: 13px 15px;
      color: #4d5d74;
      font-size: 13px;
      line-height: 1.5;
    }

    .page {
      max-width: 1500px;
      margin: 0 auto;
      padding: 30px;
    }

    .page-title {
      margin: 0 0 6px;
      font-size: 28px;
    }

    .page-subtitle {
      color: #6e7a8f;
      margin-bottom: 26px;
    }

    .section {
      background: white;
      border: 1px solid #e0e5ed;
      border-radius: 12px;
      padding: 22px;
      margin-bottom: 22px;
    }

    .section-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .subsection-title {
      font-weight: 700;
      margin-bottom: 12px;
    }

    .muted {
      color: #748096;
    }

    .small {
      font-size: 12px;
    }

    .summary-grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(175px, 1fr));
      gap: 14px;
      margin-bottom: 22px;
    }

    .summary-card {
      background: white;
      border: 1px solid #e0e5ed;
      border-radius: 12px;
      padding: 18px;
    }

    .summary-label {
      font-size: 12px;
      color: #657187;
      font-weight: 700;
      margin-bottom: 9px;
      text-transform: uppercase;
      letter-spacing: .03em;
    }

    .summary-value {
      font-size: 27px;
      font-weight: 700;
    }

    .summary-detail {
      font-size: 12px;
      color: #788498;
      margin-top: 5px;
      line-height: 1.4;
    }

    .term-banner {
      background: white;
      border: 1px solid #e0e5ed;
      border-radius: 12px;
      padding: 20px 22px;
      margin-bottom: 20px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .term-name {
      font-size: 22px;
      font-weight: 700;
    }

    .term-status {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      background: #edf2f8;
      font-size: 12px;
      font-weight: 700;
      margin-top: 6px;
    }

    .grade-box {
      background: white;
      border: 1px solid #e0e5ed;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 22px;
    }

    .grade-value {
      font-size: 32px;
      font-weight: 700;
      margin-top: 5px;
    }

    .grade-detail-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 14px;
    }

    .grade-detail-table th,
    .grade-detail-table td {
      padding: 10px 12px;
      border-bottom: 1px solid #e7ebf0;
      text-align: left;
      vertical-align: top;
    }

    .grade-detail-table th {
      color: #52606d;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .03em;
    }

    .grade-detail-table td.number,
    .grade-detail-table th.number {
      text-align: right;
      white-space: nowrap;
    }

    .grade-status-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .grade-status {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      background: #edf2f8;
      font-size: 12px;
      font-weight: 700;
    }

    .grade-status.met {
      background: #e8f5ed;
      color: #1f6b3b;
    }

    .grade-status.warning {
      background: #fff1e6;
      color: #9a4d00;
    }

    .grade-status.pending {
      background: #edf2f8;
      color: #52606d;
    }

    .students-layout {
      display: grid;
      grid-template-columns: 275px 1fr;
      gap: 22px;
    }

    .student-sidebar {
      background: white;
      border: 1px solid #e0e5ed;
      border-radius: 12px;
      overflow: hidden;
      align-self: start;
    }

    .student-search-wrap {
      padding: 14px;
      border-bottom: 1px solid #e6eaf0;
    }

    .student-search {
      width: 100%;
      border: 1px solid #cdd5df;
      border-radius: 7px;
      padding: 10px;
    }

    .student-list {
      max-height: calc(100vh - 220px);
      overflow-y: auto;
    }

    .student-item {
      padding: 14px 16px;
      border-bottom: 1px solid #eef1f5;
      cursor: pointer;
    }

    .student-item:hover {
      background: #f7f9fc;
    }

    .student-item.active {
      background: #edf2f9;
    }

    .student-name {
      font-weight: 700;
      margin-bottom: 4px;
    }

    .student-meta {
      color: #778398;
      font-size: 12px;
    }

    .student-header h2 {
      margin: 0 0 5px;
      font-size: 28px;
    }

    .student-header {
      margin-bottom: 18px;
    }

    .student-tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 22px;
      border-bottom: 1px solid #dfe4ec;
      overflow-x: auto;
    }

    .student-tab {
      border: 0;
      border-bottom: 3px solid transparent;
      padding: 11px 14px;
      background: transparent;
      color: #647087;
      cursor: pointer;
      white-space: nowrap;
    }

    .student-tab.active {
      border-bottom-color: #263a59;
      color: #172033;
      font-weight: 700;
    }

    .requirement-columns {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(290px, 1fr));
      gap: 16px;
      margin-bottom: 22px;
    }

    .requirement-box {
      background: white;
      border: 1px solid #e0e5ed;
      border-radius: 10px;
      overflow: hidden;
    }

    .requirement-header {
      font-weight: 700;
      padding: 14px 15px;
      background: #f7f9fc;
      border-bottom: 1px solid #e0e5ed;
    }

    .requirement-row {
      padding: 13px 15px;
      border-bottom: 1px solid #eef1f5;
    }

    .requirement-row:last-child {
      border-bottom: 0;
    }

    .requirement-name {
      font-weight: 600;
    }

    .requirement-note {
      margin-top: 5px;
      font-size: 12px;
      color: #748096;
      line-height: 1.45;
    }

    .tag {
      display: inline-block;
      margin-top: 6px;
      background: #eef2f7;
      color: #58657a;
      padding: 4px 7px;
      border-radius: 999px;
      font-size: 11px;
    }

    .alert {
      background: #fff7e8;
      border: 1px solid #eed7a9;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .alert-title {
      font-weight: 700;
      margin-bottom: 4px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      text-align: left;
      padding: 11px 9px;
      border-bottom: 1px solid #dfe4ec;
      color: #657187;
      font-size: 11px;
      text-transform: uppercase;
    }

    td {
      padding: 13px 9px;
      border-bottom: 1px solid #eef1f5;
      vertical-align: top;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .empty {
      text-align: center;
      color: #79859a;
      padding: 35px 15px;
    }

    .loading {
      text-align: center;
      color: #758196;
      padding: 50px;
    }

    .error {
      padding: 14px;
      border-radius: 8px;
      background: #fff1f1;
      border: 1px solid #efcccc;
      color: #812c2c;
    }

    .action-button {
      padding: 8px 11px;
      border: 1px solid #cfd6e1;
      border-radius: 7px;
      background: white;
      cursor: pointer;
    }

    .action-button:hover {
      background: #f4f6f9;
    }

    .action-button:disabled {
      opacity: .45;
      cursor: default;
    }


    .review-stat-card {
      cursor: pointer;
      transition: border-color .15s ease, box-shadow .15s ease;
    }

    .review-stat-card:hover {
      border-color: #b8c3d2;
      box-shadow: 0 2px 8px rgba(23, 32, 51, .06);
    }

    .review-stat-card.active {
      border-color: #263a59;
      box-shadow: inset 0 0 0 1px #263a59;
    }

    .review-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .review-actions {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }

    .action-button.primary {
      background: #263a59;
      color: white;
      border-color: #263a59;
    }

    .action-button.flagged {
      background: #fff7e8;
      border-color: #d8b96f;
    }

    .review-status {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 7px;
      border-radius: 999px;
      background: #eef2f7;
      display: inline-block;
    }

    .review-status.reviewed {
      background: #edf7ef;
    }

    .review-message {
      margin-bottom: 14px;
      padding: 10px 12px;
      border-radius: 8px;
      background: #f4f7fb;
      color: #58657a;
      font-size: 13px;
    }


    .clinical-review-controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
      align-items: end;
    }

    .clinical-review-field label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #657187;
      margin-bottom: 7px;
      text-transform: uppercase;
      letter-spacing: .03em;
    }

    .clinical-review-field select {
      width: 100%;
      border: 1px solid #cdd5df;
      border-radius: 7px;
      padding: 10px 11px;
      background: white;
    }

    .clinical-review-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .clinical-review-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .clinical-history-term {
      background: white;
      border: 1px solid #e0e5ed;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 18px;
    }

    .clinical-history-heading {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 16px;
    }

    .clinical-history-grade {
      text-align: right;
    }

    .clinical-history-grade-value {
      font-size: 25px;
      font-weight: 700;
    }

    .clinical-history-block {
      margin-top: 18px;
    }

    .clinical-history-block-title {
      font-size: 13px;
      font-weight: 700;
      color: #52606d;
      text-transform: uppercase;
      letter-spacing: .03em;
      margin-bottom: 8px;
    }

    .clinical-history-relationship {
      background: #f7f9fc;
      border: 1px solid #e0e5ed;
      border-radius: 9px;
      padding: 14px;
      margin-top: 14px;
    }

    .clinical-review-table-wrap,
    .clinical-history-table-wrap {
      width: 100%;
      overflow-x: auto;
    }

    .clinical-review-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 18px;
      color: #657187;
      font-size: 12px;
      margin-bottom: 14px;
    }

    .clinical-review-note {
      background: #f7f9fc;
      border: 1px solid #e0e5ed;
      border-radius: 8px;
      padding: 12px 14px;
      color: #5f6b7d;
      font-size: 12px;
      line-height: 1.45;
      margin-bottom: 16px;
    }



    /* ============================================================
     * 2026 UI POLISH / INFORMATION HIERARCHY
     * ============================================================ */

    :root {
      --ink: #172033;
      --muted: #66758a;
      --navy: #263a59;
      --navy-strong: #1b2c45;
      --line: #dfe5ed;
      --surface: #ffffff;
      --surface-soft: #f7f9fc;
      --page-bg: #f4f6f9;
      --success-bg: #eaf6ef;
      --success-ink: #23633d;
      --warn-bg: #fff4e8;
      --warn-ink: #8a4b08;
      --info-bg: #eaf1fb;
      --info-ink: #2e527f;
    }

    body {
      background: var(--page-bg);
      color: var(--ink);
      line-height: 1.45;
    }

    .topbar {
      min-height: 64px;
      padding: 0 26px;
      gap: 24px;
      box-shadow: 0 1px 0 rgba(23, 32, 51, .02);
    }

    .brand {
      font-size: 18px;
      letter-spacing: -.015em;
    }

    .nav {
      align-self: stretch;
      align-items: stretch;
      gap: 2px;
    }

    .nav-button {
      position: relative;
      border-radius: 0;
      padding: 0 13px;
      min-height: 63px;
      font-size: 13px;
      font-weight: 600;
    }

    .nav-button:hover {
      background: transparent;
      color: var(--ink);
    }

    .nav-button.active {
      background: transparent;
      color: var(--ink);
      font-weight: 750;
    }

    .nav-button.active::after {
      content: '';
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: -1px;
      height: 3px;
      border-radius: 3px 3px 0 0;
      background: var(--navy);
    }

    .new-entry,
    .primary-button {
      border-radius: 8px;
      box-shadow: 0 1px 2px rgba(23, 32, 51, .08);
    }

    .page {
      max-width: 1480px;
      padding: 28px 30px 44px;
    }

    .page-title {
      font-size: 26px;
      letter-spacing: -.025em;
      line-height: 1.15;
    }

    .page-subtitle {
      max-width: 900px;
      margin-top: 7px;
      margin-bottom: 24px;
      color: var(--muted);
      line-height: 1.55;
    }

    .page-heading-row,
    .section-heading-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 18px;
      flex-wrap: wrap;
    }

    .section {
      border-color: var(--line);
      border-radius: 10px;
      box-shadow: 0 1px 2px rgba(23, 32, 51, .025);
    }

    .section-flat {
      box-shadow: none;
    }

    .section-title {
      letter-spacing: -.01em;
    }

    .summary-grid {
      gap: 12px;
    }

    .summary-card {
      border-radius: 9px;
      border-color: var(--line);
      padding: 16px 17px;
      box-shadow: none;
    }

    .summary-label {
      color: #6c788b;
      letter-spacing: .055em;
    }

    .summary-value {
      font-size: 25px;
      letter-spacing: -.02em;
    }

    .student-sidebar,
    .requirement-box,
    .term-banner,
    .grade-box,
    .clinical-history-term {
      border-color: var(--line);
      border-radius: 10px;
      box-shadow: none;
    }

    table tbody tr {
      transition: background .12s ease;
    }

    table tbody tr:hover {
      background: #f8fafc;
    }

    .clinical-review-table-wrap,
    .clinical-history-table-wrap {
      border: 1px solid var(--line);
      border-radius: 9px;
      overflow: auto;
      max-height: 620px;
    }

    .clinical-review-table-wrap table,
    .clinical-history-table-wrap table {
      min-width: 960px;
    }

    .clinical-review-table-wrap thead th,
    .clinical-history-table-wrap thead th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: #f8fafc;
      box-shadow: 0 1px 0 var(--line);
    }

    .clinical-review-controls {
      padding-top: 2px;
    }

    .clinical-review-field select,
    .student-search,
    .entry-field input,
    .entry-field select,
    .entry-field textarea {
      transition: border-color .12s ease, box-shadow .12s ease;
    }

    .clinical-review-field select:focus,
    .student-search:focus {
      outline: none;
      border-color: #7088aa;
      box-shadow: 0 0 0 3px rgba(81, 109, 148, .12);
    }

    .assessment-context-band {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin: 0 0 14px;
      padding: 11px 13px;
      background: #f7f9fc;
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .assessment-context-primary {
      font-weight: 750;
      margin-right: 3px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .status-pill.neutral {
      background: #eef2f7;
      color: #58657a;
    }

    .status-pill.info {
      background: var(--info-bg);
      color: var(--info-ink);
    }

    .eyebrow {
      margin-bottom: 5px;
      color: #66758a;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .07em;
      text-transform: uppercase;
    }

    .attendance-intro-band {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 18px;
      margin-bottom: 18px;
      padding: 18px 20px;
      background: white;
      border: 1px solid var(--line);
      border-left: 4px solid var(--navy);
      border-radius: 9px;
    }

    .attendance-intro-title {
      margin-bottom: 5px;
      font-size: 18px;
      font-weight: 760;
      letter-spacing: -.01em;
    }

    .attendance-preview-grid {

  <button data-v2="system" onclick="v2Go('system')"><span class="v2-icon"><svg><use href="#v2i-gear"/></svg></span><span>System &amp; Setup</span></button>
 </nav>
 <button class="v2-help" onclick="v2Go('help')"><span class="v2-icon"><svg><use href="#v2i-help"/></svg></span><span>Help &amp; Support</span></button>
</aside>
<section class="v2-shell">
<header class="v2-topbar">
 <div class="v2-brand" style="cursor:pointer" onclick="v2Go('home')">
  <div class="v2-xray"><img src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" data-asset-img="BRAND_XRAY" alt="" style="width:100%;height:100%;object-fit:cover"></div><div><strong>Clinical Management System</strong><small>Radiologic Technology</small></div>
 </div>
 <div class="v2-search"><span class="v2-icon"><svg><use href="#v2i-search"/></svg></span><input id="v2-search-input" placeholder="Search students by name or ID..." oninput="v2Search(this.value)" onfocus="v2Search(this.value)" autocomplete="off"><div id="v2-search-results" class="v2-pop" hidden></div></div>
 <div class="v2-profile">
  <div class="v2-bellwrap"><button class="v2-bell" onclick="v2ToggleBell(event)" aria-label="Notifications"><span class="v2-icon"><svg><use href="#v2i-bell"/></svg></span><span class="v2-bubble" id="v2-bell-count" hidden>0</span></button><div id="v2-bell-panel" class="v2-pop v2-bell-pop" hidden></div></div>
  <div class="v2-avatar" id="v2-avatar"></div><div><div class="v2-pname" id="v2-pname">Coordinator</div><div class="v2-prole">Clinical Coordinator</div></div>
 </div>
</header>
<main id="content" class="page v2-homepage">
  <div class="loading">Loading...</div>
</main>
</section>
</div>



<script>

let APP = {

  page: 'home',

  students: [],
  reviewStats: {},
  reviewQueue: [],
  reviewFilter: 'pending',
  reviewBusy: false,
  reviewMessage: '',

  addNewCapabilities: {},
  documentCapabilities: {},

  selectedStudentId: null,
  studentDashboard: null,

  studentDocuments: null,
  studentDocumentsLoading: false,
  studentDocumentsError: '',
  studentDocumentGenerationResult: null,
  studentDocumentGenerationError: '',
  studentDocumentGenerationBusy: false,

  studentTab: 'overview',

  gradeRecordOptions: null,
  newEntryBusy: false,
  newEntryMessage: '',
  newEntryError: '',

  clinicalReviewBy: '',
  clinicalReviewOptions: [],
  clinicalReviewCohortLabel: '',
  clinicalReviewValue: '',
  clinicalReviewResult: null,
  clinicalReviewOptionsLoading: false,
  clinicalReviewLoading: false,
  clinicalReviewError: '',
  clinicalReviewFilters: {
    clinicalTerm: 'all',
    evaluationType: 'all'
  },
  clinicalReviewPdfBusy: false,
  clinicalReviewPdfMessage: '',

  scheduleCohort: '',
  scheduleClinicalTerm: 'Clinical 3',
  roomRotationRows: [],
  roomRotationLoading: false,
  roomRotationError: '',
  roomRotationMessage: '',
  roomRotationEditor: null,
  roomRotationValidated: false,
  roomRotationSaving: false,
  roomRotationView: 'student'

};


/**
 * ================================================================
 * INITIAL LOAD
 * ================================================================
 */

window.addEventListener(
  'load',
  initializeDashboard
);


function initializeDashboard() {

  google.script.run

    .withSuccessHandler(data => {

      APP.students =
        data.students || [];

      APP.reviewStats =
        data.reviewStats || {};

      APP.addNewCapabilities =
        data.addNew || {};

      APP.documentCapabilities =
        data.documents || {};

      render();

    })

    .withFailureHandler(
      showFatalError
    )

    .getDashboardBootstrap();

}


function loadReviewQueue(
  filter
) {

  if (filter) {
    APP.reviewFilter = filter;
  }

  google.script.run

    .withSuccessHandler(queue => {

      APP.reviewQueue =
        queue || [];

      render();
    })

    .withFailureHandler(
      showFatalError
    )

    .getReviewQueue(
      APP.reviewFilter
    );
}


/**
 * ================================================================
 * NAVIGATION
 * ================================================================
 */

function showPage(page) {

  APP.page = page;


  document
    .querySelectorAll(
      '.nav-button'
    )
    .forEach(button => {

      button.classList.toggle(
        'active',
        button.dataset.page === page
      );

    });


  render();

  if (page === 'review') {
    loadReviewQueue();
  }

  if (page === 'reports' && APP.selectedStudentId) {
    loadStudentDocuments();
  }
}


/**
 * ================================================================
 * STUDENT LOAD
 * ================================================================
 */

function selectStudent(studentId) {

  APP.selectedStudentId =
    studentId;

  APP.studentDashboard =
    null;

  APP.studentDocuments = null;
  APP.studentDocumentsLoading = false;
  APP.studentDocumentsError = '';
  APP.studentDocumentGenerationResult = null;
  APP.studentDocumentGenerationError = '';
  APP.studentDocumentGenerationBusy = false;

  APP.studentTab =
    'overview';


  render();


  google.script.run

    .withSuccessHandler(data => {

      APP.studentDashboard =
        data;

      render();

      if (APP.page === 'students' && data && data.student && data.student.clinicalTerm) {
        setTimeout(() => loadStudentAttendanceSummary(
          data.student.studentId,
          data.student.clinicalTerm
        ), 0);
      }

      if (APP.page === 'reports') {
        loadStudentDocuments();
      }

    })

    .withFailureHandler(
      showFatalError
    )

    .getStudentDashboard(
      studentId
    );
}


/**
 * ================================================================
 * MAIN RENDER
 * ================================================================
 */

function render() {
  if (APP.page === 'home') renderHome();
  else if (APP.page === 'review') renderReview();
  else if (APP.page === 'students') renderStudents();
  else if (APP.page === 'instructors') renderInstructors();
  else if (APP.page === 'sites') renderSites();
  else if (APP.page === 'schedules') renderSchedules();
  else if (APP.page === 'attendance') renderAttendance();
  else if (APP.page === 'reports') renderReports();
  else if (APP.page === 'newEntry') renderNewEntry();
  else if (APP.page === 'clinicalReview') renderClinicalReview();
  else if (APP.page === 'administration') renderAdministration();
  else renderHome();
}


/**
 * ================================================================
 * REVIEW
 * ================================================================
 */


function renderHome() {
  const stats = APP.reviewStats || {};
  const actionCount = Number(stats.awaitingReview || 0) + Number(stats.flagged || 0);
  const waitingCount = 0;
  document.getElementById('content').innerHTML = `
    <div class="command-hero">
      <h1>Clinical Coordinator Command Center</h1>
      <p>Everything you need for the clinical program, organized around people and work instead of spreadsheets.</p>
    </div>
    <div class="alert-strip">
      <button class="alert-card action" onclick="showPage('review')" style="text-align:left;cursor:pointer">
        <div class="alert-number">${actionCount}</div><div class="alert-label">Action Required</div>
        <div class="alert-detail">${Number(stats.awaitingReview||0)} awaiting review · ${Number(stats.flagged||0)} flagged</div>
      </button>
      <div class="alert-card waiting"><div class="alert-number">${waitingCount}</div><div class="alert-label">Waiting / Monitoring</div><div class="alert-detail">This area is ready for dosimetry, onboarding, and other externally pending items as those services are connected.</div></div>
      <div class="alert-card good"><div class="alert-number">✓</div><div class="alert-label">Scheduling Foundation Ready</div><div class="alert-detail">Room Rotations v1 passed structural and relational QA.</div></div>
    </div>
    <div class="command-grid">
      ${commandTile('students','👤','Students','Student summary, clinical grade, requirements, records, documents, and follow-up.')}
      ${commandTile('instructors','🩻','Clinical Instructors','Instructor overview, availability, assignments, evaluations, dosimetry, and mileage.')}
      ${commandTile('sites','🏥','Clinical Sites','Site contacts, students, instructors, onboarding, rooms, and site-level activity.')}
      ${commandTile('schedules','📅','Schedules','Student room rotations, instructor availability, coverage, and clinical calendar.')}
      ${commandTile('administration','⚙️','Administration','Records and documents, attendance, controlled record entry, and system tools.')}
    </div>`;
  setTimeout(loadHomeAttendanceActions, 0);
}

function commandTile(page, icon, title, description) {
  return `<button class="command-tile" onclick="showPage('${page}')"><div class="command-icon">${icon}</div><div class="command-title">${escapeHtml(title)}</div><div class="command-desc">${escapeHtml(description)}</div></button>`;
}

function renderInstructors() {
  document.getElementById('content').innerHTML = `
    <h1 class="page-title">Clinical Instructors</h1><div class="page-subtitle">One home for each clinical instructor and the work connected to them.</div>
    <div class="landing-grid">
      <div class="landing-card"><span class="status-pill future">Shell established</span><h3>Instructor Overview</h3><p>Contact information, current assignments, availability, evaluations/surveys, dosimeter status, and mileage reimbursement will live on the instructor card.</p></div>
      <div class="landing-card"><span class="status-pill future">Next scheduling increment</span><h3>Availability & Coverage</h3><p>CI availability remains a Google Calendar-centered workflow. Assignment and coverage tools will plug into this area after Room Rotations.</p></div>
    </div>`;
}

function renderSites() {
  document.getElementById('content').innerHTML = `
    <h1 class="page-title">Clinical Sites</h1><div class="page-subtitle">A site-centered view of contacts, placements, instructors, onboarding, rooms, and activity.</div>
    <div class="landing-grid">
      <div class="landing-card"><span class="status-pill future">Shell established</span><h3>Site Overview</h3><p>Each clinical site will open to a concise operational card rather than requiring the coordinator to search multiple sheets.</p></div>
      <div class="landing-card"><span class="status-pill future">Planned</span><h3>Onboarding & Communications</h3><p>Site onboarding will use a pre-flight checklist model and can later surface relevant incoming email during onboarding season.</p></div>
    </div>`;
}

function renderAdministration() {
  document.getElementById('content').innerHTML = `
    <h1 class="page-title">Administration</h1>
    <div class="page-subtitle">Records, assessment, controlled entry, and less-frequent system tools.</div>
    <div class="admin-actions">
      <div class="landing-card">
        <span class="status-pill ready">Available</span>
        <h3>Records &amp; Documents</h3>
        <p>Generate student reports and requirement documents, find existing student files, and access supporting records.</p>
        <button class="primary-button" onclick="showPage('reports')">Open Records &amp; Documents</button>
      </div>
      <div class="landing-card">
        <span class="status-pill ready">Available</span>
        <h3>New Student Record Entry</h3>
        <p>Add clinical tests, quizzes, case presentations, grade reductions, professional competency items, and supported documents using the existing verified workflow.</p>
        <button class="primary-button" onclick="showNewEntry()">Open New Entry</button>
      </div>
      <div class="landing-card">
        <span class="status-pill ready">Available</span>
        <h3>Assessment</h3>
        <p>Clinical assessment, evaluation review, trends, and cohort/site analysis.</p>
        <button class="primary-button" onclick="showPage('clinicalReview')">Open Assessment</button>
      </div>
      <div class="landing-card">
        <span class="status-pill ready">Connected</span>
        <h3>CI Mileage</h3>
        <p>Review clinical instructors' one-way mileage, approve site distances, and build the mileage sheet and route PDFs for the voucher. Send mileage reminders.</p>
        <button class="primary-button" onclick="showPage('ciMileage')">Open CI Mileage</button>
      </div>
    </div>`;
}

function renderSchedules() {
  const cohorts = [...new Set((APP.students || []).map(s => s.cohort).filter(Boolean))].sort();
  if (!APP.scheduleCohort && cohorts.length) APP.scheduleCohort = cohorts[0];
  document.getElementById('content').innerHTML = `
    <h1 class="page-title">Schedules</h1><div class="page-subtitle">Plan the semester, see where everyone is, coordinate coverage, and manage attendance exceptions from one operational area.</div>
    <div class="landing-grid" style="margin-bottom:22px">
      <div class="landing-card"><span class="status-pill ready">Prototype ready</span><h3>Semester Clinical Planning</h3><p>Build the semester across site placement, room rotations, CI coverage, review, and eventual publish/distribution. The current prototype opens the Room Rotation stage.</p><button class="primary-button" onclick="openRoomRotations()">Open Semester Planner</button></div>
      <div class="landing-card"><span class="status-pill ready">Service connected</span><h3>Attendance &amp; ETO</h3><p>Review attendance exceptions and the authoritative ETO / make-up calculations. Call-outs and balances also surface on Home and Student overviews.</p><button class="primary-button" onclick="showPage('attendance')">Open Attendance</button></div>
      <div class="landing-card"><span class="status-pill future">Next increment</span><h3>CI Availability &amp; Coverage</h3><p>Calendar availability, preferred sites, proposed assignments, and coverage gaps will inform semester planning without replacing coordinator judgment.</p></div>
      <div class="landing-card"><span class="status-pill future">Next increment</span><h3>Current Clinical Schedule</h3><p>Operational view of who is where, with the same published schedule feeding Home, Student, CI, and Site snapshots.</p></div>
    </div>
    <div id="roomRotationWorkspace"></div>`;
  if (APP.roomRotationLoading || APP.roomRotationRows.length || APP.roomRotationError || APP.roomRotationEditor) renderRoomRotationWorkspace();
}

function openRoomRotations() {
  APP.roomRotationRows = [];
  APP.roomRotationError = '';
  APP.roomRotationMessage = '';
  APP.roomRotationEditor = null;
  renderSchedules();
  const host=document.getElementById('roomRotationWorkspace');
  const cohorts=[...new Set((APP.students||[]).map(s=>s.cohort).filter(Boolean))].sort();
  host.innerHTML=`<div class="section"><h2 style="margin-top:0">Student Room Rotations</h2><div class="schedule-toolbar"><div><label>Cohort</label><select id="rotationCohort">${cohorts.map(c=>`<option ${c===APP.scheduleCohort?'selected':''}>${escapeHtml(c)}</option>`).join('')}</select></div><div><label>Clinical Term</label><select id="rotationTerm">${['Clinical 1','Clinical 2','Clinical 3','Clinical 4','Clinical 5'].map(t=>`<option ${t===APP.scheduleClinicalTerm?'selected':''}>${t}</option>`).join('')}</select></div><button class="primary-button" onclick="loadRoomRotations()">Load Schedule</button></div><div class="callout">Drafts do not replace the current authoritative schedule. Publishing, printing, and emailing are intentionally not enabled in this phase.</div></div>`;
}

function loadRoomRotations() {
  APP.scheduleCohort=document.getElementById('rotationCohort').value;
  APP.scheduleClinicalTerm=document.getElementById('rotationTerm').value;
  APP.roomRotationLoading=true; APP.roomRotationError=''; APP.roomRotationMessage=''; APP.roomRotationEditor=null;
  renderSchedules(); openRoomRotationsLoadingShell();
  google.script.run.withSuccessHandler(rows=>{APP.roomRotationRows=rows||[];APP.roomRotationLoading=false;renderSchedules();renderRoomRotationWorkspace();}).withFailureHandler(err=>{APP.roomRotationLoading=false;APP.roomRotationError=errorMessage(err);renderSchedules();renderRoomRotationWorkspace();}).dashboardGetRoomRotationWorkspace(APP.scheduleCohort,APP.scheduleClinicalTerm);
}

function openRoomRotationsLoadingShell(){ const host=document.getElementById('roomRotationWorkspace'); if(host) host.innerHTML='<div class="section loading">Loading room rotations...</div>'; }


function renderRoomRotationWorkspace() {
  const host = document.getElementById('roomRotationWorkspace');
  if (!host) return;

  if (APP.roomRotationLoading) {
    host.innerHTML = '<div class="section loading">Loading semester plan...</div>';
    return;
  }

  if (APP.roomRotationError) {
    host.innerHTML = `<div class="entry-message error">${escapeHtml(APP.roomRotationError)}</div>`;
    return;
  }

  const rows = APP.roomRotationRows || [];
  const assigned = rows.filter(r => effectiveRotationArea(r)).length;
  const drafts = rows.filter(r => r.draftRotation && r.draftRotation.rotationArea).length;
  const unassigned = rows.length - assigned;

  host.innerHTML = `
    <div class="section semester-planner">
      <div class="planner-heading">
        <div>
          <h2 style="margin:0">${escapeHtml(APP.scheduleCohort)} · ${escapeHtml(APP.scheduleClinicalTerm)} Semester Plan</h2>
          <div class="muted small">Plan the entire selected clinical semester. Site placements are fixed context; room/area is the coordinator decision.</div>
        </div>
        <button class="secondary-button" onclick="openRoomRotations()">Change Cohort / Term</button>
      </div>

      ${APP.roomRotationMessage ? `<div class="entry-message success" style="margin-top:16px">${escapeHtml(APP.roomRotationMessage)}</div>` : ''}

      <div class="planner-summary">
        <div class="planner-stat"><strong>${rows.length}</strong><span>Site Assignments</span></div>
        <div class="planner-stat"><strong>${assigned}</strong><span>Room Areas Assigned</span></div>
        <div class="planner-stat ${unassigned ? 'attention' : ''}"><strong>${unassigned}</strong><span>Need Room Area</span></div>
        <div class="planner-stat draft"><strong>${drafts}</strong><span>Draft Changes</span></div>
      </div>

      <div class="planner-controls">
        <div class="view-toggle">
          <button class="${APP.roomRotationView === 'student' ? 'active' : ''}" onclick="setRoomRotationView('student')">Student View</button>
          <button class="${APP.roomRotationView === 'site' ? 'active' : ''}" onclick="setRoomRotationView('site')">Site View</button>
        </div>
        <div class="planner-legend">
          <span><i class="legend-dot authoritative"></i> Current</span>
          <span><i class="legend-dot draft"></i> Draft</span>
          <span><i class="legend-dot missing"></i> Needs room area</span>
        </div>
      </div>

      ${rows.length
        ? (APP.roomRotationView === 'site' ? renderRoomRotationSiteView(rows) : renderRoomRotationStudentView(rows))
        : '<div class="empty">No active site assignments were found for this cohort and clinical term.</div>'}
    </div>

    ${APP.roomRotationEditor ? renderRoomRotationModal() : ''}
  `;
}

function setRoomRotationView(view) {
  APP.roomRotationView = view === 'site' ? 'site' : 'student';
  renderRoomRotationWorkspace();
}

function effectiveRotationArea(row) {
  return (row.draftRotation && row.draftRotation.rotationArea) ||
    (row.officialRotation && row.officialRotation.rotationArea) || '';
}

function rotationPeriods(rows) {
  const map = {};
  rows.forEach(r => {
    const key = `${r.startDate}|${r.endDate}`;
    if (!map[key]) map[key] = { key, startDate:r.startDate, endDate:r.endDate };
  });
  return Object.values(map).sort((a,b) => parseDisplayDate(a.startDate) - parseDisplayDate(b.startDate));
}

function parseDisplayDate(value) {
  const parts = String(value || '').split('/');
  if (parts.length === 3) return new Date(Number(parts[2]), Number(parts[0])-1, Number(parts[1]));
  const d = new Date(value);
  return isNaN(d.getTime()) ? new Date(0) : d;
}

function compactPeriod(period) {
  return `${escapeHtml(period.startDate)}<br><span>${escapeHtml(period.endDate)}</span>`;
}

function renderRoomRotationStudentView(rows) {
  const periods = rotationPeriods(rows);
  const students = {};
  rows.forEach((r, index) => {
    const key = r.studentId || r.student;
    if (!students[key]) students[key] = { student:r.student, studentId:r.studentId, rows:{} };
    students[key].rows[`${r.startDate}|${r.endDate}`] = { row:r, index:index };
  });

  const orderedStudents = Object.values(students).sort((a,b) => String(a.student).localeCompare(String(b.student)));

  return `
    <div class="semester-table-wrap">
      <table class="semester-table">
        <thead>
          <tr>
            <th class="sticky-student">Student</th>
            ${periods.map(p => `<th>${compactPeriod(p)}</th>`).join('')}
          </tr>
        </thead>
        <tbody>
          ${orderedStudents.map(s => `
            <tr>
              <th class="sticky-student student-name-cell">
                <strong>${escapeHtml(s.student)}</strong>
                <span>${escapeHtml(s.studentId)}</span>
              </th>
              ${periods.map(p => {
                const item = s.rows[p.key];
                return item ? renderSemesterCell(item.row, item.index) : '<td class="semester-empty">—</td>';
              }).join('')}
            </tr>`).join('')}
        </tbody>
      </table>
    </div>`;
}

function renderSemesterCell(r, index) {
  const official = r.officialRotation && r.officialRotation.rotationArea ? r.officialRotation.rotationArea : '';
  const draft = r.draftRotation && r.draftRotation.rotationArea ? r.draftRotation.rotationArea : '';
  const area = draft || official;
  const state = draft ? 'draft' : (official ? 'authoritative' : 'missing');

  return `
    <td>
      <button class="semester-cell ${state}" onclick="editRoomRotation(${index})">
        <span class="cell-site">${escapeHtml(r.site || 'Site')}</span>
        <span class="cell-area">${escapeHtml(area || 'Choose room / area')}</span>
        ${draft ? '<span class="cell-state">Draft</span>' : (!official ? '<span class="cell-state">Needs assignment</span>' : '')}
      </button>
    </td>`;
}

function renderRoomRotationSiteView(rows) {
  const periods = rotationPeriods(rows);
  return `
    <div class="site-semester-view">
      ${periods.map(p => {
        const periodRows = rows
          .map((r,index) => ({r,index}))
          .filter(x => `${x.r.startDate}|${x.r.endDate}` === p.key);
        const sites = {};
        periodRows.forEach(x => {
          const key = x.r.siteId || x.r.site;
          if (!sites[key]) sites[key] = {site:x.r.site, rows:[]};
          sites[key].rows.push(x);
        });
        return `
          <div class="period-card">
            <div class="period-card-heading">
              <strong>${escapeHtml(p.startDate)} – ${escapeHtml(p.endDate)}</strong>
              <span>${periodRows.length} student placement${periodRows.length===1?'':'s'}</span>
            </div>
            <div class="site-grid">
              ${Object.values(sites).sort((a,b)=>String(a.site).localeCompare(String(b.site))).map(site => `
                <div class="site-group">
                  <h3>${escapeHtml(site.site)}</h3>
                  ${site.rows.sort((a,b)=>String(a.r.student).localeCompare(String(b.r.student))).map(x => {
                    const area = effectiveRotationArea(x.r);
                    const isDraft = !!(x.r.draftRotation && x.r.draftRotation.rotationArea);
                    return `<button class="site-student-row" onclick="editRoomRotation(${x.index})">
                      <span>${escapeHtml(x.r.student)}</span>
                      <strong class="${isDraft?'draft-text':''}">${escapeHtml(area || 'Choose room / area')}</strong>
                    </button>`;
                  }).join('')}
                </div>`).join('')}
            </div>
          </div>`;
      }).join('')}
    </div>`;
}

function editRoomRotation(index) {
  const r = APP.roomRotationRows[index];
  const source = r.draftRotation || r.officialRotation || {};
  APP.roomRotationEditor = {
    index:index,
    assignmentId:r.assignmentId,
    studentId:r.studentId,
    siteId:r.siteId,
    student:r.student,
    site:r.site,
    startDate:r.startDate,
    endDate:r.endDate,
    rotationId:(r.draftRotation && r.draftRotation.rotationId) || '',
    rotationArea:source.rotationArea || '',
    priorityNote:source.priorityNote || '',
    notes:source.notes || '',
    rotationAreas:r.rotationAreas || []
  };
  APP.roomRotationValidated = false;
  APP.roomRotationMessage = '';
  renderRoomRotationWorkspace();
}

function renderRoomRotationModal() {
  const e = APP.roomRotationEditor;
  const opts = [...new Set((e.rotationAreas || []).filter(Boolean))].sort();
  const currentIsKnown = opts.some(x => String(x).toLowerCase() === String(e.rotationArea || '').toLowerCase());
  const customValue = e.rotationArea && !currentIsKnown ? e.rotationArea : '';

  const studentHistory = (APP.roomRotationRows || [])
    .filter(r => r.studentId === e.studentId)
    .sort((a,b) => parseDisplayDate(a.startDate) - parseDisplayDate(b.startDate));

  return `
    <div class="modal-backdrop" onclick="modalBackdropCancel(event)">
      <div class="rotation-modal" role="dialog" aria-modal="true" aria-label="Edit room rotation">
        <div class="modal-header">
          <div>
            <div class="eyebrow">ROOM ROTATION</div>
            <h2>${escapeHtml(e.student)}</h2>
            <div class="modal-subtitle">${escapeHtml(e.site)} · ${escapeHtml(e.startDate)} – ${escapeHtml(e.endDate)}</div>
          </div>
          <button class="modal-close" onclick="cancelRoomRotationEdit()" aria-label="Close">×</button>
        </div>

        <div class="decision-grid">
          <div class="decision-card">
            <h3>Semester Rotation History</h3>
            <div class="history-list">
              ${studentHistory.map(r => `<div><span>${escapeHtml(r.startDate)}</span><strong>${escapeHtml(r.site)}</strong><em>${escapeHtml(effectiveRotationArea(r) || 'Not assigned')}</em></div>`).join('')}
            </div>
          </div>

function modalBackdropCancel(event) {
  if (event.target.classList.contains('modal-backdrop')) cancelRoomRotationEdit();
}

function rotationAreaSelectionChanged() {
  const select = document.getElementById('draftRotationAreaSelect');
  const custom = document.getElementById('draftRotationAreaCustom');
  if (!select || !custom) return;
  custom.style.display = select.value === '__OTHER__' ? 'block' : 'none';
  APP.roomRotationValidated = false;
}

function roomRotationPayload() {
  const e = APP.roomRotationEditor;
  const select = document.getElementById('draftRotationAreaSelect');
  const custom = document.getElementById('draftRotationAreaCustom');
  const rotationArea = select && select.value === '__OTHER__'
    ? (custom ? custom.value.trim() : '')
    : (select ? select.value.trim() : '');

  return {
    rotationId:e.rotationId || '',
    assignmentId:e.assignmentId,
    studentId:e.studentId,
    siteId:e.siteId,
    rotationArea:rotationArea,
    priorityNote:document.getElementById('draftPriorityNote').value.trim(),
    notes:document.getElementById('draftNotes').value.trim(),
    status:'Draft'
  };
}

function validateRoomRotationDraft() {
  APP.roomRotationValidated = false;
  const msg = document.getElementById('rotationEditorMessage');
  msg.innerHTML = '<div class="entry-message">Validating...</div>';
  google.script.run
    .withSuccessHandler(() => {
      APP.roomRotationValidated = true;
      msg.innerHTML = '<div class="entry-message success">Draft is valid. You can save it now.</div>';
      const btn = document.querySelector('.rotation-modal .primary-button');
      if (btn) btn.disabled = false;
    })
    .withFailureHandler(err => {
      msg.innerHTML = `<div class="entry-message error">${escapeHtml(errorMessage(err))}</div>`;
    })
    .dashboardValidateRoomRotationDraft(roomRotationPayload());
}

function saveRoomRotationDraft() {
  if (!APP.roomRotationValidated) return;
  APP.roomRotationSaving = true;
  const payload = roomRotationPayload();
  google.script.run
    .withSuccessHandler(() => {
      APP.roomRotationSaving = false;
      APP.roomRotationMessage = 'Draft saved. The authoritative schedule was not replaced.';
      APP.roomRotationEditor = null;
      reloadRoomRotationsAfterSave();
    })
    .withFailureHandler(err => {
      APP.roomRotationSaving = false;
      document.getElementById('rotationEditorMessage').innerHTML = `<div class="entry-message error">${escapeHtml(errorMessage(err))}</div>`;
    })
    .dashboardSaveRoomRotationDraft(payload);
}

function reloadRoomRotationsAfterSave() {
  APP.roomRotationLoading = true;
  google.script.run
    .withSuccessHandler(rows => {
      APP.roomRotationRows = rows || [];
      APP.roomRotationLoading = false;
      renderSchedules();
      renderRoomRotationWorkspace();
    })
    .withFailureHandler(err => {
      APP.roomRotationLoading = false;
      APP.roomRotationError = errorMessage(err);
      renderSchedules();
      renderRoomRotationWorkspace();
    })
    .dashboardGetRoomRotationWorkspace(APP.scheduleCohort, APP.scheduleClinicalTerm);
}

function cancelRoomRotationEdit() {
  APP.roomRotationEditor = null;
  APP.roomRotationValidated = false;
  renderRoomRotationWorkspace();
}

  APP.reviewFilter =

  APP.reviewMessage =

  loadReviewQueue(
    filter
  );

function refreshReviewDashboard(
  message
) {

  APP.reviewBusy =
    true;

  if (message) {
    APP.reviewMessage =
      message;
  }

  google.script.run

    .withSuccessHandler(data => {

      APP.students =
        data.students || APP.students;

      APP.reviewStats =
        data.reviewStats || {};

      google.script.run

        .withSuccessHandler(queue => {

          APP.reviewQueue =
            queue || [];

          APP.reviewBusy =
            false;

          render();
        })

        .withFailureHandler(error => {

          APP.reviewBusy =
            false;

          showFatalError(error);
        })

        .getReviewQueue(
          APP.reviewFilter
        );
    })

    .withFailureHandler(error => {

      APP.reviewBusy =
        false;

      showFatalError(error);
    })

    .getDashboardBootstrap();
}


function setReviewFlag(
  submissionId,
  flagged
) {

  if (APP.reviewBusy) {
    return;

  APP.reviewBusy =
    true;

  APP.reviewMessage =
    flagged
      ? 'Flagging evaluation...'
      : 'Removing flag...';

  render();

  google.script.run

    .withSuccessHandler(() => {

      refreshReviewDashboard(
        flagged
          ? 'Evaluation flagged.'
          : 'Flag removed.'

    .withFailureHandler(error => {

      APP.reviewBusy =
        false;

      showFatalError(error);

    .dashboardSetEvaluationFlag(
      submissionId,
      flagged

function renderSemesterGradeDetail(detail, semester, summary) {
  const weights = detail.weights || {};
  const categories = detail.categories || {};
  const rows = [
    ['competency', 'Competency Evaluations'],
    ['iso', 'Instructor Selected Ongoings'],
    ['professional', 'Professional Competency'],
    ['clinicalTest', 'Clinical Test'],
    ['casePresentation', 'Case Presentation'],
    ['quizzes', 'Clinical Quizzes']
  ]
    .filter(item => Number(weights[item[0]] || 0) > 0)
    .map(item => {
      const key = item[0];
      const weight = Number(weights[key] || 0);
      const category = categories[key] || {};
      const available = Boolean(category.available);
      const average = available ? Number(category.percentAverage) : null;
      const contribution =
        average === null || !Number.isFinite(average)
          ? null
          : average * weight / 100;

      return `
        <tr>
          <td>${escapeHtml(item[1])}</td>
          <td class="number">${available ? escapeHtml(formatGradePercent(average)) : 'Missing'}</td>
          <td class="number">${escapeHtml(weight + '%')}</td>
          <td class="number">${contribution === null ? '—' : escapeHtml(contribution.toFixed(2))}</td>
        </tr>
      `;
    })
    .join('');

  if (!rows) return '';

  const deductions = detail.deductions || { total: 0, items: [] };
  const test = categories.clinicalTest || {};
  const quizzes = categories.quizzes || {};
  const gradeMet = summary.complete && Number(summary.raw) >= 75;
  const competenciesMet = Number(semester.stillNeeded || 0) <= 0;
  const isoMet = Number(semester.isoCompleted || 0) >= Number(semester.isoRequired || 0);

  const statuses = [
    gradeRequirementBadge(
      'Course grade',
      summary.complete ? gradeMet : null,
      summary.complete ? (gradeMet ? '75% minimum met' : 'Below 75% minimum') : 'Pending complete grade'
    ),
    gradeRequirementBadge(
      'Clinical Test',
      test.available ? Number(test.percentAverage) >= 65 : null,
      test.available ? (Number(test.percentAverage) >= 65 ? '65% minimum met' : 'Below 65% minimum') : 'Not recorded'
    ),
    gradeRequirementBadge(
      'Clinical Quizzes',
      quizzes.available ? Number(quizzes.percentAverage) >= 70 : null,
      quizzes.available ? (Number(quizzes.percentAverage) >= 70 ? '70% minimum met' : 'Below 70% minimum') : 'Not recorded'
    ),
    gradeRequirementBadge(
      'Semester competencies',
      competenciesMet,
      competenciesMet ? 'Requirement met' : semester.stillNeeded + ' still needed'
    ),
    gradeRequirementBadge(
      'ISO',
      isoMet,
      isoMet ? 'Requirement met' : (Number(semester.isoRequired || 0) - Number(semester.isoCompleted || 0)) + ' still needed'
    )
  ].join('');

  return `
    <div class="section">
      <div class="section-title">Clinical Grade Detail</div>
      <div class="grade-box">
        <div class="summary-detail">
          Grade completeness: ${escapeHtml(String(detail.availableWeight || 0))}% of required category weight recorded
        </div>
        <table class="grade-detail-table">
          <thead>
            <tr>
              <th>Category</th>
              <th class="number">Average</th>
              <th class="number">Weight</th>
              <th class="number">Contribution</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
        ${Number(deductions.total || 0) !== 0
          ? `<div class="summary-detail" style="margin-top:12px;">Approved point deductions: ${escapeHtml(String(deductions.total))}</div>`
          : ''}
        <div class="grade-status-row">${statuses}</div>
        <div class="summary-detail" style="margin-top:12px;">
          These indicators summarize recorded requirements; they do not replace the coordinator's official progression decision.
        </div>
      </div>
    </div>
  `;
}


function gradeRequirementBadge(label, met, detail) {
  const cssClass = met === null ? 'pending' : (met ? 'met' : 'warning');
  return `<span class="grade-status ${cssClass}">${escapeHtml(label + ': ' + detail)}</span>`;
}


function formatGradePercent(value) {
  const number = Number(value);
  return Number.isFinite(number)
    ? number.toFixed(2).replace(/\.00$/, '') + '%'
    : '';
}

function generateStudentDocument(documentType) {
  if (!APP.studentDashboard || !APP.studentDashboard.student) return;

  if (APP.studentDocumentGenerationBusy) {
    console.warn('Document generation request ignored because another request is already running.');
    return;
  }

  const studentId = APP.studentDashboard.student.studentId;
  const clinicalTermElement = document.getElementById('semesterDocumentTerm');
  const clinicalTerm = documentType === 'semester' && clinicalTermElement
    ? clinicalTermElement.value
    : '';
  const buttonId = documentType === 'semester'
    ? 'generateSemesterButton'
    : (documentType === 'program' ? 'generateProgramButton' : 'generateGradesButton');
  const button = document.getElementById(buttonId);
  const status = document.getElementById('studentDocumentStatus');
  const originalText = button ? button.textContent : '';

  APP.studentDocumentGenerationResult = null;
  APP.studentDocumentGenerationError = '';
  APP.studentDocumentGenerationBusy = true;

  if (button) {
    button.disabled = true;
    button.textContent = 'Generating...';
  }
  if (status) {
    status.innerHTML = '<div class="muted">Creating document...</div>';
  }

  const request = {
    studentId: studentId,
    clinicalTerm: clinicalTerm,
    requestId: 'DOC-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8)
  };

  console.log('Submitting one document generation request:', documentType, request.requestId);

  if (documentType === 'semester') {
    google.script.run
      .withSuccessHandler(result => handleDocumentGenerationSuccess_(result, button, originalText))
      .withFailureHandler(error => handleDocumentGenerationFailure_(error, button, originalText))
      .dashboardGenerateSemesterRequirement(request);
  } else if (documentType === 'program') {
    google.script.run
      .withSuccessHandler(result => handleDocumentGenerationSuccess_(result, button, originalText))
      .withFailureHandler(error => handleDocumentGenerationFailure_(error, button, originalText))
      .dashboardGenerateProgramRequirement(request);
  } else if (documentType === 'grades') {
    google.script.run
      .withSuccessHandler(result => handleDocumentGenerationSuccess_(result, button, originalText))
      .withFailureHandler(error => handleDocumentGenerationFailure_(error, button, originalText))
      .dashboardGenerateClinicalGrades(request);
  }
}


function handleDocumentGenerationSuccess_(result, button, originalText) {
  APP.studentDocumentGenerationBusy = false;
  APP.studentDocumentGenerationResult = result || null;
  APP.studentDocumentGenerationError = '';

  if (button) {
    button.disabled = false;
    button.textContent = originalText;
  }

  const status = document.getElementById('studentDocumentStatus');
  if (status) status.innerHTML = renderDocumentGenerationStatus();

  loadStudentDocuments(true);
}


function handleDocumentGenerationFailure_(error, button, originalText) {
  APP.studentDocumentGenerationBusy = false;
  APP.studentDocumentGenerationResult = null;
  APP.studentDocumentGenerationError = errorMessage(error);

  if (button) {
    button.disabled = false;
    button.textContent = originalText;
  }

  const status = document.getElementById('studentDocumentStatus');
  if (status) status.innerHTML = renderDocumentGenerationStatus();
}


function renderDocumentGenerationStatus() {
  if (APP.studentDocumentGenerationBusy) {
    return '<div class="muted">Creating document...</div>';
  }

  if (APP.studentDocumentGenerationError) {
    return `<div class="error"><strong>Could not generate document:</strong> ${escapeHtml(APP.studentDocumentGenerationError)}</div>`;
  }

  const result = APP.studentDocumentGenerationResult;
  if (!result) return '';

  return `
    <div style="padding:14px;border:1px solid #c9dfce;background:#f2faf4;border-radius:8px;">
      <strong>Document created successfully.</strong>
      <div class="muted" style="margin-top:5px;">${escapeHtml(result.fileName || 'Generated document')}</div>
      ${result.viewUrl ? `<div style="margin-top:12px;"><a href="${escapeHtml(result.viewUrl)}" target="_blank" class="action-button" style="display:inline-block;text-decoration:none;">View Document</a></div>` : ''}
      ${result.pdfUrl ? `<div style="margin-top:12px;"><a href="${escapeHtml(result.pdfUrl)}" target="_blank">Download PDF</a></div>` : ''}
    </div>`;
}


function loadStudentDocuments(force) {
  if (!APP.selectedStudentId || APP.studentDocumentsLoading) return;
  if (APP.studentDocuments && !force) return;

  APP.studentDocumentsLoading = true;
  APP.studentDocumentsError = '';
  render();

  google.script.run
    .withSuccessHandler(result => {
      APP.studentDocuments = result || { files: [] };

      if (
        result &&
        result.capabilities &&
        APP.studentDashboard
      ) {
        APP.studentDashboard.documents =
          result.capabilities;

        APP.documentCapabilities =
          result.capabilities;
      }

      APP.studentDocumentsLoading = false;
      render();
    })
    .withFailureHandler(error => {
      APP.studentDocumentsLoading = false;
      APP.studentDocumentsError = errorMessage(error);
      render();
    })
    .dashboardGetStudentDocuments(APP.selectedStudentId);
}


function renderStudentDocumentList() {
  if (APP.studentDocumentsLoading) {
    return '<div class="loading">Loading student documents...</div>';
  }

  if (APP.studentDocumentsError) {
    return `<div class="error">${escapeHtml(APP.studentDocumentsError)}</div>`;
  }

  if (!APP.studentDocuments) {
    return '<div class="muted">Student documents will load automatically.</div>';
  }

  const files = APP.studentDocuments.files || [];
  const folderLink = APP.studentDocuments.folderUrl
    ? `<a href="${escapeHtml(APP.studentDocuments.folderUrl)}" target="_blank" class="action-button" style="display:inline-block;text-decoration:none;margin-bottom:14px;">Open Student Folder</a>`
    : '';

  if (!files.length) {
    return `${folderLink}<div class="empty">No documents found in the student's established Drive folder.</div>`;
  }

  return `
    ${folderLink}
    <table>
      <thead><tr><th>Document</th><th>Location</th><th>Last Updated</th><th></th></tr></thead>
      <tbody>
        ${files.map(file => `
          <tr>
            <td><strong>${escapeHtml(file.name)}</strong></td>
            <td>${escapeHtml(file.location || 'Student Folder')}</td>

    </table>`;
}

  }

  if (APP.newEntryMessage) {
    return `
      <div class="entry-message success">
        ${escapeHtml(APP.newEntryMessage)}
      </div>
    `;
  }

  return '';
}


function updateGradeEntryFields() {

  const categoryElement =
    document.getElementById(
      'entryCategory'
    );

  if (!categoryElement) {
    return;
  }

  const category =
    categoryElement.value;

  const deduction = category === 'deduction';
  const professional = category === 'professional';
  const competencyEvaluation = category === 'competencyEvaluation';
  const studentId = document.getElementById('entryStudent').value;
  const student = APP.students.find(item => item.studentId === studentId);
  const ready = Boolean(studentId && category);
  const attachmentCategories = [
    'professional',
    'clinicalTest',
    'quizzes',
    'casePresentation',
    'deduction'
  ];
  const attachmentField = document.getElementById('entryAttachmentField');

  document.getElementById('entryConditionalFields').hidden = !ready;
  document.getElementById('entryStudentIdentity').hidden = !studentId;

  if (attachmentField) {
    attachmentField.hidden =
      !ready ||
      attachmentCategories.indexOf(category) === -1;
  }

  if (student) {
    document.getElementById('entryStudentIdentity').innerHTML =
      '<strong>' + escapeHtml(student.student) + '</strong>' +
      '<div class="entry-help">Current Term: ' +
      escapeHtml(student.clinicalTerm || 'Not assigned') + '</div>';

    const term = document.getElementById('entryClinicalTerm');
    if (term && (!term.value || term.dataset.studentId !== studentId)) {
      term.value = student.clinicalTerm || '';
      term.dataset.studentId = studentId;
    }
  }

  document
    .querySelectorAll(
      '.grade-value-field'
    )
    .forEach(field => {
      field.hidden = deduction || competencyEvaluation;
    });

  document.getElementById('rawScoreField').hidden = !professional;
  document.getElementById('maximumScoreField').hidden = true;
  document.getElementById('percentGradeField').hidden = deduction || competencyEvaluation;

  document.getElementById(
    'pointsField'
  ).hidden = !deduction;

  document.getElementById(
    'evaluationPeriodField'
  ).hidden = !professional;

  document.getElementById('deductionReasonField').hidden = !deduction;
  document.getElementById('isoFields').hidden = !competencyEvaluation;
  document.getElementById('isoEvaluatorTypeField').hidden = !competencyEvaluation;
  document.getElementById('assignmentField').hidden = competencyEvaluation || deduction;
  document.getElementById('maximumScoreField').hidden = true;
  document.getElementById('entryEvaluationType').required = competencyEvaluation;
  document.getElementById('entryExamination').required = competencyEvaluation;
  document.getElementById('entryInstructor').required = ready;
  document.getElementById('entryClinicalSite').required = competencyEvaluation;

  document.getElementById(
    'entryPoints'
  ).required = deduction;

  const rawHelp =
    document.getElementById(
      'rawScoreHelp'
    );

  rawHelp.textContent = professional
    ? 'Enter the final 0–3 rubric score from the established Professional Competency evaluation.'
    : 'Optional when a percentage is entered.';

  document.getElementById(
    'entryRawScore'
  ).max = professional
    ? '3'
    : '';

  const button = document.getElementById('saveGradeRecordButton');
  if (button && !APP.newEntryBusy) {
    const labels = {
      clinicalTest: 'Save Clinical Test',
      quizzes: 'Save Clinical Quiz',
      professional: 'Save Professional Competency',
      competencyEvaluation: 'Save Competency Evaluation',
      casePresentation: 'Save Case Presentation',
      deduction: 'Save Grade Adjustment'
    };
    button.textContent = labels[category] || 'Save Entry';
  }

  updateHistoricalEntryIndicator();
  updateCompetencyEvaluationSubtype();
}


function updateCompetencyEvaluationSubtype() {
  const category = document.getElementById('entryCategory');
  const type = document.getElementById('entryEvaluationType');
  if (!category || !type) return;
  const isEvaluation = category.value === 'competencyEvaluation';
  const isFullCompetency = isEvaluation && type.value.trim().toLowerCase() === 'competency';
  const rubric = document.getElementById('manualCompetencyRubric');
  if (rubric) rubric.hidden = !isFullCompetency;
  ['manualSummaryPerformanceField', 'manualSummaryImageField', 'manualSummaryFinalField', 'manualSummaryResultField']
    .forEach(id => { document.getElementById(id).hidden = !isEvaluation || isFullCompetency; });
  document.getElementById('entryIsoFinalScore').required = isEvaluation && !isFullCompetency;
  document.getElementById('entryResult').required = isEvaluation && !isFullCompetency;
  if (isFullCompetency) renderManualImageViews();
}


function renderManualImageViews() {
  const countElement = document.getElementById('entryImageViewCount');
  const container = document.getElementById('manualImageViews');
  if (!countElement || !container) return;

  const scoreOptions = ['3', '2', '1', '0', 'N/A'];
  const component = (view, key, label) => `
    <div class="entry-field">
      <label>${escapeHtml(label)}</label>
      <select data-view="${view}" data-image-field="${key}">
        <option value="">Select score</option>
        ${scoreOptions.map(value => `<option value="${value}">${value}</option>`).join('')}
      </select>
    </div>`;
  container.innerHTML = Array.from({length: count}, (_, index) => {
    const view = index + 1;
    return `<div class="section" style="margin-top:14px;">
      <div class="section-title">View ${view}</div>
      <div class="entry-grid">
        <div class="entry-field"><label>View / Projection</label><input data-view="${view}" data-image-field="projection" type="text"></div>
        ${component(view, 'positioning', 'Positioning')}

        ${component(view, 'exposure', 'Exposure')}

        <div class="entry-field"><label>Marker</label><select data-view="${view}" data-image-field="marker"><option value="Acceptable">Acceptable</option><option value="Missing Marker">Missing Marker</option><option value="Illegible Marker">Illegible Marker</option></select></div>
        <div class="entry-field full"><label>View Comments</label><textarea data-view="${view}" data-image-field="comments"></textarea></div>
      </div>
    </div>`;
  }).join('');
}


function updateHistoricalEntryIndicator() {
  const studentId = document.getElementById('entryStudent').value;
  const term = document.getElementById('entryClinicalTerm').value;
  const student = APP.students.find(item => item.studentId === studentId);
  const indicator = document.getElementById('historicalEntryIndicator');
  if (!indicator) return;
  indicator.textContent = student && term && student.clinicalTerm && term !== student.clinicalTerm
    ? 'Historical entry — student is currently in ' + student.clinicalTerm + '.'
    : '';

function updateGradeEntryHint() {

  const category =
    document.getElementById(
      'entryCategory'
    );

  const maximum =
    document.getElementById(
      'entryMaximumScore'
    );

  if (
    category &&
    category.value === 'professional' &&
    maximum
  ) {
    maximum.value = '';
  }
}


function handleNewEntryAttachmentSelection() {

  const input = document.getElementById('entryAttachment');
  const name = document.getElementById('entryAttachmentName');

  if (!input || !name) {
    return;
  }

  const file = input.files && input.files.length
    ? input.files[0]
    : null;

  if (!file) {
    name.textContent = '';
    return;
  }

  const validationError = validateNewEntryAttachment(file);

  if (validationError) {
    input.value = '';
    name.textContent = '';
    showEntryInlineError(validationError);
    return;
  }

  name.textContent = 'Selected: ' + file.name;
}


function validateNewEntryAttachment(file) {

  if (!file) {
    return '';
  }

  if (file.size > 10 * 1024 * 1024) {
    return 'Supporting documents must be 10 MB or smaller.';
  }

  const allowedExtensions = [
    'pdf', 'jpg', 'jpeg', 'png', 'gif', 'webp', 'doc', 'docx'
  ];

  const extension =
    String(file.name || '')
      .split('.')
      .pop()
      .toLowerCase();

  if (allowedExtensions.indexOf(extension) === -1) {
    return 'Supporting documents must be PDF, JPG, PNG, GIF, WebP, DOC, or DOCX.';
  }

  return '';
}


function clearNewEntryAttachment() {

  const input = document.getElementById('entryAttachment');
  const name = document.getElementById('entryAttachmentName');

  if (input) {
    input.value = '';
  }

  if (name) {
    name.textContent = '';
  }
}


function submitGradeRecord(event) {

  event.preventDefault();

  if (APP.newEntryBusy) {
    return;
  }

  const form =
    document.getElementById(
      'gradeRecordForm'
    );

  if (!form.reportValidity()) {
    return;
  }

  const category =
    document.getElementById(
      'entryCategory'
    ).value;

  const reason = document.getElementById('entryReason').value.trim();
  const notes = document.getElementById('entryNotes').value.trim();
  const payload = {
    studentId:
      document.getElementById(
        'entryStudent'
      ).value,
    clinicalTerm:
      document.getElementById(
        'entryClinicalTerm'
      ).value,
    gradeCategory:
      category,
    assignmentName:
      document.getElementById(
        'entryAssignment'
      ).value,
    evaluationPeriod:
      document.getElementById(
        'entryEvaluationPeriod'
      ).value,
    date:
      document.getElementById(
        'entryDate'
      ).value,
    instructor:
      document.getElementById(
        'entryInstructor'
      ).value,
    deliveryMethod: 'Dashboard Manual Entry',
    rawScore:
      nullableNumber(
        'entryRawScore'
      ),
    maximumScore:
      nullableNumber(
        'entryMaximumScore'
      ),
    percentGrade:
      nullableNumber(
        'entryPercentGrade'
      ),
    points:
      nullableNumber(
        'entryPoints'
      ),
    notes: reason && notes ? 'Reason: ' + reason + '\n' + notes : (reason ? 'Reason: ' + reason : notes),
    examination: document.getElementById('entryExamination').value,
    finalScore: nullableNumber('entryIsoFinalScore'),
    performanceScore: nullableNumber('entryPerformanceScore'),
    imageScore: nullableNumber('entryImageScore'),
    result: document.getElementById('entryResult').value,
    evaluatorType: document.getElementById('entryEvaluatorType').value,
    clinicalSite: document.getElementById('entryClinicalSite').value,
    evaluationType: document.getElementById('entryEvaluationType').value,
    automaticFailure: document.getElementById('entryAutomaticFailure').checked,
    automaticFailureComments: document.getElementById('entryAutomaticFailureComments').value,
    performanceRatings: {},
    imageViews: [],
    source:
      'Dashboard Manual Entry'
  };

  document.querySelectorAll('.manual-performance-rating').forEach(select => {
    payload.performanceRatings[select.dataset.criterionKey] = select.value;
  });

  document.querySelectorAll('#manualImageViews [data-view]').forEach(field => {
    const index = Number(field.dataset.view) - 1;
    if (!payload.imageViews[index]) payload.imageViews[index] = {};
    payload.imageViews[index][field.dataset.imageField] = field.value;
  });

  if (category !== 'deduction' && category !== 'competencyEvaluation') {

    const hasPercent =
      payload.percentGrade !== null;

    const hasRawAndMaximum =
      payload.rawScore !== null &&
      payload.maximumScore !== null;

    const hasProfessionalRaw =
      category === 'professional' &&
      payload.rawScore !== null;

    if (
      !hasPercent &&
      !hasRawAndMaximum &&
      !hasProfessionalRaw
    ) {
      APP.newEntryError =
        'Enter a percentage, Raw Score and Maximum Score, or a Professional Competency 0–3 score.';

      render();
      return;
    }
  }

  const attachmentInput = document.getElementById('entryAttachment');
  const attachmentFile = attachmentInput && attachmentInput.files.length
    ? attachmentInput.files[0]
    : null;

  const attachmentValidationError =
    validateNewEntryAttachment(attachmentFile);

  if (attachmentValidationError) {
    showEntryInlineError(attachmentValidationError);
    return;
  }

  const savePayload = attachmentFile
    ? readNewEntryAttachment(attachmentFile).then(attachment => {
        payload.attachment = attachment;
        return payload;
      })
    : Promise.resolve(payload);

  APP.newEntryBusy = true;
  APP.newEntryMessage = '';
  APP.newEntryError = '';
  setNewEntryBusyState(true);

  savePayload.then(finalPayload => {

    google.script.run

    .withSuccessHandler(result => {

      APP.newEntryBusy = false;

      if (result && result.partial) {
        setNewEntryBusyState(false);
        showEntryInlineError(result.message || 'The entry was only partially saved.');
        refreshSelectedStudentSilently();
        return;
      }

      const record =
        result && result.record
          ? result.record
          : {};

      const semester =
        result &&
        result.gradeSummary &&
        result.gradeSummary.semester
          ? result.gradeSummary.semester
          : {};

      APP.newEntryMessage =
        'Saved ' +
        (record.gradeCategory || record.evaluationType || 'entry') +
        ' for ' +
        (record.student || 'student') +
        (
          semester.recordedAverageText
            ? '. Current recorded grade: ' +
              semester.recordedAverageText
            : '.'
        ) +
        (result && result.attachment
          ? ' Supporting document saved: ' + result.attachment.fileName + '.'
          : '');

      clearNewEntryAttachment();

      if (
        APP.selectedStudentId ===
        record.studentId
      ) {
        refreshSelectedStudentSilently();
      }

      render();
    })

    .withFailureHandler(error => {

      APP.newEntryBusy = false;
      setNewEntryBusyState(false);
      showEntryInlineError(
        errorMessage(error)
      );
    })

      .dashboardSaveNewEntry(finalPayload);

  }).catch(error => {
    APP.newEntryBusy = false;
    setNewEntryBusyState(false);
    showEntryInlineError(errorMessage(error));
  });
}


function readNewEntryAttachment(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve({
      fileName: file.name,
      mimeType: file.type,
      data: reader.result
    });
    reader.onerror = () => reject(new Error('The supporting document could not be read.'));
    reader.readAsDataURL(file);
  });
}


function setNewEntryBusyState(busy) {

  const button =
    document.getElementById(
      'saveGradeRecordButton'
    );

  if (button) {
    button.disabled = busy;
    button.textContent = busy
      ? 'Saving...'
      : 'Save Entry';
  }
}


function showEntryInlineError(message) {

  const area =
    document.getElementById(
      'entryInlineMessage'
    );

  if (!area) {
    return;
  }

  area.innerHTML = `
    <div class="entry-message error">
      ${escapeHtml(message)}
    </div>
  `;

  area.scrollIntoView({
    behavior: 'smooth',
    block: 'center'
  });
}


function refreshSelectedStudentSilently() {

  if (!APP.selectedStudentId) {
    return;
  }

  google.script.run

    .withSuccessHandler(data => {
      APP.studentDashboard = data;
    })

    .withFailureHandler(() => {})

    .getStudentDashboard(
      APP.selectedStudentId
    );
}


function cancelNewEntry() {

  APP.newEntryMessage = '';
  APP.newEntryError = '';

  showPage(
    APP.selectedStudentId
      ? 'students'
      : 'review'
  );
}


function nullableNumber(elementId) {

  const element =
    document.getElementById(
      elementId
    );

  if (
    !element ||
    element.value === ''
  ) {
    return null;
  }

  const value =
    Number(element.value);

  return Number.isFinite(value)
    ? value
    : null;
}


function todayInputValue() {

  const now =
    new Date();

  const local =
    new Date(
      now.getTime() -
      now.getTimezoneOffset() * 60000
    );

  return local
    .toISOString()
    .slice(0, 10);
}


function errorMessage(error) {

  return error && error.message
    ? error.message
    : String(error || 'Unknown error');
}

function clinicalReviewByChanged(reviewBy) {

    return;

  runClinicalReview();

    </style></head><body>
    <h1>Assessment</h1>
