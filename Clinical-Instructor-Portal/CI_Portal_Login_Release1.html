<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>CCMS Evaluator Portal — Render-Match Prototype</title>
<style>
:root{
  --navy:#061f36; --ink:#0b2141; --muted:#506783; --blue:#0877dc; --blue2:#0567c3;
  --orange:#f58220; --green:#13a34a; --line:#d4e2f0;
  --pale-blue:#f7fbff; --pale-amber:#fffaf2; --pale-green:#f5fff8;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:#f7f9fc}
button,input{font:inherit}.hidden{display:none!important}button{cursor:pointer}
svg{display:block}

/* ---------------- LOGIN: ONE FULL VIEWPORT ---------------- */
.login{
  min-height:100vh; position:relative; overflow:hidden; color:#fff;
  background:#031a2c left center/cover no-repeat;
}
.login::before{
  content:""; position:absolute; inset:0;
  background:linear-gradient(90deg,rgba(1,15,27,.08) 0%,rgba(1,18,31,.25) 38%,rgba(1,19,32,.72) 72%,rgba(1,17,29,.90) 100%);
}
.login-layout{
  position:relative; z-index:2; min-height:100vh;
  width:min(1180px,94vw); margin:0 auto;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:34px 0 150px;
}
.login-main{
  width:500px; max-width:100%;
  margin:0 auto;
}
.login-brand{text-align:center;margin-bottom:22px}
.login-brand img{width:330px;max-width:80%;height:auto;margin:0 auto 18px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.22))}
.login-brand .rule{height:1px;width:290px;background:rgba(255,255,255,.24);margin:0 auto 21px}
.login-brand h1{font-size:34px;line-height:1.08;text-align:left;width:420px;max-width:100%;margin:0 auto;font-weight:700}
.signin{
  width:420px;max-width:100%;margin:0 auto;background:rgba(255,255,255,.985);color:var(--ink);
  border-radius:17px;padding:27px;box-shadow:0 22px 65px rgba(0,0,0,.30)
}
.signin h2{font-size:30px;margin:0 0 7px}.signin>p{color:var(--muted);margin:0 0 20px;line-height:1.4}
.field{margin:15px 0}.field label{display:block;font-size:14px;font-weight:700;margin-bottom:8px}
.input{position:relative}.input svg{position:absolute;left:13px;top:14px;width:22px;height:22px;stroke:#173e68}
.input input,.input select{width:100%;height:50px;border:1px solid #a9c9e9;border-radius:8px;background:#fbfdff;padding:0 43px;font-size:16px;outline:none}
.input input:focus,.input select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(8,119,220,.12)}
.eye{position:absolute;right:10px;top:9px;border:0;background:transparent;padding:7px}.eye svg{position:static;width:21px;height:21px}
.primary{border:0;border-radius:8px;background:linear-gradient(#1185e9,#0868c4);color:#fff;font-weight:700;padding:12px 16px;box-shadow:0 3px 7px rgba(0,90,180,.15)}
.signin>.primary{width:100%;height:52px;font-size:17px;margin-top:5px}
.error{display:none!important;color:#b42318!important;font-size:13px!important;margin:11px 0 0!important}.error.show{display:block!important}
.login-resources{
  position:absolute; left:50%; bottom:30px; transform:translateX(-50%);
  width:850px; max-width:88vw;
  display:grid;grid-template-columns:repeat(3,1fr);text-align:center
}
.login-resource{padding:0 25px;border-right:1px solid rgba(255,255,255,.24)}
.login-resource:last-child{border-right:0}.login-resource svg{width:34px;height:34px;margin:0 auto 8px;stroke:#e8f5ff}
.login-resource strong{display:block;font-size:14px;margin-bottom:5px}.login-resource span{display:block;color:#d7e5ef;font-size:12px;line-height:1.35}

/* ---------------- HOME ---------------- */
.home{min-height:100vh;background:#f7f9fc}
.topbar{
  height:76px;background:#fff;border-bottom:1px solid #e1e9f1;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 max(24px,calc((100vw - 1180px)/2));
}
.topbar-logo img{width:190px;height:auto;display:block}
.profile{display:flex;align-items:center;gap:11px}.help{display:flex;align-items:center;gap:7px;border:0;background:none;color:#0a315d;font-weight:700;padding:10px 18px;border-right:1px solid #dce5ee}
.help svg{width:22px;height:22px;stroke:#0a315d}.avatar{width:42px;height:42px;border-radius:50%;background:#60768c;color:#fff;display:grid;place-items:center;font-weight:700}.who strong{display:block;font-size:15px}.who small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.chevron{width:18px;height:18px;stroke:#0a315d}
main{width:min(1180px,94%);margin:16px auto 30px}
.hero{
  height:220px;border-radius:11px;overflow:hidden;position:relative;color:#fff;
  background:#031a2c center/cover no-repeat;
}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(3,42,72,.96) 0%,rgba(3,42,72,.80) 52%,rgba(3,42,72,.18) 100%)}
.hero-inner{position:relative;z-index:1;padding:26px 31px}.hero h1{font-size:37px;margin:0 0 4px}.date{font-size:18px}
.assignment{margin-top:18px;width:510px;max-width:100%;display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.13);backdrop-filter:blur(5px);padding:12px 15px;border-radius:10px}
.assignment svg{width:38px;height:38px;stroke:#fff;flex:none}.assignment small{display:block;font-size:14px}.assignment strong{display:block;font-size:17px;margin:2px 0}.assignment span{font-size:13px}
.section{margin-top:12px;border:1px solid var(--line);border-radius:11px;padding:12px;background:#fff}
.students-sec{background:var(--pale-blue);border-color:#b8d7f5}.progress-sec{background:var(--pale-amber);border-color:#efd3a5}.done-sec{background:var(--pale-green);border-color:#bde2c8}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}.section-title{display:flex;align-items:center;font-size:18px;font-weight:700}.section-title svg{width:25px;height:25px;margin-right:8px;stroke:#0872d2}.progress-sec .section-title svg{stroke:#ef7d12}.done-sec .section-title svg{stroke:#12a34a}.count{margin-left:7px;background:#e4f1ff;color:#0b63b7;border-radius:999px;padding:3px 8px;font-size:12px}
.link{border:0;background:none;color:#0870ce;font-weight:700;display:flex;align-items:center;gap:6px}.link svg{width:19px;height:19px;stroke:#0870ce}
.students{display:grid;grid-template-columns:1fr 1fr;gap:9px}.student{background:#fff;border:1px solid #c6def5;border-radius:10px;padding:12px}.student-top{display:flex;align-items:center;gap:12px}.savatar{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:#e3f0ff;color:#0869c5;font-size:20px;flex:none}.savatar.green{background:#e7f7eb;color:#16913f}.student h3{font-size:16px;margin:0 0 2px}.student p{font-size:13px;color:var(--muted);line-height:1.35;margin:0}.student-actions{display:grid;grid-template-columns:1.25fr 1fr;gap:8px;margin-top:11px}.student-actions button{height:47px}.btn-icon{display:inline-flex;align-items:center;gap:7px;justify-content:center}.btn-icon svg{width:18px;height:18px;stroke:currentColor}
.secondary{border:1px solid #8db9e7;background:#fff;color:#0766bc;border-radius:8px;font-weight:700;padding:10px}
.row{background:rgba(255,255,255,.78);border-radius:9px;padding:11px;display:grid;grid-template-columns:1.42fr 1.05fr .72fr .72fr;align-items:center;gap:14px}.row strong{display:block;font-size:14px}.row small{display:block;color:var(--muted);font-size:12px;margin-top:3px}.bar{height:8px;background:#dce6ef;border-radius:99px;overflow:hidden}.bar i{display:block;width:55%;height:100%;background:#0b7ddd;border-radius:99px}.pass{display:inline-block;background:#15a248;color:#fff;border-radius:4px;padding:4px 8px;font-size:11px;font-weight:700}
.resources{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}.resource{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;align-items:center;gap:11px}.resource-icon{width:47px;height:47px;border-radius:50%;display:grid;place-items:center;background:#e4f0ff;flex:none}.resource:nth-child(2) .resource-icon{background:#eee7ff}.resource:nth-child(3) .resource-icon{background:#fff0df}.resource-icon svg{width:25px;height:25px;stroke:#0870d0}.resource:nth-child(2) svg{stroke:#7045d7}.resource:nth-child(3) svg{stroke:#ef7510}.resource strong{display:block;font-size:13px}.resource small{display:block;color:var(--muted);font-size:12px;line-height:1.3;margin-top:3px}
.proto{position:fixed;right:10px;bottom:8px;background:#062943;color:#fff;padding:5px 9px;border-radius:999px;font-size:10px;opacity:.82}

@media(max-width:780px){
 .login{overflow:auto;background-position:30% center}.login-layout{display:flex;padding:30px 0 165px}.login-main{width:94%;margin:0 auto}.login-brand img{width:270px}.login-brand h1{text-align:center;font-size:28px}.signin{width:min(420px,100%)}.login-resources{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);width:94%;max-width:none}.login-resource{padding:0 10px}.login-resource span{display:none}
 .topbar{height:68px;padding:0 13px}.topbar-logo img{width:150px}.who{display:none}.help{border:0;padding:7px}.hero{height:auto;min-height:205px}.hero-inner{padding:21px 18px}.hero h1{font-size:28px}.assignment{width:100%}
 main{width:95%;margin-top:9px}.students,.resources{grid-template-columns:1fr}.student-actions{grid-template-columns:1fr}.row{grid-template-columns:1fr}.section-head{align-items:flex-start}.section-title{font-size:16px}
}
</style>
</head>
<body>
<!-- Inline SVG icon library -->
<svg height="0" style="position:absolute" width="0">
<defs>
<symbol id="i-user" viewbox="0 0 24 24"><circle cx="12" cy="8" fill="none" r="4" stroke-width="2"></circle><path d="M4 21c.7-4.2 3.4-6 8-6s7.3 1.8 8 6" fill="none" stroke-width="2"></path></symbol>
<symbol id="i-lock" viewbox="0 0 24 24"><rect fill="none" height="11" rx="2" stroke-width="2" width="14" x="5" y="10"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke-width="2"></path></symbol>
<symbol id="i-eye" viewbox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" fill="none" stroke-width="2"></path><circle cx="12" cy="12" fill="none" r="2.5" stroke-width="2"></circle></symbol>
<symbol id="i-shield" viewbox="0 0 24 24"><path d="M12 2 20 5v6c0 5.2-3.3 8.8-8 11-4.7-2.2-8-5.8-8-11V5l8-3Z" fill="none" stroke-width="2"></path><path d="m8.5 12 2.2 2.2 4.8-5" fill="none" stroke-width="2"></path></symbol>
<symbol id="i-book" viewbox="0 0 24 24"><path d="M3 5.5C6 4 9 4.3 12 6v15c-3-1.7-6-2-9-.5v-15Zm18 0c-3-1.5-6-1.2-9 .5v15c3-1.7 6-2 9-.5v-15Z" fill="none" stroke-width="2"></path></symbol>
<symbol id="i-pin" viewbox="0 0 24 24"><path d="M12 22s7-7.2 7-13a7 7 0 1 0-14 0c0 5.8 7 13 7 13Z" fill="none" stroke-width="2"></path><circle cx="12" cy="9" fill="none" r="2.5" stroke-width="2"></circle></symbol>
<symbol id="i-users" viewbox="0 0 24 24"><circle cx="9" cy="8" fill="none" r="3" stroke-width="2"></circle><circle cx="17" cy="9" fill="none" r="2.5" stroke-width="2"></circle><path d="M3 20c.5-4 2.5-6 6-6s5.5 2 6 6M14 15c4-.8 6.5 1 7 5" fill="none" stroke-width="2"></path></symbol>
<symbol id="i-calendar" viewbox="0 0 24 24"><rect fill="none" height="16" rx="2" stroke-width="2" width="18" x="3" y="5"></rect><path d="M7 2v6M17 2v6M3 10h18" fill="none" stroke-width="2"></path></symbol>
<symbol id="i-play" viewbox="0 0 24 24"><path d="m9 7 8 5-8 5V7Z" fill="none" stroke-width="2"></path><rect fill="none" height="18" rx="3" stroke-width="2" width="18" x="3" y="3"></rect></symbol>
<symbol id="i-list" viewbox="0 0 24 24"><path d="M9 6h12M9 12h12M9 18h12M3 6h2M3 12h2M3 18h2" fill="none" stroke-width="2"></path></symbol>
<symbol id="i-clipboard" viewbox="0 0 24 24"><rect fill="none" height="18" rx="2" stroke-width="2" width="14" x="5" y="4"></rect><path d="M9 4V2h6v2M9 9h6M9 13h6M9 17h4" fill="none" stroke-width="2"></path></symbol>
<symbol id="i-check" viewbox="0 0 24 24"><circle cx="12" cy="12" fill="none" r="10" stroke-width="2"></circle><path d="m7 12 3 3 7-7" fill="none" stroke-width="2"></path></symbol>
<symbol id="i-help" viewbox="0 0 24 24"><circle cx="12" cy="12" fill="none" r="10" stroke-width="2"></circle><path d="M9.5 9a2.7 2.7 0 0 1 5.2 1c0 2-2.7 2.2-2.7 4M12 18h.01" fill="none" stroke-width="2"></path></symbol>
<symbol id="i-doc" viewbox="0 0 24 24"><path d="M6 2h8l4 4v16H6V2Z" fill="none" stroke-width="2"></path><path d="M14 2v5h5M9 12h6M9 16h6" fill="none" stroke-width="2"></path></symbol>
<symbol id="i-chevron" viewbox="0 0 24 24"><path d="m8 10 4 4 4-4" fill="none" stroke-width="2"></path></symbol>
</defs>
</svg>
<section class="login" data-asset-bg="LOGIN_BACKGROUND" id="login">
<div class="login-layout">
<div class="login-main">
<div class="login-brand">
<img alt="SUNY Orange Radiologic Technology" data-asset-img="PORTAL_LOGO" alt="SUNY Orange Radiologic Technology"/>
<div class="rule"></div>
<h1>Clinical Competency<br/>Management System</h1>
</div>
<form class="signin" onsubmit="return signIn(event)">
<h2>Sign In</h2>
<p>Access clinical evaluations, student information, and program resources.</p>
<div class="field"><label for="user">Clinical Instructor</label><div class="input"><svg><use href="#i-user"></use></svg><select id="user" aria-label="Choose clinical instructor" required disabled><option value="">Loading instructors…</option></select></div></div>
<div class="field"><label>Password</label><div class="input"><svg><use href="#i-lock"></use></svg><input autocomplete="current-password" id="pass" type="password"/><button class="eye" onclick="togglePass()" type="button"><svg><use href="#i-eye"></use></svg></button></div></div>
<button class="primary" type="submit">Sign In  ›</button>
<p class="error" id="err" role="alert"></p>
</form>
</div>
<div class="login-resources">
<div class="login-resource"><svg><use href="#i-shield"></use></svg><strong>Secure Access</strong><span>Protecting student information</span></div>
<div class="login-resource">
<svg viewbox="0 0 24 24"><circle cx="12" cy="12" fill="none" r="2" stroke-width="2"></circle><path d="M12 10c-2-4-1-7 1-8 2 2 3 5 1 8M14 13c4 0 6 2 6 5-3 1-6 0-8-3M10 13c-4 0-6 2-6 5 3 1 6 0 8-3" fill="none" stroke-width="2"></path></svg>
<strong>Clinical Support</strong><span>Evaluate with confidence</span>
</div>
<div class="login-resource"><svg><use href="#i-book"></use></svg><strong>Program Resources</strong><span>Everything you need in one place</span></div>
</div>
</div>
</section>

<script>
let evaluators=[];
function showError(message){const el=document.getElementById('err');el.textContent=message;el.classList.add('show');}
function togglePass(){const p=document.getElementById('pass');p.type=p.type==='password'?'text':'password';}
function initializeLogin(){
 if(!window.google?.script?.run){showError('Open this page through the CCMS Apps Script test deployment.');return;}
 google.script.run.withSuccessHandler(result=>{
  if(!result?.success){showError('Evaluator list is unavailable.');return;}
  evaluators=result.evaluators||[];
  const list=document.getElementById('user');
  list.replaceChildren(new Option('Select your name…',''));
  evaluators.forEach(item=>list.add(new Option(item.evaluatorName,item.evaluatorId)));
  list.disabled=!evaluators.length;
  if(!evaluators.length)showError('No active clinical instructors have Portal access. Contact the coordinator.');
 }).withFailureHandler(err=>showError(err.message||'Unable to load evaluators.')).ciPortalGetLoginOptions();
}

// Render Home within this iframe; no top-frame navigation.
function ciNavigate(page) {
 if(page!=='home')return;
 const token=sessionStorage.getItem('ccmsCiToken')||'';
 google.script.run.withSuccessHandler(html=>{
   document.open();document.write(html);document.close();
 }).withFailureHandler(err=>showError(err.message||'Unable to load Home.')).ciPortalRenderHome(token);
}
function signIn(e){
 e.preventDefault();
 const evaluatorId=document.getElementById('user').value.trim();
 const evaluator=evaluators.find(x=>x.evaluatorId===evaluatorId);
 if(!evaluator){showError('Select a clinical instructor from the list.');return false;}
 const password=document.getElementById('pass').value;
 const submit=document.querySelector('form.signin button[type=submit]');submit.disabled=true;
 google.script.run.withSuccessHandler(result=>{
  submit.disabled=false;
  if(!result?.success||!result?.token){showError(result?.message||'Sign-in unsuccessful.');return;}
  document.getElementById('err').classList.remove('show');
  sessionStorage.setItem('ccmsCiToken',result.token);
  ciNavigate('home');
 }).withFailureHandler(err=>{submit.disabled=false;showError(err.message||'Sign-in failed.');}).ciR1Login(evaluator.evaluatorId,password);
 return false;
}
initializeLogin();
</script>
<script>
(function(){
  'use strict';
  function applyPortalAssets_(assets){
    assets=assets||{};
    document.querySelectorAll('[data-asset-bg]').forEach(function(el){
      var key=el.getAttribute('data-asset-bg');
      if(!assets[key]) return;
      // Preserve the approved dark gradient over the Home banner.
      if(key==='HOME_BANNER'){
        el.style.backgroundImage='linear-gradient(90deg,rgba(2,27,51,.96),rgba(2,29,53,.77) 38%,rgba(3,28,49,.14) 74%),url("'+assets[key]+'")';
      }else{
        el.style.backgroundImage='url("'+assets[key]+'")';
      }
    });
    document.querySelectorAll('[data-asset-img]').forEach(function(el){
      var key=el.getAttribute('data-asset-img');
      if(assets[key]) el.src=assets[key];
    });
  }
  function loadPortalAssets_(){
    if(!(window.google&&google.script&&google.script.run))return;
    google.script.run.withSuccessHandler(applyPortalAssets_)
      .withFailureHandler(function(err){console.error('CI Portal image load failed:',err);})
      .ciPortalGetAssets();
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',loadPortalAssets_);
  else loadPortalAssets_();
})();
</script>
</body>
</html>
