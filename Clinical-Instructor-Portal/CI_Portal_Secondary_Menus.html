<style>
.ci-secondary-panel{padding:16px 22px 30px;color:#173653;max-width:none;margin:0;min-height:380px;font-family:Inter,"Segoe UI",Arial,sans-serif}
.ci-secondary-head{display:flex;align-items:center;gap:12px;margin:6px 0 24px;font-weight:800;letter-spacing:.04em;font-size:17px;color:#112944}
.ci-secondary-back{border:0;background:none;color:#0878e5;font-size:26px;line-height:1;cursor:pointer;padding:3px}
.ci-secondary-list{display:flex;flex-direction:column;gap:2px;max-width:350px}.ci-secondary-row{border:0;background:transparent;text-align:left;min-height:46px;padding:12px 14px;border-radius:10px;color:#214360;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:space-between;cursor:pointer;width:100%}
.ci-secondary-row:hover,.ci-secondary-row:focus-visible{background:#f0f6fb;outline-offset:1px}.ci-secondary-row.primary{background:#f1f6fa;color:#0878e5}
.ci-secondary-chevron{color:#0a6fc6;font-size:19px}.ci-secondary-tag{display:inline-block;color:#0878e5;background:#eaf3fc;border-radius:99px;min-width:22px;height:22px;text-align:center;font-size:13px;line-height:22px}
.ci-secondary-label{font-size:12px;font-weight:800;letter-spacing:.045em;color:#7a91a6;padding:13px 14px 7px}
.ci-secondary-detail{max-width:540px;border:1px solid #d7e5f0;border-radius:11px;background:white;padding:22px;color:#214360}.ci-secondary-detail p{line-height:1.6;font-size:14px;color:#5e7288}
.ci-res-wrap{max-width:900px}.ci-res-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:0 0 12px}.ci-res-bar h2{margin:0;font-size:20px;color:#112944;flex:1 1 auto}
.ci-res-meta{color:#5e7288;font-size:12px}.ci-res-btn{border:1px solid #0878e5;background:#fff;color:#0878e5;border-radius:8px;padding:8px 12px;font:inherit;font-weight:700;font-size:13px;cursor:pointer}.ci-res-btn:disabled{opacity:.6}
.ci-res-doc{width:100%;border:1px solid #d7e5f0;border-radius:10px;background:#fff;min-height:70vh;display:block}
.ci-res-status{padding:18px;border:1px dashed #c9d9e6;border-radius:10px;color:#5e7288;background:#fafcfe}
.ci-sg h3{font-size:16px;color:#112944;margin:22px 0 8px}.ci-sg p,.ci-sg li{font-size:14px;line-height:1.55;color:#33506b}.ci-sg table{border-collapse:collapse;width:100%;font-size:13px;margin:6px 0}
.ci-sg th,.ci-sg td{border:1px solid #dce6ee;padding:7px 9px;text-align:left;vertical-align:top}.ci-sg th{background:#f1f6fa;color:#183a5a}
.ci-sg .s0{background:#fde8e8}.ci-sg .s1{background:#fff6d6}.ci-sg .s2,.ci-sg .s3{background:#e6f5ec}.ci-sg details{border:1px solid #dce6ee;border-radius:8px;margin:6px 0;background:#fff}
.ci-sg summary{cursor:pointer;padding:9px 12px;font-weight:700;color:#183a5a}.ci-sg details table{margin:0 0 6px}.ci-sg .formula{background:#f1f6fa;border-radius:8px;padding:10px 12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;color:#183a5a;white-space:pre-wrap}
@media(max-width:600px){.ci-secondary-panel{padding:15px 12px}.ci-secondary-row{font-size:15px}}
</style>

 <div class="ci-secondary-list" id="ci-resources-items">
  <button type="button" class="ci-secondary-row primary" data-ci-group="resources" data-ci-feature="Program Handbook"><span>Program Handbook</span><span class="ci-secondary-chevron">›</span></button>

<script>
(function(){
 const allowed={workspace:['Notifications','My Submissions','Submit Availability','Mileage Submission','Survey Responses','CI Notes & Reports','Incident Reports'],resources:['Program Handbook','Clinical Syllabus','Evaluation & Scoring Guide']};
 window.ciSecondaryBack=function(group){const items=document.getElementById('ci-'+group+'-items'),detail=document.getElementById('ci-'+group+'-detail');if(items&&detail){items.hidden=false;detail.hidden=true;detail.replaceChildren();}};
 window.ciSecondaryOpen=function(group,feature){if(!allowed[group]?.includes(feature))return;if(group==='resources'&&window.ciResourceOpen_){window.ciResourceOpen_(feature);return;}if(group==='workspace'&&window.ciWorkspaceOpen_&&window.ciWorkspaceOpen_(feature))return;const items=document.getElementById('ci-'+group+'-items'),detail=document.getElementById('ci-'+group+'-detail');if(!items||!detail)return;
  items.hidden=true;detail.hidden=false;detail.replaceChildren();const back=document.createElement('button');back.className='ci-secondary-back';back.type='button';back.textContent='‹';back.setAttribute('aria-label','Back to '+group);back.onclick=()=>ciSecondaryBack(group);
  const box=document.createElement('div');box.className='ci-secondary-detail';const h=document.createElement('h2');h.textContent=feature;const p=document.createElement('p');p.textContent='This section is part of the approved portal navigation. Its data, permissions and actions will be connected in a dedicated implementation pass; no records or notifications are generated from this screen.';box.append(h,p);detail.append(back,box);
 };
 document.addEventListener('click',function(e){const b=e.target.closest('[data-ci-group][data-ci-feature]');if(!b)return;ciSecondaryOpen(b.dataset.ciGroup,b.dataset.ciFeature);});
})();
</script>

<script>
(function(){
 const DOCS={'Program Handbook':'handbook','Clinical Syllabus':'syllabus'};
 function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;}
 function shell(title){
  const items=document.getElementById('ci-resources-items'),detail=document.getElementById('ci-resources-detail');
  items.hidden=true;detail.hidden=false;detail.replaceChildren();
  const wrap=el('div','ci-res-wrap'),bar=el('div','ci-res-bar');
  const back=el('button','ci-secondary-back','‹');back.type='button';back.setAttribute('aria-label','Back to Resources');back.onclick=()=>ciSecondaryBack('resources');
  const h=el('h2','',title);bar.append(back,h);wrap.append(bar);detail.append(wrap);return {wrap,bar};
 }
 function fail(target,err){target.replaceChildren(el('div','ci-res-status','Could not load this resource: '+String(err?.message||err)));}
 function openDoc(title,key){
  const {wrap,bar}=shell(title);const status=el('div','ci-res-status','Loading '+title+'…');wrap.append(status);
  const meta=el('span','ci-res-meta','');const pdf=el('button','ci-res-btn','Download PDF');pdf.type='button';bar.append(meta,pdf);
  pdf.onclick=()=>{pdf.disabled=true;pdf.textContent='Preparing PDF…';
   ciRun('ciR1ResourcePdf',ciToken,key).then(r=>{
    const bytes=Uint8Array.from(atob(r.base64),c=>c.charCodeAt(0));const url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));
    const a=document.createElement('a');a.href=url;a.download=r.fileName||title+'.pdf';document.body.append(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),60000);pdf.textContent='Download PDF';pdf.disabled=false;
   }).catch(e=>{pdf.textContent='Download PDF';pdf.disabled=false;alert('PDF unavailable: '+String(e?.message||e));});};
  ciRun('ciR1ResourceDocument',ciToken,key).then(r=>{
   meta.textContent='Updated '+r.updated;
   const frame=document.createElement('iframe');frame.className='ci-res-doc';frame.title=title;
   frame.setAttribute('sandbox','allow-same-origin allow-popups allow-popups-to-escape-sandbox');
   const style='<style>body{margin:0;padding:18px clamp(12px,4vw,40px);max-width:860px;font-family:Inter,"Segoe UI",Arial,sans-serif;color:#1d3550;line-height:1.5;overflow-wrap:anywhere}img{max-width:100%!important;height:auto!important}table{max-width:100%!important;width:auto!important;display:block;overflow-x:auto}body>*{max-width:100%!important}</style>';
   frame.srcdoc=String(r.html).replace(/<head([^>]*)>/i,'<head$1><base target="_blank">'+style);
   frame.onload=()=>{try{const d=frame.contentDocument;const fit=()=>{frame.style.height=Math.max(500,d.documentElement.scrollHeight+24)+'px';};fit();setTimeout(fit,600);setTimeout(fit,2000);}catch(e){}};
   status.replaceWith(frame);
  }).catch(e=>fail(status.parentNode?status:wrap,e));
 }
 function fmt(n){return (n>0?'+':'')+String(n);}
 function openGuide(){
  const {wrap}=shell('Evaluation & Scoring Guide');const status=el('div','ci-res-status','Loading the current scoring rules…');wrap.append(status);
  ciRun('ciR1ScoringGuide',ciToken).then(g=>{
   const box=el('div','ci-sg');const p=g.penalties,pass=Number(g.rules.passEach).toFixed(1);
   const add=(tag,text,cls)=>{const e=el(tag,cls,text);box.append(e);return e;};
   add('p','These rules are read live from the CCMS Scoring Weights and Image Scoring Rules sheets and the official evaluation form, so they always match how grades are calculated.');
   add('h3','1. Performance rating scale');
   const t1=el('table');t1.innerHTML='<tr><th>Score</th><th>Meaning</th></tr>';
   [['0','Gross Error'],['1','Minor Error'],['2','Satisfactory'],['3','Optimal'],['N/A','Not applicable — not scored and not counted']].forEach(([s,m],i)=>{const tr=document.createElement('tr');tr.className=i<4?'s'+i:'';tr.append(el('td','',s),el('td','',m));t1.append(tr);});box.append(t1);
   add('h3','2. How each performance section is calculated');
   add('p','Every criterion has a weight. A criterion’s points are its score × its weight. N/A criteria are left out of both the points and the weights.');
   add('div','Section score = (sum of score × weight) ÷ (sum of weights scored)\nPerformance score = the same calculation across all sections together','formula');
   add('p','Example: criteria weighted 2 and 1, scored 3 and 2 → (3×2 + 2×1) ÷ (2+1) = 8 ÷ 3 = 2.67.');
   (g.sections||[]).forEach(s=>{const d=document.createElement('details');d.append(el('summary','',s.title+' — '+s.criteria.length+' criteria'));
    const t=el('table');t.innerHTML='<tr><th>#</th><th>Criterion</th><th>Weight</th></tr>';
    s.criteria.forEach((c,i)=>{const tr=document.createElement('tr');tr.append(el('td','',String(i+1)),el('td','',c.criterion),el('td','',c.weight==null?'—':String(c.weight)));t.append(tr);});d.append(t);box.append(d);});
   add('h3','3. Image evaluation');
   add('p','Each view is scored 0–3 on each of its image criteria. The official descriptions are:');
   (g.image||[]).filter(q=>!/marker/i.test(q.title)).forEach(q=>{const d=document.createElement('details');d.append(el('summary','',q.title));
    const t=el('table');q.choices.forEach(c=>{const m=String(c).match(/^\s*([0-3])/);const tr=document.createElement('tr');if(m)tr.className='s'+m[1];tr.append(el('td','',c));t.append(tr);});d.append(t);box.append(d);});
   add('h3','4. Image penalties');
   const t2=el('table');t2.innerHTML='<tr><th>Situation</th><th>Points</th></tr>';
   [['Any criterion scored 0 in a view (applied once per view)',p.zero],['Missing marker (per view)',p.missingMarker],['Wrong marker (per view)',p.wrongMarker],['Illegible or poorly placed marker (per view)',p.illegibleMarker]]
    .forEach(([a,b])=>{const tr=document.createElement('tr');tr.append(el('td','',a),el('td','',fmt(b)));t2.append(tr);});box.append(t2);
   add('div','Image score = (all image criterion scores + all penalties) ÷ (number of image criteria scored)\nThe image score never goes below 0.','formula');
   add('p','Example: one view scored 3, 2, 0, 3 with a correct marker → (8 '+fmt(p.zero)+') ÷ 4 = '+((8+Number(p.zero))/4).toFixed(2)+'.');
   add('h3','5. Final grade and pass rule');
   add('div','Final competency grade = (Performance score + Image score) ÷ 2','formula');
   const ul=el('ul');[
    'To pass, the Performance score AND the Image score must each be '+pass+' or higher.',
    'An Automatic Failure makes the final competency grade 0.0, whatever the other scores are.',
    'Scores are on a 0–'+g.rules.scaleMax+' scale.'].forEach(x=>ul.append(el('li','',x)));box.append(ul);
   status.replaceWith(box);
  }).catch(e=>fail(status,e));
 }
 window.ciResourceOpen_=function(feature){if(DOCS[feature])openDoc(feature,DOCS[feature]);else if(feature==='Evaluation & Scoring Guide')openGuide();};
})();
</script>

<style id="ci-notifications-style">
.ci-nt-wrap{max-width:900px}.ci-nt-bar{display:flex;align-items:center;gap:10px;margin:0 0 12px}.ci-nt-bar h2{margin:0;font-size:20px;color:#112944;flex:1}
.ci-nt-list{display:flex;flex-direction:column;gap:8px}
.ci-nt-item{display:block;width:100%;text-align:left;border:1px solid #d7e5f0;border-radius:10px;background:#fff;padding:12px 14px;cursor:pointer;color:#173653;font:inherit}
.ci-nt-item.unread{border-color:#9fc8ed;background:#f3f9ff}.ci-nt-item.returned{border-left:5px solid #dc3037}.ci-nt-item.accepted{border-left:5px solid #25a954}
.ci-nt-item b{display:block;font-size:14px}.ci-nt-item small{display:block;color:#5e7288;font-size:12px;margin-top:3px}.ci-nt-item p{margin:6px 0 0;font-size:13px;color:#33506b;white-space:pre-wrap}
.ci-nt-chip{display:inline-block;border-radius:99px;padding:2px 9px;font-size:11px;font-weight:800;margin-left:6px}
.ci-nt-chip.Returned{background:#ffe8ea;color:#c4262d}.ci-nt-chip.Accepted{background:#e6f5ec;color:#17733a}.ci-nt-chip.Submitted{background:#eaf3fc;color:#0a63b4}
.ci-nt-detail{border:1px solid #d7e5f0;border-radius:11px;background:#fff;padding:18px}.ci-nt-detail h3{margin:0 0 6px;font-size:17px;color:#112944}
.ci-nt-note{background:#fff6f6;border:1px solid #f4d0d3;border-radius:9px;padding:12px;white-space:pre-wrap;margin:10px 0;font-size:14px;color:#33263a}
.ci-nt-note.ok{background:#f2fbf5;border-color:#cfe9d8}
.ci-nt-detail textarea{width:100%;min-height:100px;border:1px solid #bcd0e2;border-radius:8px;padding:9px;font:inherit}
.ci-nt-btn{border:1px solid #0878e5;background:#0878e5;color:#fff;border-radius:8px;padding:9px 14px;font:inherit;font-weight:700;cursor:pointer}.ci-nt-btn.ghost{background:#fff;color:#0878e5}
.ci-nt-table{width:100%;border-collapse:collapse;font-size:13px;background:#fff}.ci-nt-table th,.ci-nt-table td{border-bottom:1px solid #e3ecf3;padding:8px;text-align:left;vertical-align:top}.ci-nt-table th{color:#5e7288;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
.ci-nt-filters{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}.ci-nt-filters button{border:1px solid #c9dce9;background:#fff;color:#426989;border-radius:99px;padding:5px 11px;font:inherit;font-size:12px;cursor:pointer}.ci-nt-filters button.on{background:#0878e5;border-color:#0878e5;color:#fff}
#ci-bell-pop{position:absolute;right:0;top:42px;z-index:60;width:340px;max-height:420px;overflow:auto;background:#fff;color:#173653;border:1px solid #d7e5f0;border-radius:10px;box-shadow:0 12px 30px rgba(6,43,74,.25);text-align:left}
#ci-bell-pop .h{padding:10px 14px;font-weight:800;border-bottom:1px solid #e6eef5}#ci-bell-pop button{display:block;width:100%;border:0;border-bottom:1px solid #eef3f7;background:#fff;text-align:left;padding:10px 14px;cursor:pointer;font:inherit;color:#173653}
#ci-bell-pop button.unread{background:#f3f9ff}#ci-bell-pop small{display:block;color:#5e7288;font-size:11px}#ci-bell-pop .e{padding:14px;color:#5e7288;font-size:13px}
</style>
<script id="ci-notifications-script">
(function(){
 const tok=()=>{try{return ciToken||'';}catch(e){return '';}},home=()=>{try{return ciHome;}catch(e){return null;}},page=()=>{try{return ciPage;}catch(e){return '';}};
 const S={list:null,unread:0,subs:null,filter:'all',loading:false,subsLoading:false};
 const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const when=v=>{const d=new Date(v);return isNaN(d)?String(v||''):d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})+' '+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});};
 const isCollegeCi=()=>String(home()?.evaluator?.evaluatorType||'').trim().toLowerCase()==='college ci';
 window.ciOpenWorkspaceFeature_=function(f){if(typeof ciGoWorkspace==='function')ciGoWorkspace();if(page()==='workspace')ciSecondaryOpen('workspace',f);};
 function paintBadges(){
  const b=document.getElementById('ci-bell-count');if(b){b.textContent=String(S.unread);b.hidden=!S.unread;}
  const w=document.getElementById('ci-ws-unread');if(w){w.textContent=String(S.unread);w.hidden=!S.unread;}
 }
 function paintHome(){
  const sec=document.getElementById('ci-home-updates'),host=document.getElementById('ci-home-updates-list');
  if(sec&&host){
   const items=(S.list||[]).filter(n=>n.status==='Unread'||(n.type==='Returned'&&!n.response)).slice(0,4);
   sec.hidden=!items.length;host.replaceChildren();
   items.forEach(n=>host.append(itemButton(n)));
  }
  const rec=document.getElementById('ci-home-recent');
  if(rec&&S.subs){
   const top=S.subs.slice(0,5);
   if(!top.length){rec.className='empty';rec.textContent='No submissions yet.';}
   else{rec.className='';rec.style.padding='0 14px 12px';rec.innerHTML='<table class="ci-nt-table"><tbody>'+top.map(x=>'<tr><td><b>'+esc(x.student)+'</b><div style="color:#5e7288;font-size:12px">'+esc(x.title)+(x.kind==='evaluation'&&x.evaluationType?' · '+esc(x.evaluationType):'')+'</div></td><td>'+esc(x.date)+'</td><td>'+esc(x.result)+'</td><td><span class="ci-nt-chip '+esc(x.status)+'">'+esc(x.status==='Submitted'?'Awaiting review':x.status)+'</span></td></tr>').join('')+'</tbody></table>';}
  }
 }
 function itemButton(n){
  const b=document.createElement('button');b.type='button';
  const bad=n.type==='Returned'||n.type==='Availability Declined'||n.type==='Mileage Returned'||n.type==='Distance Declined'||n.type==='Reflection Returned'||n.type==='CI Report Returned';const info=n.type==='Availability Reminder'||n.type==='Site Assignment'||n.type==='Mileage Reminder'||n.type==='Reflection Requested';
  b.className='ci-nt-item'+(n.status==='Unread'?' unread':'')+(bad?' returned':info?'':' accepted');
  b.innerHTML='<b>'+esc(n.title)+'<span class="ci-nt-chip '+(bad?'Returned':info?'Submitted':'Accepted')+'">'+esc(n.type==='Returned'?'Returned to you':n.type==='Availability Declined'?'Declined':n.type==='Availability Approved'?'Approved':n.type==='Availability Reminder'?'Reminder':n.type==='Site Assignment'?'Assignment':n.type==='Mileage Approved'||n.type==='Distance Approved'?'Approved':n.type==='Mileage Returned'?'Returned to you':n.type==='Distance Declined'?'Declined':n.type==='Mileage Reminder'?'Reminder':n.type==='Reflection Requested'?'To complete':n.type==='Reflection Accepted'?'Accepted':n.type==='Reflection Returned'?'Returned to you':n.type==='CI Report Accepted'?'Accepted':n.type==='CI Report Returned'?'Returned to you':n.type==='Incident Reviewed'?'Reviewed':n.type)+'</span></b><small>'+esc(n.student)+' · from '+esc(n.from)+' · '+esc(when(n.createdAt))+'</small>'+(n.message?'<p>'+esc(n.message.length>220?n.message.slice(0,220)+'…':n.message)+'</p>':'');
  b.onclick=()=>openNotification(n.id);return b;
 }
 window.ciNtRefresh_=async function(){
  if(!tok()||S.loading||!isCollegeCi())return;S.loading=true;
  try{const r=await ciRun('ciR1Notifications',tok());S.list=r.notifications||[];S.unread=Number(r.unread||0);}catch(e){console.warn('Notifications unavailable',e);}
  S.loading=false;paintBadges();paintHome();
  if(!S.subsLoading){S.subsLoading=true;try{const s=await ciRun('ciR1MySubmissions',tok());S.subs=s.submissions||[];}catch(e){console.warn('Submissions unavailable',e);}S.subsLoading=false;paintHome();}
 };
 window.ciBellToggle_=function(ev){
  ev&&ev.stopPropagation();let pop=document.getElementById('ci-bell-pop');
  if(pop){pop.remove();return;}
  const bell=document.getElementById('ci-bell');pop=document.createElement('div');pop.id='ci-bell-pop';
  const items=(S.list||[]).slice(0,8);
  pop.innerHTML='<div class="h">Notifications</div>'+(S.list===null?'<div class="e">Loading…</div>':items.length?'':'<div class="e">No notifications from the coordinator yet.</div>');

or.</p>')+

  if(!n.response){
   const lab=document.createElement('label');lab.textContent=n.type==='Returned'?'Reply to the coordinator (what you checked or corrected, or questions):':'Reply (optional):';lab.style.cssText='display:block;font-weight:700;margin:12px 0 6px';lab.htmlFor='ci-nt-reply';
   const ta=document.createElement('textarea');ta.id='ci-nt-reply';ta.maxLength=4000;

   const send=document.createElement('button');send.type='button';send.className='ci-nt-btn';send.textContent='Send reply';
   const msg=document.createElement('div');msg.setAttribute('role','status');msg.style.cssText='font-size:13px;margin-top:8px';
   send.onclick=async()=>{const t=ta.value.trim();if(!t){msg.textContent='Write a reply first.';return;}send.disabled=true;send.textContent='Sending…';
    try{await ciRun('ciR1NotificationReply',tok(),n.id,t);n.response=t;n.respondedAt=new Date().toISOString();n.status='Read';msg.textContent='✓ Reply sent to the coordinator.';send.textContent='Sent';S.list=null;ciNtRefresh_();}
    catch(e){send.disabled=false;send.textContent='Send reply';msg.textContent='Reply not sent: '+String(e?.message||e);}};
   row.append(send);box.append(lab,ta,row,msg);
  }

 async function showSubmissions(){

  };draw();
 }
 window.ciWorkspaceOpen_=function(feature){

  if(feature==='Submit Availability'&&window.ciAvailabilityOpen_){window.ciAvailabilityOpen_();return true;}

 }
 setInterval(kick,1500);setInterval(()=>{if(tok()&&home()){S.subsLoading=false;ciNtRefresh_();}},120000);
})();

<script id="ci-availability-script">
(function(){
 const tok=()=>{try{return ciToken||'';}catch(e){return '';}};
 const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const nice=d=>{const p=new Date(d+'T12:00:00');return isNaN(p)?d:p.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});};
 const hm=t=>{if(!t)return '';const [h,m]=t.split(':').map(Number);return new Date(2000,0,1,h,m).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});};
 window.ciAvailabilityOpen_=function(){
  const items=document.getElementById('ci-workspace-items'),detail=document.getElementById('ci-workspace-detail');
  items.hidden=true;detail.hidden=false;

  '<div class="ci-av-grid"><div><div class="ci-av-card"><h3>Add availability</h3>'+
   '<label for="ci-av-date">Date</label><div class="ci-av-row"><div><input type="date" id="ci-av-date" min="'+iso(today)+'"></div><button type="button" class="ci-nt-btn ghost" id="ci-av-adddate">Add date</button></div><div class="ci-av-dates" id="ci-av-dates"></div>'+

   '<label style="display:flex;gap:8px;align-items:center;font-size:13px;color:#214360"><input type="checkbox" id="ci-av-window" style="width:auto"> Add a time window (optional)</label>'+

   '<label for="ci-av-note">Note for the coordinator (optional)</label><textarea id="ci-av-note" rows="2" maxlength="500" placeholder="e.g. preferred site, mornings only"></textarea>'+
   '<div style="display:flex;justify-content:flex-end;margin-top:12px"><button type="button" class="ci-nt-btn" id="ci-av-submit">Submit availability</button></div><div id="ci-av-msg" role="status" style="font-size:13px;margin-top:8px"></div>'+

   '<div class="ci-av-card" style="margin-top:14px"><h3>My availability</h3><div class="ci-av-list" id="ci-av-list">Loading…</div></div></div>'+
   '<div><iframe class="ci-av-frame" id="ci-av-frame" title="Shared clinical instructor availability calendar" hidden></iframe><div class="ci-res-status" id="ci-av-frame-note">Loading the shared calendar…</div></div></div></div>';
  detail.querySelector('.ci-secondary-back').onclick=()=>ciSecondaryBack('workspace');
  const dates=new Set();const $=id=>document.getElementById(id);
  const drawDates=()=>{$('ci-av-dates').innerHTML=[...dates].sort().map(d=>'<span class="ci-av-date">'+esc(nice(d))+' <button type="button" data-d="'+d+'" aria-label="Remove '+esc(d)+'">×</button></span>').join('');
   $('ci-av-dates').querySelectorAll('button').forEach(b=>b.onclick=()=>{dates.delete(b.dataset.d);drawDates();});};
  $('ci-av-adddate').onclick=()=>{const v=$('ci-av-date').value;if(v){dates.add(v);drawDates();$('ci-av-date').value='';}};

<script id="ci-mileage-script">

  const body=document.getElementById('ci-ml-body');if(!body)return;
  try{
   const d=await ciRun('ciR1MileageInit',tok(),S.term||'',S.addSites);S.data=d;S.term=d.term;
   const sel=document.getElementById('ci-ml-term');sel.innerHTML=d.terms.map(t=>'<option'+(t===d.term?' selected':'')+'>'+esc(t)+'</option>').join('');
   S.picked={};S.extra=[];
   if(d.submission&&d.submission.trips.length){d.submission.trips.forEach(t=>{const a=d.assignments.find(x=>x.date===t.date&&x.siteId===t.siteId);if(a)S.picked[t.date+'|'+t.siteId]=true;else S.extra.push({date:t.date,siteId:t.siteId,site:t.site});});}
   else d.assignments.filter(a=>a.past).forEach(a=>{S.picked[a.date+'|'+a.siteId]=true;});
   draw();
  }catch(e){body.innerHTML='<div class="ci-res-status">Could not load mileage: '+esc(e?.message||e)+'</div>';}
 }
 function siteOf(id){return (S.data.sites||[]).find(s=>s.siteId===id);}
 function paid(id){const s=siteOf(id);return s&&s.distance&&s.distance.status!=='Declined'?s.distance.reimbursedMiles:null;}
 function draw(){
  const d=S.data,body=document.getElementById('ci-ml-body');if(!body||!d)return;
  const sub=d.submission,locked=sub&&sub.status==='Approved';
  let h='<div class="ci-ml-note">Mileage is <b>one way</b> at <b>$'+esc(String(d.rate))+'</b> a mile. For each site you are paid the <b>shorter</b> of your home → site or '+esc(d.collegeLabel)+' → site. Tolls and parking are reimbursed separately. Your home address is never asked for or stored.</div>';
  if(sub){h+='<div class="ci-ml-banner '+esc(sub.status)+'"><b>'+esc(d.term)+' mileage: '+esc(sub.status==='Submitted'?'submitted, awaiting review':sub.status==='Returned'?'returned to you for changes':'approved')+'</b> · '+esc(sub.totalMiles)+' mi · '+money(sub.totalAmount)+(sub.version>1?' · version '+esc(sub.version):'')+(sub.coordinatorNote?'<div style="margin-top:4px;white-space:pre-wrap">Coordinator: '+esc(sub.coordinatorNote)+'</div>':'')+(sub.status==='Submitted'?'<div style="margin-top:4px">You can still change it below and submit again until it is reviewed.</div>':'')+'</div>';}
  // Sites / distances
  h+='<div class="ci-ml-card"><h3>1 · My miles by site</h3><p class="sub">Enter your one-way miles from home to each site (look it up in Google Maps). If home is the shorter route, attach that Google Maps route as a PDF (Print → Save as PDF). The coordinator approves each distance once.</p>';
  if(!d.sites.length)h+='<div class="ci-ml-muted">No clinical sites yet for '+esc(d.term)+'. Sites appear here when you are assigned, or add one below.</div>';
  else h+='<table class="ci-ml-t"><thead><tr><th>Site</th><th>Campus → site</th><th>Home → site</th><th>Paid per trip</th><th>Route PDF</th><th>Status</th><th></th></tr></thead><tbody>'+d.sites.map(s=>{
   const dist=s.distance;const st=dist?dist.status:'None';
   if(!s.ready)return '<tr><td><b>'+esc(s.site)+'</b></td><td colspan="6" class="ci-ml-muted">The coordinator has not set up mileage for this site yet.</td></tr>';
   return '<tr data-site="'+esc(s.siteId)+'"><td><b>'+esc(s.site)+'</b>'+(s.address?'<div class="ci-ml-muted">'+esc(s.address)+'</div>':'')+'</td><td>'+esc(s.collegeMiles)+' mi</td>'+
    '<td><input type="number" min="0.1" max="300" step="0.1" class="ci-ml-home" value="'+(dist&&dist.homeMiles!=null?esc(dist.homeMiles):'')+'" '+(locked?'disabled':'')+' aria-label="Home to '+esc(s.site)+' miles"> mi</td>'+
    '<td class="ci-ml-paid">'+(dist?esc(dist.reimbursedMiles)+' mi<div class="ci-ml-muted">'+(dist.basis==='Home'?'home route':'campus route')+'</div>':'—')+'</td>'+
    '<td class="ci-ml-pdfcell">'+(dist&&dist.hasPdf?'<span class="ci-ml-muted">✓ attached</span><br>':'')+'<input type="file" accept="application/pdf" class="ci-ml-pdf" '+(locked?'disabled':'')+' hidden></td>'+
    '<td><span class="ci-ml-st '+esc(st)+'">'+esc(st==='None'?'Not set':st)+'</span>'+(dist&&dist.note&&st!=='Pending'?'<div class="ci-ml-muted" style="margin-top:3px">'+esc(dist.note)+'</div>':'')+'</td>'+
    '<td>'+(locked?'':'<button type="button" class="ci-nt-btn ghost ci-ml-save" style="padding:5px 10px;font-size:12px">Save</button>')+'</td></tr>';
  }).join('')+'</tbody></table>';
  if(!locked&&(d.otherSites||[]).length)h+='<div class="ci-ml-add"><select id="ci-ml-othersite"><option value="">Add another site…</option>'+d.otherSites.map(s=>'<option value="'+esc(s.siteId)+'">'+esc(s.site)+'</option>').join('')+'</select><button type="button" class="ci-nt-btn ghost" id="ci-ml-addsite" style="padding:6px 10px;font-size:12px">Add site</button></div>';
  h+='<div id="ci-ml-distmsg" role="status" style="font-size:13px;margin-top:8px"></div></div>';
  // Trips
  const rows=d.assignments.map(a=>({key:a.date+'|'+a.siteId,date:a.date,siteId:a.siteId,site:a.site,onSchedule:true,past:a.past})).concat(S.extra.map(x=>({key:x.date+'|'+x.siteId,date:x.date,siteId:x.siteId,site:x.site||(siteOf(x.siteId)||{}).site||x.siteId,onSchedule:false,past:true,extra:true})))
   .sort((a,b)=>a.date.localeCompare(b.date));
  let tm=0,ta=0,missing=0;
  h+='<div class="ci-ml-card"><h3>2 · Trips in '+esc(d.term)+'</h3><p class="sub">Your clinical days from the CI schedule are listed. Tick the days you drove. Add a day that is missing from the schedule below; the coordinator will see it marked as not on the schedule.</p>';
  if(!rows.length)h+='<div class="ci-ml-muted">No clinical days on the CI schedule for '+esc(d.term)+'.</div>';
  else h+='<table class="ci-ml-t"><thead><tr><th></th><th>Date</th><th>Site</th><th>Miles</th><th>Amount</th><th></th></tr></thead><tbody>'+rows.map(r=>{
   const m=paid(r.siteId),on=!!S.picked[r.key]||r.extra;
   if(on&&r.past){if(m==null)missing++;else{tm+=m;ta+=Math.round(m*d.rate*100)/100;}}
   return '<tr><td><input type="checkbox" class="ci-ml-pick" data-k="'+esc(r.key)+'" '+(on?'checked':'')+' '+(!r.past||locked||r.extra?'disabled':'')+' aria-label="Drove on '+esc(r.date)+'"></td><td>'+esc(nice(r.date))+'</td><td>'+esc(r.site)+(r.onSchedule?'':' <span class="ci-ml-st Pending">not on schedule</span>')+'</td>'+
    '<td>'+(!r.past?'<span class="ci-ml-muted">upcoming</span>':m==null?'<span class="ci-ml-muted">set up miles above</span>':esc(m))+'</td><td>'+(r.past&&m!=null&&on?money(m*d.rate):'')+'</td><td>'+(r.extra&&!locked?'<button type="button" class="ci-nt-btn ghost ci-ml-rm" data-k="'+esc(r.key)+'" style="padding:3px 8px;font-size:12px">Remove</button>':'')+'</td></tr>';
  }).join('')+'</tbody></table>';
  if(!locked){
   const allSites=(d.sites||[]).filter(s=>s.ready);
   h+='<div class="ci-ml-add"><div><label class="ci-ml-muted" for="ci-ml-xdate">Day not on the schedule</label><br><input type="date" id="ci-ml-xdate" min="'+esc(d.start)+'" max="'+esc(d.today<d.end?d.today:d.end)+'"></div><div><label class="ci-ml-muted" for="ci-ml-xsite">Site</label><br><select id="ci-ml-xsite"><option value="">Choose…</option>'+allSites.map(s=>'<option value="'+esc(s.siteId)+'">'+esc(s.site)+'</option>').join('')+'</select></div><button type="button" class="ci-nt-btn ghost" id="ci-ml-xadd" style="padding:6px 10px;font-size:12px">Add day</button></div>';
  }
  h+='<div class="ci-ml-tot"><span>Total miles <b>'+esc(Math.round(tm*10)/10)+'</b></span><span>Total <b>'+money(ta)+'</b></span></div>'+(missing?'<div class="ci-ml-muted" style="text-align:right;color:#c4262d">'+missing+' ticked day'+(missing===1?' needs':'s need')+' your miles for that site first.</div>':'');
  if(!locked)h+='<label class="ci-ml-muted" for="ci-ml-note" style="display:block;margin-top:12px;font-weight:700">Note for the coordinator (optional)</label><textarea id="ci-ml-note" rows="2" maxlength="1000" style="width:100%;border:1px solid #bcd0e2;border-radius:8px;padding:8px;font:inherit">'+esc(sub?sub.note:'')+'</textarea>'+
   '<div style="display:flex;justify-content:flex-end;gap:10px;align-items:center;margin-top:10px"><span id="ci-ml-msg" role="status" style="font-size:13px"></span><button type="button" class="ci-nt-btn" id="ci-ml-submit">'+(sub?'Submit updated mileage':'Submit mileage')+'</button></div>';
  h+='</div>';
  body.innerHTML=h;wire();
 }
 function wire(){
  const body=document.getElementById('ci-ml-body'),d=S.data;
  body.querySelectorAll('tr[data-site]').forEach(tr=>{
   const s=siteOf(tr.dataset.site),inp=tr.querySelector('.ci-ml-home'),f=tr.querySelector('.ci-ml-pdf');
   const upd=()=>{const v=Number(inp.value);const homeShorter=v>0&&v<s.collegeMiles;if(f)f.hidden=!homeShorter;
    tr.querySelector('.ci-ml-paid').innerHTML=v>0?esc(Math.min(v,s.collegeMiles))+' mi<div class="ci-ml-muted">'+(homeShorter?'home route':'campus route')+'</div>':'—';};
   if(inp){inp.oninput=upd;if(inp.value)upd();}
   const btn=tr.querySelector('.ci-ml-save');if(!btn)return;
   btn.onclick=async()=>{
    const msg=document.getElementById('ci-ml-distmsg');const v=Number(inp.value);
    if(!(v>0&&v<=300)){msg.textContent='Enter your one-way miles from home to '+s.site+'.';return;}
    const file=f&&!f.hidden&&f.files[0];
    if(v<s.collegeMiles&&!file&&!(s.distance&&s.distance.hasPdf)){msg.textContent='Home is your shorter route to '+s.site+'. Attach the Google Maps route PDF.';return;}
    if(file&&file.size>8*1024*1024){msg.textContent='The PDF must be 8 MB or smaller.';return;}
    btn.disabled=true;btn.textContent='Saving…';msg.textContent='';
    try{const req={siteId:s.siteId,homeMiles:v};if(file){req.pdfBase64=await b64(file);}
     const r=await ciRun('ciR1MileageSaveDistance',tok(),req);
     msg.textContent=r.unchanged?'No change for '+s.site+'.':'✓ Saved '+s.site+' — '+r.distance.reimbursedMiles+' mi per trip, waiting for coordinator approval.';
     const t=msg.textContent;await reload();const m2=document.getElementById('ci-ml-distmsg');if(m2)m2.textContent=t;}
    catch(e){msg.textContent='Not saved: '+String(e?.message||e);btn.disabled=false;btn.textContent='Save';}
   };
  });
  const add=document.getElementById('ci-ml-addsite');
  if(add)add.onclick=()=>{const id=document.getElementById('ci-ml-othersite').value;if(!id)return;if(!S.addSites.includes(id))S.addSites.push(id);reload();};
  body.querySelectorAll('.ci-ml-pick').forEach(c=>c.onchange=()=>{if(c.checked)S.picked[c.dataset.k]=true;else delete S.picked[c.dataset.k];draw();});
  body.querySelectorAll('.ci-ml-rm').forEach(b=>b.onclick=()=>{S.extra=S.extra.filter(x=>x.date+'|'+x.siteId!==b.dataset.k);draw();});
  const xa=document.getElementById('ci-ml-xadd');
  if(xa)xa.onclick=()=>{const dt=document.getElementById('ci-ml-xdate').value,sid=document.getElementById('ci-ml-xsite').value,msg=document.getElementById('ci-ml-msg');
   if(!dt||!sid){msg.textContent='Choose the date and the site.';return;}
   if(dt<d.start||dt>d.end||dt>d.today){msg.textContent='That date is not a past day in '+d.term+'.';return;}
   const k=dt+'|'+sid;if(d.assignments.some(a=>a.date+'|'+a.siteId===k)){S.picked[k]=true;draw();return;}
   if(!S.extra.some(x=>x.date+'|'+x.siteId===k))S.extra.push({date:dt,siteId:sid});draw();};
  const sb=document.getElementById('ci-ml-submit');
  if(sb)sb.onclick=async()=>{
   const msg=document.getElementById('ci-ml-msg');
   const trips=d.assignments.filter(a=>a.past&&S.picked[a.date+'|'+a.siteId]).map(a=>({date:a.date,siteId:a.siteId})).concat(S.extra.map(x=>({date:x.date,siteId:x.siteId})));
   if(!trips.length){msg.textContent='Tick at least one day you drove.';return;}
   const miss=trips.filter(t=>paid(t.siteId)==null);
   if(miss.length){msg.textContent='Set up and save your miles for '+[...new Set(miss.map(t=>(siteOf(t.siteId)||{}).site||t.siteId))].join(', ')+' first.';return;}
   if(!confirm('Submit '+trips.length+' trip'+(trips.length===1?'':'s')+' for '+d.term+'?'))return;
   sb.disabled=true;sb.textContent='Submitting…';msg.textContent='';
   try{const r=await ciRun('ciR1MileageSubmit',tok(),{term:d.term,trips:trips,note:document.getElementById('ci-ml-note').value});
    await load();const m=document.getElementById('ci-ml-msg');if(m)m.textContent='✓ Submitted '+r.trips+' trips · '+r.totalMiles+' mi · '+money(r.totalAmount);}
   catch(e){msg.textContent='Not submitted: '+String(e?.message||e);sb.disabled=false;sb.textContent='Submit mileage';}
  };
 }
 async function reload(){const keep={picked:S.picked,extra:S.extra};await load();S.picked=keep.picked;S.extra=keep.extra;draw();}
})();
</script>

<style id="ci-reflection-style">
.ci-rf-head{display:grid;grid-template-columns:150px 1fr;max-width:520px;border:1px solid #d7e5f0;border-radius:10px;overflow:hidden;margin-bottom:14px}.ci-rf-head div{padding:8px 12px;border-bottom:1px solid #e3ecf3;font-size:14px}.ci-rf-head div:nth-child(odd){background:#f3f8fc;font-weight:700;color:#214360}
.ci-rf-sec{border:1px solid #d7e5f0;border-radius:11px;background:#fff;padding:14px 16px;margin-bottom:12px}.ci-rf-sec h3{margin:0 0 6px;font-size:15px;color:#112944}
.ci-rf-sec .guide{font-size:13px;color:#5e7288;font-style:italic;margin:0 0 6px;white-space:pre-line}.ci-rf-sec .q{font-size:13px;color:#214360;text-decoration:underline;margin:0 0 8px}
.ci-rf-sec textarea{width:100%;min-height:130px;border:1px solid #bcd0e2;border-radius:8px;padding:9px;font:inherit;font-size:14px;line-height:1.45}
.ci-rf-sum{background:#f7fafc;border:1px solid #d7e5f0;border-radius:11px;padding:14px 16px;margin-bottom:14px;font-size:14px;white-space:pre-wrap}
.ci-rf-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.ci-rf-tabs button{border:1px solid #bcd0e2;background:#fff;border-radius:99px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}.ci-rf-tabs button.on{background:#0a63b4;color:#fff;border-color:#0a63b4}
</style>
<script id="ci-reflection-script">
(function(){
 const tok=()=>{try{return ciToken||'';}catch(e){return '';}};
 const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const SECTIONS=[
  ['observations','1. Observations and Insights','Reflect on student feedback related to:\n- Assistance with technique books and radiation protection practices\n- Support with positioning skills and image review\n- Patient care guidance and communication\n- Evaluation practices and feedback after testing','What stood out to you in the responses? Were there any common themes or surprises?'],
  ['learning','2. Learning Experiences','- What this feedback taught you about your teaching style or communication\n- Any challenges or successes highlighted in student comments or scores\n- Did you try anything new this semester or make changes based on past feedback?',''],
  ['goals','3. Goals for the future, Improvements','Outline goals for the next semester or throughout the year. These can include:\n- More structured image review\n- Clearer competency expectations\n- Strengthening student support or professional modeling','']];
 let S={list:null,sel:'',name:''};
 const label=s=>s==='Requested'?'To complete':s==='Returned'?'Returned to you':s==='Submitted'?'Submitted, awaiting review':s;
 const chip=s=>'<span class="ci-nt-chip '+(s==='Accepted'?'Accepted':s==='Returned'?'Returned':'Submitted')+'">'+esc(label(s))+'</span>';
 async function download(id,which,btn){
  btn.disabled=true;
  try{const r=await ciRun('ciR1ReflectionPdf',tok(),id,which);const bin=atob(r.base64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
   const url=URL.createObjectURL(new Blob([u],{type:'application/pdf'}));const a=document.createElement('a');a.href=url;a.download=r.name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);}
  catch(e){alert(String(e?.message||e));}btn.disabled=false;
 }
 window.ciReflectionOpen_=function(){
  const items=document.getElementById('ci-workspace-items'),detail=document.getElementById('ci-workspace-detail');
  items.hidden=true;detail.hidden=false;
  detail.innerHTML='<div class="ci-nt-wrap" style="max-width:980px"><div class="ci-nt-bar"><button type="button" class="ci-secondary-back" aria-label="Back to My CI Workspace">‹</button><h2>Survey Responses</h2></div><div id="ci-rf-body"><div class="ci-res-status">Loading…</div></div></div>';
  detail.querySelector('.ci-secondary-back').onclick=()=>ciSecondaryBack('workspace');
  load();
 };
 async function load(){
  const body=document.getElementById('ci-rf-body');if(!body)return;
  try{const r=await ciRun('ciR1ReflectionList',tok());S.list=r.reflections||[];S.name=r.evaluator||'';
   if(!S.sel||!S.list.some(x=>x.reflectionId===S.sel)){const open=S.list.find(x=>x.status==='Requested'||x.status==='Returned');S.sel=(open||S.list[0]||{}).reflectionId||'';}
   draw();}
  catch(e){body.innerHTML='<div class="ci-res-status">Could not load: '+esc(e?.message||e)+'</div>';}
 }
 function draw(){
  const body=document.getElementById('ci-rf-body');if(!body)return;
  if(!S.list.length){body.innerHTML='<div class="ci-res-status">No student feedback summary has been shared with you yet. When the coordinator shares your summary for a semester, it appears here with the Clinical Instructor Summary Reflection Form to complete.</div>';return;}
  const r=S.list.find(x=>x.reflectionId===S.sel)||S.list[0];
  const editable=r.status==='Requested'||r.status==='Returned';
  let h='<div class="ci-rf-tabs">'+S.list.map(x=>'<button type="button" data-id="'+esc(x.reflectionId)+'" class="'+(x.reflectionId===r.reflectionId?'on':'')+'">'+esc(x.term)+' · '+esc(label(x.status))+'</button>').join('')+'</div>';
  if(r.status==='Returned'&&r.coordinatorNote)h+='<div class="ci-ml-banner Returned"><b>Returned by the coordinator:</b> '+esc(r.coordinatorNote)+'</div>';
  if(r.status==='Accepted')h+='<div class="ci-ml-banner Approved"><b>Accepted.</b>'+(r.coordinatorNote?' '+esc(r.coordinatorNote):' Thank you.')+'</div>';
  if(r.status==='Submitted')h+='<div class="ci-ml-banner Submitted"><b>Submitted</b> and waiting for the coordinator’s review.</div>';
  h+='<h3 style="margin:4px 0 8px;font-size:15px;color:#112944">Your student feedback summary — '+esc(r.term)+'</h3>'+
   (r.summaryText?'<div class="ci-rf-sum">'+esc(r.summaryText)+'</div>':'')+(r.hasSummaryPdf?'<div style="margin:-4px 0 14px"><button type="button" class="ci-nt-btn ghost" id="ci-rf-sumpdf">Download summary (PDF)</button></div>':'');
  h+='<div style="text-align:center;margin:10px 0 12px;color:#112944"><div style="font-size:15px">Radiologic Technology Program · SUNY Orange</div><div style="font-size:17px;font-weight:800">Clinical Instructor Summary Reflection Form</div></div>'+
   '<div class="ci-rf-head"><div>Instructor Name:</div><div>'+esc(S.name)+'</div><div>Semester:</div><div>'+esc(r.term)+'</div></div>';
  SECTIONS.forEach(s=>{
   h+='<div class="ci-rf-sec"><h3>'+esc(s[1])+'</h3><p class="guide">'+esc(s[2])+'</p>'+(s[3]?'<p class="q">'+esc(s[3])+'</p>':'')+
    (editable?'<textarea id="ci-rf-'+s[0]+'" maxlength="8000" aria-label="'+esc(s[1])+'">'+esc(r[s[0]])+'</textarea>':'<div style="white-space:pre-wrap;font-size:14px">'+esc(r[s[0]]||'—')+'</div>')+'</div>';
  });
  if(editable)h+='<div style="display:flex;gap:10px;justify-content:flex-end;align-items:center;flex-wrap:wrap"><span id="ci-rf-msg" role="status" style="font-size:13px">'+(r.savedAt?'Draft saved '+esc(new Date(r.savedAt).toLocaleString()):'')+'</span><button type="button" class="ci-nt-btn ghost" id="ci-rf-save">Save draft</button><button type="button" class="ci-nt-btn" id="ci-rf-submit">'+(r.status==='Returned'?'Resubmit reflection':'Submit reflection')+'</button></div>';
  else if(r.hasPdf)h+='<div style="display:flex;justify-content:flex-end"><button type="button" class="ci-nt-btn ghost" id="ci-rf-mypdf">Download my reflection (PDF)</button></div>';
  body.innerHTML=h;
  body.querySelectorAll('.ci-rf-tabs button').forEach(b=>b.onclick=()=>{S.sel=b.dataset.id;draw();});
  const sp=document.getElementById('ci-rf-sumpdf');if(sp)sp.onclick=()=>download(r.reflectionId,'summary',sp);
  const mp=document.getElementById('ci-rf-mypdf');if(mp)mp.onclick=()=>download(r.reflectionId,'reflection',mp);
  const val=()=>({reflectionId:r.reflectionId,observations:document.getElementById('ci-rf-observations').value,learning:document.getElementById('ci-rf-learning').value,goals:document.getElementById('ci-rf-goals').value});
  const sv=document.getElementById('ci-rf-save'),sb=document.getElementById('ci-rf-submit'),msg=document.getElementById('ci-rf-msg');
  if(sv)sv.onclick=async()=>{sv.disabled=true;msg.textContent='Saving…';try{const v=val();await ciRun('ciR1ReflectionSave',tok(),v);Object.assign(r,v,{savedAt:new Date().toISOString()});msg.textContent='✓ Draft saved';}catch(e){msg.textContent='Not saved: '+String(e?.message||e);}sv.disabled=false;};
  if(sb)sb.onclick=async()=>{
   const v=val();const short=SECTIONS.filter(s=>String(v[s[0]]||'').trim().length<20).map(s=>s[1].replace(/^\d\. /,''));
   if(short.length){msg.textContent='Please complete: '+short.join(', ')+' (a few sentences each).';return;}
   if(!confirm('Submit your '+r.term+' reflection to the coordinator?'))return;
   sb.disabled=true;sv.disabled=true;sb.textContent='Submitting…';msg.textContent='';
   try{const v2=Object.assign({},v,{submit:true});await ciRun('ciR1ReflectionSave',tok(),v2);await load();}
   catch(e){msg.textContent='Not submitted: '+String(e?.message||e);sb.disabled=false;sv.disabled=false;sb.textContent='Submit reflection';}
  };
 }
})();
</script>

<style id="ci-notes-style">

<script id="ci-notes-script">
(function(){
 const tok=()=>{try{return ciToken||'';}catch(e){return '';}};
 const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const nice=d=>{const p=new Date(d+'T12:00:00');return isNaN(p)?d:p.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});};
 const KIND={Student:'Student note',Activity:'Lab / lecture activity',Mentoring:'Hospital CI communication'};
 async function dl(fn,id,btn){btn.disabled=true;try{const r=await ciRun(fn,tok(),id);const bin=atob(r.base64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  const url=URL.createObjectURL(new Blob([u],{type:'application/pdf'}));const a=document.createElement('a');a.href=url;a.download=r.name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);}catch(e){alert(String(e?.message||e));}btn.disabled=false;}
 function shell(title){
  const items=document.getElementById('ci-workspace-items'),detail=document.getElementById('ci-workspace-detail');
  items.hidden=true;detail.hidden=false;
  detail.innerHTML='<div class="ci-nt-wrap" style="max-width:1150px"><div class="ci-nt-bar"><button type="button" class="ci-secondary-back" aria-label="Back to My CI Workspace">‹</button><h2>'+esc(title)+'</h2><span id="ci-cn-bar" style="margin-left:auto"></span></div><div id="ci-cn-body"><div class="ci-res-status">Loading…</div></div></div>';
  detail.querySelector('.ci-secondary-back').onclick=()=>ciSecondaryBack('workspace');
  return document.getElementById('ci-cn-body');
 }
 /* ---------------- CI Notes & Reports ---------------- */
 let N={term:'',data:null,kind:'Student',edit:null,student:'',filter:''};
 window.ciNotesOpen_=function(opts){N.student=(opts&&opts.studentId)||N.student||'';N.kind='Student';N.edit=null;shell('CI Notes & Reports');loadN();};
 async function loadN(){
  const body=document.getElementById('ci-cn-body');if(!body)return;
  try{N.data=await ciRun('ciR1NotesInit',tok(),N.term||'');N.term=N.data.term;drawN();}catch(e){body.innerHTML='<div class="ci-res-status">Could not load: '+esc(e?.message||e)+'</div>';}
 }
 function drawN(){
  const d=N.data,body=document.getElementById('ci-cn-body');if(!body||!d)return;
  document.getElementById('ci-cn-bar').innerHTML='<select id="ci-cn-term" aria-label="Semester" style="border:1px solid #bcd0e2;border-radius:8px;padding:6px 8px;font:inherit">'+d.terms.map(t=>'<option'+(t===d.term?' selected':'')+'>'+esc(t)+'</option>').join('')+'</select>';
  document.getElementById('ci-cn-term').onchange=e=>{N.term=e.target.value;N.edit=null;loadN();};
  const e=N.edit||{};const kind=e.kind||N.kind;
  const stuOpts='<option value="">Choose a student…</option>'+d.students.map(s=>'<option value="'+esc(s.studentId)+'"'+((e.studentId||N.student)===s.studentId?' selected':'')+'>'+esc(s.student)+(s.site?' — '+esc(s.site):'')+(s.clinicalTerm?' · '+esc(s.clinicalTerm):'')+'</option>').join('');
  let h='<div class="ci-cn-grid"><div><div class="ci-cn-card"><h3>'+(N.edit?'Edit note':'Add a note')+'</h3><div class="ci-cn-kinds">'+Object.keys(KIND).map(k=>'<button type="button" data-k="'+k+'" class="'+(kind===k?'on':'')+'">'+esc(KIND[k])+'</button>').join('')+'</div>'+
   (kind==='Student'?'<label for="ci-cn-stu">Student</label><select id="ci-cn-stu">'+stuOpts+'</select>':'')+
   '<div class="ci-cn-row"><div><label for="ci-cn-date">Date</label><input type="date" id="ci-cn-date" max="'+esc(d.today)+'" value="'+esc(e.date||d.today)+'"></div><div><label for="ci-cn-site">Site</label><input id="ci-cn-site" maxlength="120" value="'+esc(e.site||'')+'" placeholder="'+(kind==='Student'?'Student’s site':'e.g. Garnet Middletown')+'"></div></div>'+
   '<label for="ci-cn-text">'+(kind==='Student'?'Comments on the student’s progress':kind==='Activity'?'Positioning lab / lecture activity':'Topic(s) discussed with the hospital clinical instructor')+'</label><textarea id="ci-cn-text" maxlength="6000" placeholder="'+(kind==='Student'?'Work ethic, patient care, site familiarity, technical progress, professional development and improvements needed.':kind==='Activity'?'e.g. Development of technique book, positioning lab, review book discussion.':'e.g. Competency expectations for Clinical 3 students.')+'">'+esc(e.text||'')+'</textarea>'+
   '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px">'+(N.edit?'<button type="button" class="ci-nt-btn ghost" id="ci-cn-cancel">Cancel</button>':'')+'<button type="button" class="ci-nt-btn" id="ci-cn-save">'+(N.edit?'Save changes':'Add note')+'</button></div><div id="ci-cn-msg" role="status" style="font-size:13px;margin-top:6px"></div>'+
   '<p style="font-size:12px;color:#5e7288;margin:8px 0 0">Critical issues should still be called in and/or e-mailed to the Clinical Coordinator at the time they occur (or use Incident Report).</p></div>';
  // Report submission
  const counts=p=>{const f=document.getElementById('ci-cr-from')?.value,t=document.getElementById('ci-cr-to')?.value;return d.notes.filter(n=>!n.locked&&(!f||n.date>=f)&&(!t||n.date<=t));};
  const lastTo=d.reports.filter(r=>r.status!=='Returned').map(r=>r.to).sort().pop();
  const fromDef=lastTo?new Date(new Date(lastTo+'T12:00:00').getTime()+864e5).toISOString().slice(0,10):d.start;
  const pracGuess=(()=>{const c={};d.notes.forEach(n=>{if(n.clinicalTerm)c[n.clinicalTerm]=(c[n.clinicalTerm]||0)+1;});return Object.keys(c).sort((a,b)=>c[b]-c[a])[0]||'Clinical 3';})();
  h+='<div class="ci-cn-card"><h3>Submit College Clinical Instructor Report</h3><p style="font-size:12px;color:#5e7288;margin:0 0 6px">Due twice per semester (mid-semester and end of semester), on the same dates as professional competencies. All your notes in the period are placed into the approved report form.</p>'+
   '<div class="ci-cn-row"><div><label for="ci-cr-period">Report</label><select id="ci-cr-period"><option>Mid-semester</option><option'+(d.reports.some(r=>r.period==='Mid-semester'&&r.status!=='Returned')?' selected':'')+'>End of semester</option></select></div><div><label for="ci-cr-prac">Clinical practicum</label><select id="ci-cr-prac">'+[1,2,3,4,5].map(i=>'<option'+('Clinical '+i===pracGuess?' selected':'')+'>Clinical '+i+'</option>').join('')+'</select></div></div>'+
   '<div class="ci-cn-row"><div><label for="ci-cr-from">From</label><input type="date" id="ci-cr-from" min="'+esc(d.start)+'" max="'+esc(d.end)+'" value="'+esc(fromDef<d.start?d.start:fromDef)+'"></div><div><label for="ci-cr-to">To</label><input type="date" id="ci-cr-to" min="'+esc(d.start)+'" max="'+esc(d.today<d.end?d.today:d.end)+'" value="'+esc(d.today<d.end?d.today:d.end)+'"></div></div>'+
   '<div id="ci-cr-count" style="font-size:13px;margin-top:8px"></div><div style="display:flex;justify-content:flex-end;margin-top:8px"><button type="button" class="ci-nt-btn" id="ci-cr-go">Submit report</button></div><div id="ci-cr-msg" role="status" style="font-size:13px;margin-top:6px"></div>'+
   (d.reports.length?'<div style="margin-top:10px">'+d.reports.map(r=>'<div class="ci-cn-item"><div class="h"><b>'+esc(r.period)+'</b> · '+esc(r.practicum)+' · '+esc(r.from)+' – '+esc(r.to)+' <span class="ci-nt-chip '+(r.status==='Accepted'?'Accepted':r.status==='Returned'?'Returned':'Submitted')+'">'+esc(r.status==='Submitted'?'Awaiting review':r.status==='Returned'?'Returned to you':r.status)+'</span>'+(r.hasPdf?'<button type="button" class="ci-nt-btn ghost" style="padding:3px 9px;font-size:12px;margin-left:auto" data-pdf="'+esc(r.reportId)+'">PDF</button>':'')+'</div>'+(r.coordinatorNote?'<div class="t" style="color:'+(r.status==='Returned'?'#c4262d':'#17733a')+'">Coordinator: '+esc(r.coordinatorNote)+'</div>':'')+'</div>').join('')+'</div>':'')+'</div></div>';
  // Notes list
  const list=d.notes.filter(n=>!N.filter||n.kind===N.filter||(N.filter==='mine-student'&&n.studentId===N.student));
  h+='<div><div class="ci-cn-card"><h3>My notes — '+esc(d.term)+' ('+d.notes.length+')</h3><div class="ci-cn-filter">'+[['','All'],['Student','Students'],['Activity','Activities'],['Mentoring','Hospital CI']].map(x=>'<button type="button" class="ci-nt-btn ghost'+(N.filter===x[0]?' on':'')+'" style="padding:4px 10px;font-size:12px'+(N.filter===x[0]?';background:#0a63b4;color:#fff':'')+'" data-f="'+x[0]+'">'+x[1]+'</button>').join('')+'</div>'+
   (list.length?list.map(n=>'<div class="ci-cn-item"><div class="h"><b>'+esc(nice(n.date))+'</b><span class="ci-cn-k '+esc(n.kind)+'">'+esc(n.kind==='Student'?n.student:KIND[n.kind])+'</span>'+(n.site?'<span style="color:#5e7288">'+esc(n.site)+'</span>':'')+(n.locked?'<span style="color:#5e7288;margin-left:auto">in submitted report</span>':'<span style="margin-left:auto"></span><button type="button" class="ci-nt-btn ghost" style="padding:3px 9px;font-size:12px" data-edit="'+esc(n.noteId)+'">Edit</button><button type="button" class="ci-nt-btn ghost" style="padding:3px 9px;font-size:12px" data-del="'+esc(n.noteId)+'">Delete</button>')+'</div><div class="t">'+esc(n.text)+'</div></div>').join(''):'<div style="color:#5e7288;font-size:13px">No notes yet for '+esc(d.term)+'.</div>')+'</div></div></div>';
  body.innerHTML=h;
  const $=id=>document.getElementById(id);
  body.querySelectorAll('.ci-cn-kinds button').forEach(b=>b.onclick=()=>{if(N.edit)N.edit.kind=b.dataset.k;else N.kind=b.dataset.k;const keep={text:$('ci-cn-text').value,date:$('ci-cn-date').value,site:$('ci-cn-site').value};drawN();$('ci-cn-text').value=keep.text;$('ci-cn-date').value=keep.date;$('ci-cn-site').value=keep.site;});
  const stu=$('ci-cn-stu');if(stu){const sync=()=>{const s=d.students.find(x=>x.studentId===stu.value);N.student=stu.value;if(s&&!$('ci-cn-site').value)$('ci-cn-site').value=s.site||'';};stu.onchange=sync;if(!N.edit)sync();}
  if($('ci-cn-cancel'))$('ci-cn-cancel').onclick=()=>{N.edit=null;drawN();};
  $('ci-cn-save').onclick=async()=>{const k=N.edit?N.edit.kind:N.kind;const req={noteId:N.edit?N.edit.noteId:'',kind:k,studentId:stu?stu.value:'',date:$('ci-cn-date').value,site:$('ci-cn-site').value,text:$('ci-cn-text').value};const m=$('ci-cn-msg');
   if(k==='Student'&&!req.studentId){m.textContent='Choose the student.';return;}if(req.text.trim().length<3){m.textContent='Write the note first.';return;}
   $('ci-cn-save').disabled=true;m.textContent='Saving…';try{await ciRun('ciR1NoteSave',tok(),req);N.edit=null;await loadN();const m2=$('ci-cn-msg');if(m2)m2.textContent='✓ Saved';}catch(err){m.textContent='Not saved: '+String(err?.message||err);$('ci-cn-save').disabled=false;}};
  body.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{N.edit=Object.assign({},d.notes.find(n=>n.noteId===b.dataset.edit));drawN();window.scrollTo(0,0);});
  body.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this note?'))return;b.disabled=true;try{await ciRun('ciR1NoteDelete',tok(),b.dataset.del);loadN();}catch(err){alert(String(err?.message||err));b.disabled=false;}});
  body.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{N.filter=b.dataset.f;drawN();});
  body.querySelectorAll('[data-pdf]').forEach(b=>b.onclick=()=>dl('ciR1CiReportPdf',b.dataset.pdf,b));
  const cnt=()=>{const l=counts();const s=l.filter(n=>n.kind==='Student').length,a=l.filter(n=>n.kind==='Activity').length,m=l.filter(n=>n.kind==='Mentoring').length;$('ci-cr-count').innerHTML='Will include <b>'+s+'</b> student note'+(s===1?'':'s')+', <b>'+a+'</b> activit'+(a===1?'y':'ies')+' and <b>'+m+'</b> hospital CI contact'+(m===1?'':'s')+'.';};
  $('ci-cr-from').onchange=cnt;$('ci-cr-to').onchange=cnt;cnt();
  $('ci-cr-go').onclick=async()=>{const req={term:d.term,period:$('ci-cr-period').value,practicum:$('ci-cr-prac').value,from:$('ci-cr-from').value,to:$('ci-cr-to').value};const m=$('ci-cr-msg');
   if(!counts().some(n=>n.kind==='Student')){m.textContent='There are no student notes in this period.';return;}
   if(!confirm('Submit your '+req.period.toLowerCase()+' report ('+req.from+' to '+req.to+') to the coordinator? Notes in it can no longer be edited unless it is returned.'))return;
   $('ci-cr-go').disabled=true;$('ci-cr-go').textContent='Building report…';m.textContent='';
   try{const r=await ciRun('ciR1CiReportSubmit',tok(),req);await loadN();const m2=$('ci-cr-msg');if(m2)m2.textContent='✓ Report submitted ('+r.studentNotes+' student notes).';}
   catch(err){m.textContent='Not submitted: '+String(err?.message||err);$('ci-cr-go').disabled=false;$('ci-cr-go').textContent='Submit report';}};
 }
 /* ---------------- Incident Reports ---------------- */
 let I={data:null,student:''};
 window.ciIncidentOpen_=function(opts){I.student=(opts&&opts.studentId)||'';shell('Incident Reports');loadI();};
 async function loadI(){const body=document.getElementById('ci-cn-body');if(!body)return;try{I.data=await ciRun('ciR1IncidentInit',tok());drawI();}catch(e){body.innerHTML='<div class="ci-res-status">Could not load: '+esc(e?.message||e)+'</div>';}}
 function drawI(){
  const d=I.data,body=document.getElementById('ci-cn-body');if(!body||!d)return;document.getElementById('ci-cn-bar').innerHTML='';
  let h='<div class="ci-cn-grid"><div class="ci-cn-card" style="grid-column:1/-1;max-width:860px"><h3>New incident report (Form 1B — Instructor)</h3>'+
   '<div class="ci-inc-warn">To be completed by the instructor when an incident happens at clinical or on campus. Describe the occurrence, findings and action/consequence. The student must read and sign the form; it is saved in the student’s file. Do not include patient identifiers (name, MRN, accession number). Submitting alerts the Clinical Coordinator and e-mails the coordinator and the department chair.</div>'+
   '<label for="ci-in-stu">Student</label><select id="ci-in-stu"><option value="">Choose a student…</option>'+d.students.map(s=>'<option value="'+esc(s.studentId)+'"'+(I.student===s.studentId?' selected':'')+'>'+esc(s.student)+(s.site?' — '+esc(s.site):'')+'</option>').join('')+'</select>'+
   '<div class="ci-cn-row"><div><label for="ci-in-date">Date of incident</label><input type="date" id="ci-in-date" max="'+esc(d.today)+'" value="'+esc(d.today)+'"></div><div><label for="ci-in-time">Time of incident</label><input type="time" id="ci-in-time"></div></div>'+
   '<div class="ci-cn-row"><div><label for="ci-in-site">Site</label><input id="ci-in-site" maxlength="120"></div><div><label for="ci-in-loc">Specific area / location</label><input id="ci-in-loc" maxlength="300" placeholder="e.g. X-ray room 2, ED"></div></div>'+
   '<div class="ci-cn-row"><div><label for="ci-in-per">Additional person(s) involved</label><input id="ci-in-per" maxlength="500"></div><div><label for="ci-in-wit">Witnesses</label><input id="ci-in-wit" maxlength="500"></div></div>'+
   '<label for="ci-in-desc">Incident description</label><textarea id="ci-in-desc" maxlength="10000" style="min-height:150px" placeholder="What happened, when, who was present, and what you found."></textarea>'+
   '<label for="ci-in-act">Resulting action executed or consequence</label><textarea id="ci-in-act" maxlength="6000"></textarea>'+
   '<div style="display:flex;justify-content:flex-end;margin-top:10px"><button type="button" class="ci-nt-btn" id="ci-in-go" style="background:#c4262d;border-color:#c4262d">Submit incident report</button></div><div id="ci-in-msg" role="status" style="font-size:13px;margin-top:6px"></div></div>'+
   '<div class="ci-cn-card" style="grid-column:1/-1;max-width:860px"><h3>My incident reports</h3>'+(d.incidents.length?d.incidents.map(x=>'<div class="ci-cn-item"><div class="h"><b>'+esc(nice(x.date))+'</b> '+esc(x.student)+' <span style="color:#5e7288">'+esc(x.site)+'</span><span class="ci-nt-chip '+(x.status==='Reviewed'?'Accepted':'Submitted')+'">'+esc(x.status==='Submitted'?'Awaiting review':x.status)+'</span>'+(x.hasPdf?'<button type="button" class="ci-nt-btn ghost" style="padding:3px 9px;font-size:12px;margin-left:auto" data-pdf="'+esc(x.incidentId)+'">PDF</button>':'')+'</div>'+(x.coordinatorNote?'<div class="t">Coordinator: '+esc(x.coordinatorNote)+'</div>':'')+'</div>').join(''):'<div style="color:#5e7288;font-size:13px">None.</div>')+'</div></div>';
  body.innerHTML=h;const $=id=>document.getElementById(id);
  const sync=()=>{const s=d.students.find(x=>x.studentId===$('ci-in-stu').value);if(s)$('ci-in-site').value=s.site||'';};$('ci-in-stu').onchange=sync;sync();
  body.querySelectorAll('[data-pdf]').forEach(b=>b.onclick=()=>dl('ciR1IncidentPdf',b.dataset.pdf,b));
  $('ci-in-go').onclick=async()=>{const m=$('ci-in-msg');const t=$('ci-in-time').value;let time='';if(t){const [hh,mm]=t.split(':').map(Number);time=((hh%12)||12)+':'+String(mm).padStart(2,'0')+' '+(hh<12?'AM':'PM');}
   const req={studentId:$('ci-in-stu').value,date:$('ci-in-date').value,time:time,site:$('ci-in-site').value,location:$('ci-in-loc').value,persons:$('ci-in-per').value,witnesses:$('ci-in-wit').value,description:$('ci-in-desc').value,action:$('ci-in-act').value};
   if(!req.studentId){m.textContent='Choose the student.';return;}if(!req.time){m.textContent='Enter the time of the incident.';return;}if(req.description.trim().length<20){m.textContent='Describe the incident (a few sentences).';return;}
   if(!confirm('Submit this incident report? The coordinator and the department chair will be notified.'))return;
   $('ci-in-go').disabled=true;$('ci-in-go').textContent='Submitting…';m.textContent='';
   try{const r=await ciRun('ciR1IncidentSubmit',tok(),req);I.student='';await loadI();const m2=$('ci-in-msg');if(m2)m2.textContent='✓ Incident report submitted'+(r.emailed?' and e-mailed':'')+'.';}
   catch(err){m.textContent='Not submitted: '+String(err?.message||err);$('ci-in-go').disabled=false;$('ci-in-go').textContent='Submit incident report';}};
 }
})();
</script>
