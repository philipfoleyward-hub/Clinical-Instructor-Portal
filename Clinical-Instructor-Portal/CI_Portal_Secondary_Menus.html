<!-- Approved Workspace + Resources menu-only shell; no fabricated feature data. -->
<style>
.ci-secondary-panel{padding:16px 22px 30px;color:#173653;max-width:none;margin:0;min-height:380px;font-family:Inter,"Segoe UI",Arial,sans-serif}
.ci-secondary-head{display:flex;align-items:center;gap:12px;margin:6px 0 24px;font-weight:800;letter-spacing:.04em;font-size:17px;color:#112944}
.ci-secondary-back{border:0;background:none;color:#0878e5;font-size:26px;line-height:1;cursor:pointer;padding:3px}
.ci-secondary-list{display:flex;flex-direction:column;gap:2px;max-width:350px}.ci-secondary-row{border:0;background:transparent;text-align:left;min-height:46px;padding:12px 14px;border-radius:10px;color:#214360;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:space-between;cursor:pointer;width:100%}
.ci-secondary-row:hover,.ci-secondary-row:focus-visible{background:#f0f6fb;outline-offset:1px}.ci-secondary-row.primary{background:#f1f6fa;color:#0878e5}
.ci-secondary-chevron{color:#0a6fc6;font-size:19px}.ci-secondary-tag{display:inline-block;color:#0878e5;background:#eaf3fc;border-radius:99px;min-width:22px;height:22px;text-align:center;font-size:13px;line-height:22px}
.ci-secondary-label{font-size:12px;font-weight:800;letter-spacing:.045em;color:#7a91a6;padding:13px 14px 7px}
.ci-secondary-detail{max-width:540px;border:1px solid #d7e5f0;border-radius:11px;background:white;padding:22px;color:#214360}.ci-secondary-detail p{line-height:1.6;font-size:14px;color:#5e7288}
.ci-res-wrap{max-width:900px}.ci-res-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:0 0 12px}.ci-res-bar h2{margin:0;font-size:20px;color:#112944;flex:1 1 auto}
.ci-res-meta{color:#5e7288;font-size:12px}.ci-res-btn{border:1px solid #0878e5;background:#fff;color:#0878e5;border-radius:8px;padding:8px 12px;font:inherit;font-weight:700;font-size:13px;cursor:pointer}.ci-res-btn:disabled{opacity:.6}
.ci-res-doc{width:100%;border:1px solid #d7e5f0;border-radius:10px;background:#fff;min-height:70vh;display:block}
.ci-res-status{padding:18px;border:1px dashed #c9d9e6;border-radius:10px;color:#5e7288;background:#fafcfe}
.ci-sg h3{font-size:16px;color:#112944;margin:22px 0 8px}.ci-sg p,.ci-sg li{font-size:14px;line-height:1.55;color:#33506b}.ci-sg table{border-collapse:collapse;width:100%;font-size:13px;margin:6px 0}
.ci-sg th,.ci-sg td{border:1px solid #dce6ee;padding:7px 9px;text-align:left;vertical-align:top}.ci-sg th{background:#f1f6fa;color:#183a5a}
.ci-sg .s0{background:#fde8e8}.ci-sg .s1{background:#fff6d6}.ci-sg .s2,.ci-sg .s3{background:#e6f5ec}.ci-sg details{border:1px solid #dce6ee;border-radius:8px;margin:6px 0;background:#fff}
.ci-sg summary{cursor:pointer;padding:9px 12px;font-weight:700;color:#183a5a}.ci-sg details table{margin:0 0 6px}.ci-sg .formula{background:#f1f6fa;border-radius:8px;padding:10px 12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;color:#183a5a;white-space:pre-wrap}
@media(max-width:600px){.ci-secondary-panel{padding:15px 12px}.ci-secondary-row{font-size:15px}}
</style>

  <button type="button" class="ci-secondary-row" data-ci-group="workspace" data-ci-feature="Notifications"><span>Notifications <span class="ci-secondary-tag" id="ci-ws-unread" hidden>0</span></span><span class="ci-secondary-chevron" aria-hidden="true">›</span></button>
  <button type="button" class="ci-secondary-row" data-ci-group="workspace" data-ci-feature="My Submissions"><span>My Submissions</span><span class="ci-secondary-chevron">›</span></button>

 <div class="ci-secondary-list" id="ci-resources-items">
  <button type="button" class="ci-secondary-row primary" data-ci-group="resources" data-ci-feature="Program Handbook"><span>Program Handbook</span><span class="ci-secondary-chevron">›</span></button>

  <!-- Exposure Grading Scales, Competency Reference and Program Contacts: hidden until instructor input is gathered. -->
 </div>

<script>
(function(){
 const allowed={workspace:['Notifications','My Submissions','Submit Availability','Mileage Submission','Survey Responses'],resources:['Program Handbook','Clinical Syllabus','Evaluation & Scoring Guide']};
 window.ciSecondaryBack=function(group){const items=document.getElementById('ci-'+group+'-items'),detail=document.getElementById('ci-'+group+'-detail');if(items&&detail){items.hidden=false;detail.hidden=true;detail.replaceChildren();}};
 window.ciSecondaryOpen=function(group,feature){if(!allowed[group]?.includes(feature))return;if(group==='resources'&&window.ciResourceOpen_){window.ciResourceOpen_(feature);return;}if(group==='workspace'&&window.ciWorkspaceOpen_&&window.ciWorkspaceOpen_(feature))return;const items=document.getElementById('ci-'+group+'-items'),detail=document.getElementById('ci-'+group+'-detail');if(!items||!detail)return;
  items.hidden=true;detail.hidden=false;detail.replaceChildren();const back=document.createElement('button');back.className='ci-secondary-back';back.type='button';back.textContent='‹';back.setAttribute('aria-label','Back to '+group);back.onclick=()=>ciSecondaryBack(group);
  const box=document.createElement('div');box.className='ci-secondary-detail';const h=document.createElement('h2');h.textContent=feature;const p=document.createElement('p');p.textContent='This section is part of the approved portal navigation. Its data, permissions and actions will be connected in a dedicated implementation pass; no records or notifications are generated from this screen.';box.append(h,p);detail.append(back,box);
 };
 document.addEventListener('click',function(e){const b=e.target.closest('[data-ci-group][data-ci-feature]');if(!b)return;ciSecondaryOpen(b.dataset.ciGroup,b.dataset.ciFeature);});
})();
</script>

<script>
(function(){
 const DOCS={'Program Handbook':'handbook','Clinical Syllabus':'syllabus'};
 function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;}
 function shell(title){
  const items=document.getElementById('ci-resources-items'),detail=document.getElementById('ci-resources-detail');
  items.hidden=true;detail.hidden=false;detail.replaceChildren();
  const wrap=el('div','ci-res-wrap'),bar=el('div','ci-res-bar');
  const back=el('button','ci-secondary-back','‹');back.type='button';back.setAttribute('aria-label','Back to Resources');back.onclick=()=>ciSecondaryBack('resources');
  const h=el('h2','',title);bar.append(back,h);wrap.append(bar);detail.append(wrap);return {wrap,bar};
 }
 function fail(target,err){target.replaceChildren(el('div','ci-res-status','Could not load this resource: '+String(err?.message||err)));}
 function openDoc(title,key){
  const {wrap,bar}=shell(title);const status=el('div','ci-res-status','Loading '+title+'…');wrap.append(status);
  const meta=el('span','ci-res-meta','');const pdf=el('button','ci-res-btn','Download PDF');pdf.type='button';bar.append(meta,pdf);
  pdf.onclick=()=>{pdf.disabled=true;pdf.textContent='Preparing PDF…';
   ciRun('ciR1ResourcePdf',ciToken,key).then(r=>{
    const bytes=Uint8Array.from(atob(r.base64),c=>c.charCodeAt(0));const url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));
    const a=document.createElement('a');a.href=url;a.download=r.fileName||title+'.pdf';document.body.append(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),60000);pdf.textContent='Download PDF';pdf.disabled=false;
   }).catch(e=>{pdf.textContent='Download PDF';pdf.disabled=false;alert('PDF unavailable: '+String(e?.message||e));});};
  ciRun('ciR1ResourceDocument',ciToken,key).then(r=>{
   meta.textContent='Updated '+r.updated;
   const frame=document.createElement('iframe');frame.className='ci-res-doc';frame.title=title;
   frame.setAttribute('sandbox','allow-same-origin allow-popups allow-popups-to-escape-sandbox');
   const style='<style>body{margin:0;padding:18px clamp(12px,4vw,40px);max-width:860px;font-family:Inter,"Segoe UI",Arial,sans-serif;color:#1d3550;line-height:1.5;overflow-wrap:anywhere}img{max-width:100%!important;height:auto!important}table{max-width:100%!important;width:auto!important;display:block;overflow-x:auto}body>*{max-width:100%!important}</style>';
   frame.srcdoc=String(r.html).replace(/<head([^>]*)>/i,'<head$1><base target="_blank">'+style);
   frame.onload=()=>{try{const d=frame.contentDocument;const fit=()=>{frame.style.height=Math.max(500,d.documentElement.scrollHeight+24)+'px';};fit();setTimeout(fit,600);setTimeout(fit,2000);}catch(e){}};
   status.replaceWith(frame);
  }).catch(e=>fail(status.parentNode?status:wrap,e));
 }
 function fmt(n){return (n>0?'+':'')+String(n);}
 function openGuide(){
  const {wrap}=shell('Evaluation & Scoring Guide');const status=el('div','ci-res-status','Loading the current scoring rules…');wrap.append(status);
  ciRun('ciR1ScoringGuide',ciToken).then(g=>{
   const box=el('div','ci-sg');const p=g.penalties,pass=Number(g.rules.passEach).toFixed(1);
   const add=(tag,text,cls)=>{const e=el(tag,cls,text);box.append(e);return e;};
   add('p','These rules are read live from the CCMS Scoring Weights and Image Scoring Rules sheets and the official evaluation form, so they always match how grades are calculated.');
   add('h3','1. Performance rating scale');
   const t1=el('table');t1.innerHTML='<tr><th>Score</th><th>Meaning</th></tr>';
   [['0','Gross Error'],['1','Minor Error'],['2','Satisfactory'],['3','Optimal'],['N/A','Not applicable — not scored and not counted']].forEach(([s,m],i)=>{const tr=document.createElement('tr');tr.className=i<4?'s'+i:'';tr.append(el('td','',s),el('td','',m));t1.append(tr);});box.append(t1);
   add('h3','2. How each performance section is calculated');
   add('p','Every criterion has a weight. A criterion’s points are its score × its weight. N/A criteria are left out of both the points and the weights.');
   add('div','Section score = (sum of score × weight) ÷ (sum of weights scored)\nPerformance score = the same calculation across all sections together','formula');
   add('p','Example: criteria weighted 2 and 1, scored 3 and 2 → (3×2 + 2×1) ÷ (2+1) = 8 ÷ 3 = 2.67.');
   (g.sections||[]).forEach(s=>{const d=document.createElement('details');d.append(el('summary','',s.title+' — '+s.criteria.length+' criteria'));
    const t=el('table');t.innerHTML='<tr><th>#</th><th>Criterion</th><th>Weight</th></tr>';
    s.criteria.forEach((c,i)=>{const tr=document.createElement('tr');tr.append(el('td','',String(i+1)),el('td','',c.criterion),el('td','',c.weight==null?'—':String(c.weight)));t.append(tr);});d.append(t);box.append(d);});
   add('h3','3. Image evaluation');
   add('p','Each view is scored 0–3 on each of its image criteria. The official descriptions are:');
   (g.image||[]).filter(q=>!/marker/i.test(q.title)).forEach(q=>{const d=document.createElement('details');d.append(el('summary','',q.title));
    const t=el('table');q.choices.forEach(c=>{const m=String(c).match(/^\s*([0-3])/);const tr=document.createElement('tr');if(m)tr.className='s'+m[1];tr.append(el('td','',c));t.append(tr);});d.append(t);box.append(d);});
   add('h3','4. Image penalties');
   const t2=el('table');t2.innerHTML='<tr><th>Situation</th><th>Points</th></tr>';
   [['Any criterion scored 0 in a view (applied once per view)',p.zero],['Missing marker (per view)',p.missingMarker],['Wrong marker (per view)',p.wrongMarker],['Illegible or poorly placed marker (per view)',p.illegibleMarker]]
    .forEach(([a,b])=>{const tr=document.createElement('tr');tr.append(el('td','',a),el('td','',fmt(b)));t2.append(tr);});box.append(t2);
   add('div','Image score = (all image criterion scores + all penalties) ÷ (number of image criteria scored)\nThe image score never goes below 0.','formula');
   add('p','Example: one view scored 3, 2, 0, 3 with a correct marker → (8 '+fmt(p.zero)+') ÷ 4 = '+((8+Number(p.zero))/4).toFixed(2)+'.');
   add('h3','5. Final grade and pass rule');
   add('div','Final competency grade = (Performance score + Image score) ÷ 2','formula');
   const ul=el('ul');[
    'To pass, the Performance score AND the Image score must each be '+pass+' or higher.',
    'An Automatic Failure makes the final competency grade 0.0, whatever the other scores are.',
    'Scores are on a 0–'+g.rules.scaleMax+' scale.'].forEach(x=>ul.append(el('li','',x)));box.append(ul);
   status.replaceWith(box);
  }).catch(e=>fail(status,e));
 }
 window.ciResourceOpen_=function(feature){if(DOCS[feature])openDoc(feature,DOCS[feature]);else if(feature==='Evaluation & Scoring Guide')openGuide();};
})();
</script>

<style id="ci-notifications-style">
.ci-nt-wrap{max-width:900px}.ci-nt-bar{display:flex;align-items:center;gap:10px;margin:0 0 12px}.ci-nt-bar h2{margin:0;font-size:20px;color:#112944;flex:1}
.ci-nt-list{display:flex;flex-direction:column;gap:8px}
.ci-nt-item{display:block;width:100%;text-align:left;border:1px solid #d7e5f0;border-radius:10px;background:#fff;padding:12px 14px;cursor:pointer;color:#173653;font:inherit}
.ci-nt-item.unread{border-color:#9fc8ed;background:#f3f9ff}.ci-nt-item.returned{border-left:5px solid #dc3037}.ci-nt-item.accepted{border-left:5px solid #25a954}
.ci-nt-item b{display:block;font-size:14px}.ci-nt-item small{display:block;color:#5e7288;font-size:12px;margin-top:3px}.ci-nt-item p{margin:6px 0 0;font-size:13px;color:#33506b;white-space:pre-wrap}
.ci-nt-chip{display:inline-block;border-radius:99px;padding:2px 9px;font-size:11px;font-weight:800;margin-left:6px}
.ci-nt-chip.Returned{background:#ffe8ea;color:#c4262d}.ci-nt-chip.Accepted{background:#e6f5ec;color:#17733a}.ci-nt-chip.Submitted{background:#eaf3fc;color:#0a63b4}
.ci-nt-detail{border:1px solid #d7e5f0;border-radius:11px;background:#fff;padding:18px}.ci-nt-detail h3{margin:0 0 6px;font-size:17px;color:#112944}
.ci-nt-note{background:#fff6f6;border:1px solid #f4d0d3;border-radius:9px;padding:12px;white-space:pre-wrap;margin:10px 0;font-size:14px;color:#33263a}
.ci-nt-note.ok{background:#f2fbf5;border-color:#cfe9d8}
.ci-nt-detail textarea{width:100%;min-height:100px;border:1px solid #bcd0e2;border-radius:8px;padding:9px;font:inherit}
.ci-nt-btn{border:1px solid #0878e5;background:#0878e5;color:#fff;border-radius:8px;padding:9px 14px;font:inherit;font-weight:700;cursor:pointer}.ci-nt-btn.ghost{background:#fff;color:#0878e5}
.ci-nt-table{width:100%;border-collapse:collapse;font-size:13px;background:#fff}.ci-nt-table th,.ci-nt-table td{border-bottom:1px solid #e3ecf3;padding:8px;text-align:left;vertical-align:top}.ci-nt-table th{color:#5e7288;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
.ci-nt-filters{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}.ci-nt-filters button{border:1px solid #c9dce9;background:#fff;color:#426989;border-radius:99px;padding:5px 11px;font:inherit;font-size:12px;cursor:pointer}.ci-nt-filters button.on{background:#0878e5;border-color:#0878e5;color:#fff}
#ci-bell-pop{position:absolute;right:0;top:42px;z-index:60;width:340px;max-height:420px;overflow:auto;background:#fff;color:#173653;border:1px solid #d7e5f0;border-radius:10px;box-shadow:0 12px 30px rgba(6,43,74,.25);text-align:left}
#ci-bell-pop .h{padding:10px 14px;font-weight:800;border-bottom:1px solid #e6eef5}#ci-bell-pop button{display:block;width:100%;border:0;border-bottom:1px solid #eef3f7;background:#fff;text-align:left;padding:10px 14px;cursor:pointer;font:inherit;color:#173653}
#ci-bell-pop button.unread{background:#f3f9ff}#ci-bell-pop small{display:block;color:#5e7288;font-size:11px}#ci-bell-pop .e{padding:14px;color:#5e7288;font-size:13px}
</style>
<script id="ci-notifications-script">
(function(){
 const tok=()=>{try{return ciToken||'';}catch(e){return '';}},home=()=>{try{return ciHome;}catch(e){return null;}},page=()=>{try{return ciPage;}catch(e){return '';}};
 const S={list:null,unread:0,subs:null,filter:'all',loading:false,subsLoading:false};
 const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const when=v=>{const d=new Date(v);return isNaN(d)?String(v||''):d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})+' '+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});};
 const isCollegeCi=()=>String(home()?.evaluator?.evaluatorType||'').trim().toLowerCase()==='college ci';
 window.ciOpenWorkspaceFeature_=function(f){if(typeof ciGoWorkspace==='function')ciGoWorkspace();if(page()==='workspace')ciSecondaryOpen('workspace',f);};
 function paintBadges(){
  const b=document.getElementById('ci-bell-count');if(b){b.textContent=String(S.unread);b.hidden=!S.unread;}
  const w=document.getElementById('ci-ws-unread');if(w){w.textContent=String(S.unread);w.hidden=!S.unread;}
 }
 function paintHome(){
  const sec=document.getElementById('ci-home-updates'),host=document.getElementById('ci-home-updates-list');
  if(sec&&host){
   const items=(S.list||[]).filter(n=>n.status==='Unread'||(n.type==='Returned'&&!n.response)).slice(0,4);
   sec.hidden=!items.length;host.replaceChildren();
   items.forEach(n=>host.append(itemButton(n)));
  }
  const rec=document.getElementById('ci-home-recent');
  if(rec&&S.subs){
   const top=S.subs.slice(0,5);
   if(!top.length){rec.className='empty';rec.textContent='No submissions yet.';}
   else{rec.className='';rec.style.padding='0 14px 12px';rec.innerHTML='<table class="ci-nt-table"><tbody>'+top.map(x=>'<tr><td><b>'+esc(x.student)+'</b><div style="color:#5e7288;font-size:12px">'+esc(x.title)+(x.kind==='evaluation'&&x.evaluationType?' · '+esc(x.evaluationType):'')+'</div></td><td>'+esc(x.date)+'</td><td>'+esc(x.result)+'</td><td><span class="ci-nt-chip '+esc(x.status)+'">'+esc(x.status==='Submitted'?'Awaiting review':x.status)+'</span></td></tr>').join('')+'</tbody></table>';}
  }
 }
 function itemButton(n){
  const b=document.createElement('button');b.type='button';
  const bad=n.type==='Returned'||n.type==='Availability Declined';
  b.className='ci-nt-item'+(n.status==='Unread'?' unread':'')+(bad?' returned':' accepted');
  b.innerHTML='<b>'+esc(n.title)+'<span class="ci-nt-chip '+(bad?'Returned':'Accepted')+'">'+esc(n.type==='Returned'?'Returned to you':n.type==='Availability Declined'?'Declined':n.type==='Availability Approved'?'Approved':n.type)+'</span></b><small>'+esc(n.student)+' · from '+esc(n.from)+' · '+esc(when(n.createdAt))+'</small>'+(n.message?'<p>'+esc(n.message.length>220?n.message.slice(0,220)+'…':n.message)+'</p>':'');
  b.onclick=()=>openNotification(n.id);return b;
 }
 window.ciNtRefresh_=async function(){
  if(!tok()||S.loading||!isCollegeCi())return;S.loading=true;
  try{const r=await ciRun('ciR1Notifications',tok());S.list=r.notifications||[];S.unread=Number(r.unread||0);}catch(e){console.warn('Notifications unavailable',e);}
  S.loading=false;paintBadges();paintHome();
  if(!S.subsLoading){S.subsLoading=true;try{const s=await ciRun('ciR1MySubmissions',tok());S.subs=s.submissions||[];}catch(e){console.warn('Submissions unavailable',e);}S.subsLoading=false;paintHome();}
 };
 window.ciBellToggle_=function(ev){
  ev&&ev.stopPropagation();let pop=document.getElementById('ci-bell-pop');
  if(pop){pop.remove();return;}
  const bell=document.getElementById('ci-bell');pop=document.createElement('div');pop.id='ci-bell-pop';
  const items=(S.list||[]).slice(0,8);
  pop.innerHTML='<div class="h">Notifications</div>'+(S.list===null?'<div class="e">Loading…</div>':items.length?'':'<div class="e">No notifications from the coordinator yet.</div>');
  items.forEach(n=>{const b=document.createElement('button');b.type='button';b.className=n.status==='Unread'?'unread':'';b.innerHTML='<b>'+esc(n.title)+'</b><small>'+esc(n.student)+' · '+esc(when(n.createdAt))+'</small>';b.onclick=e=>{e.stopPropagation();pop.remove();openNotification(n.id);};pop.append(b);});
  const all=document.createElement('button');all.type='button';all.innerHTML='<b style="color:#0878e5">See all notifications ›</b>';all.onclick=e=>{e.stopPropagation();pop.remove();ciOpenWorkspaceFeature_('Notifications');};pop.append(all);
  bell.append(pop);if(S.list===null)ciNtRefresh_();
 };
 document.addEventListener('click',e=>{if(!e.target.closest('#ci-bell')){const p=document.getElementById('ci-bell-pop');if(p)p.remove();}});
 function shell(title){
  const items=document.getElementById('ci-workspace-items'),detail=document.getElementById('ci-workspace-detail');
  items.hidden=true;detail.hidden=false;detail.replaceChildren();
  const wrap=document.createElement('div');wrap.className='ci-nt-wrap';const bar=document.createElement('div');bar.className='ci-nt-bar';
  const back=document.createElement('button');back.className='ci-secondary-back';back.type='button';back.textContent='‹';back.setAttribute('aria-label','Back to My CI Workspace');back.onclick=()=>ciSecondaryBack('workspace');
  const h=document.createElement('h2');h.textContent=title;bar.append(back,h);wrap.append(bar);detail.append(wrap);return {wrap,bar};
 }
 async function showNotifications(){
  const {wrap}=shell('Notifications');const list=document.createElement('div');list.className='ci-nt-list';wrap.append(list);
  list.innerHTML='<div class="ci-res-status">Loading notifications…</div>';await ciNtRefresh_();
  list.replaceChildren();if(!(S.list||[]).length){list.innerHTML='<div class="ci-res-status">No notifications yet. When the clinical coordinator accepts or returns one of your submissions, it appears here.</div>';return;}
  S.list.forEach(n=>list.append(itemButton(n)));
 }
 async function openNotification(id){
  if(page()!=='workspace'){if(typeof ciGoWorkspace==='function')ciGoWorkspace();}
  const n=(S.list||[]).find(x=>x.id===id);if(!n)return;
  const {wrap}=shell('Notification');const box=document.createElement('div');box.className='ci-nt-detail';
  const back=wrap.querySelector('.ci-secondary-back');back.onclick=()=>showNotifications();
  box.innerHTML='<h3>'+esc(n.title)+'</h3><div style="color:#5e7288;font-size:13px">'+esc(n.student)+(n.studentId?' ('+esc(n.studentId)+')':'')+' · from '+esc(n.from)+' · '+esc(when(n.createdAt))+'</div>'+
   (n.type==='Returned'?'<p style="margin:12px 0 0;font-weight:700;color:#c4262d">The coordinator returned this for your review:</p>':n.type==='Availability Declined'?'<p style="margin:12px 0 0;font-weight:700;color:#c4262d">The coordinator declined this availability:</p>':n.type==='Availability Approved'?'<p style="margin:12px 0 0;font-weight:700;color:#17733a">The coordinator approved this availability.</p>':'<p style="margin:12px 0 0;font-weight:700;color:#17733a">Accepted by the coordinator.</p>')+
   (n.message?'<div class="ci-nt-note'+(n.type==='Returned'||n.type==='Availability Declined'?'':' ok')+'">'+esc(n.message)+'</div>':'')+
   (n.response?'<p style="font-weight:700;margin-bottom:4px">Your reply · '+esc(when(n.respondedAt))+'</p><div class="ci-nt-note ok">'+esc(n.response)+'</div>':'');
  if(!n.response){
   const lab=document.createElement('label');lab.textContent=n.type==='Returned'?'Reply to the coordinator (what you checked or corrected, or questions):':'Reply (optional):';lab.style.cssText='display:block;font-weight:700;margin:12px 0 6px';lab.htmlFor='ci-nt-reply';
   const ta=document.createElement('textarea');ta.id='ci-nt-reply';ta.maxLength=4000;
   const row=document.createElement('div');row.style.cssText='display:flex;gap:8px;justify-content:flex-end;margin-top:10px';
   const send=document.createElement('button');send.type='button';send.className='ci-nt-btn';send.textContent='Send reply';
   const msg=document.createElement('div');msg.setAttribute('role','status');msg.style.cssText='font-size:13px;margin-top:8px';
   send.onclick=async()=>{const t=ta.value.trim();if(!t){msg.textContent='Write a reply first.';return;}send.disabled=true;send.textContent='Sending…';
    try{await ciRun('ciR1NotificationReply',tok(),n.id,t);n.response=t;n.respondedAt=new Date().toISOString();n.status='Read';msg.textContent='✓ Reply sent to the coordinator.';send.textContent='Sent';S.list=null;ciNtRefresh_();}
    catch(e){send.disabled=false;send.textContent='Send reply';msg.textContent='Reply not sent: '+String(e?.message||e);}};
   row.append(send);box.append(lab,ta,row,msg);
  }
  wrap.append(box);
  if(n.status==='Unread'){try{await ciRun('ciR1NotificationRead',tok(),n.id);n.status='Read';S.unread=Math.max(0,S.unread-1);paintBadges();paintHome();}catch(e){}}
 }
 async function showSubmissions(){
  const {wrap,bar}=shell('My Submissions');const filters=document.createElement('div');filters.className='ci-nt-filters';
  const host=document.createElement('div');wrap.append(filters,host);host.innerHTML='<div class="ci-res-status">Loading your submissions…</div>';
  try{const s=await ciRun('ciR1MySubmissions',tok());S.subs=s.submissions||[];}catch(e){host.innerHTML='<div class="ci-res-status">Could not load submissions: '+esc(e?.message||e)+'</div>';return;}
  const draw=()=>{
   filters.innerHTML='';[['all','All'],['Submitted','Awaiting review'],['Returned','Returned to me'],['Accepted','Accepted']].forEach(([k,l])=>{const b=document.createElement('button');b.type='button';b.textContent=l+' ('+(k==='all'?S.subs.length:S.subs.filter(x=>x.status===k).length)+')';b.className=S.filter===k?'on':'';b.onclick=()=>{S.filter=k;draw();};filters.append(b);});
   const rows=S.subs.filter(x=>S.filter==='all'||x.status===S.filter);
   if(!rows.length){host.innerHTML='<div class="ci-res-status">Nothing to show.</div>';return;}
   host.innerHTML='<table class="ci-nt-table"><thead><tr><th>Date</th><th>Student</th><th>Submission</th><th>Site</th><th>Result</th><th>Status</th><th></th></tr></thead><tbody>'+rows.map(x=>'<tr><td>'+esc(x.date)+'</td><td><b>'+esc(x.student)+'</b></td><td>'+esc(x.title)+(x.evaluationType?'<div style="color:#5e7288;font-size:12px">'+esc(x.evaluationType)+'</div>':'')+'</td><td>'+esc(x.site)+'</td><td>'+esc(x.result)+(x.grade?'<div style="color:#5e7288;font-size:12px">'+esc(x.grade)+'</div>':'')+'</td><td><span class="ci-nt-chip '+esc(x.status)+'">'+esc(x.status==='Submitted'?'Awaiting review':x.status==='Returned'?'Returned to you':x.status)+'</span>'+(x.notes&&x.status!=='Submitted'?'<div style="color:#5e7288;font-size:12px;margin-top:4px;white-space:pre-wrap">'+esc(x.notes.length>160?x.notes.slice(0,160)+'…':x.notes)+'</div>':'')+'</td><td>'+(/^https:\/\/(docs|drive)\.google\.com\//.test(x.document)?'<a href="'+esc(x.document)+'" target="_blank" rel="noopener noreferrer">Open</a>':'')+'</td></tr>').join('')+'</tbody></table>';
  };draw();
 }
 window.ciWorkspaceOpen_=function(feature){
  if(feature==='Notifications'){showNotifications();return true;}
  if(feature==='My Submissions'){showSubmissions();return true;}
  if(feature==='Submit Availability'&&window.ciAvailabilityOpen_){window.ciAvailabilityOpen_();return true;}
  return false;
 };
 // Refresh after sign-in, when returning Home, and every 2 minutes while open.
 let started=false,wrapped=false;
 function kick(){
  if(!wrapped&&typeof window.ciGoHome==='function'){wrapped=true;const g=window.ciGoHome;window.ciGoHome=function(){const r=g.apply(this,arguments);ciNtRefresh_();return r;};}
  if(tok()&&home()){if(!started){started=true;ciNtRefresh_();}}else{started=false;S.list=null;S.subs=null;S.unread=0;paintBadges();}
 }
 setInterval(kick,1500);setInterval(()=>{if(tok()&&home()){S.subsLoading=false;ciNtRefresh_();}},120000);
})();
</script>

<style id="ci-availability-style">
.ci-av-grid{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:16px;align-items:start}@media(max-width:900px){.ci-av-grid{grid-template-columns:1fr}}
.ci-av-card{border:1px solid #d7e5f0;border-radius:11px;background:#fff;padding:16px}.ci-av-card h3{margin:0 0 10px;font-size:15px;color:#112944}
.ci-av-card label{display:block;font-size:12px;font-weight:700;color:#426989;margin:10px 0 4px}.ci-av-card input,.ci-av-card textarea{width:100%;border:1px solid #bcd0e2;border-radius:8px;padding:8px;font:inherit;font-size:14px}
.ci-av-dates{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.ci-av-date{background:#eaf3fc;color:#0a63b4;border-radius:99px;padding:4px 6px 4px 10px;font-size:12px;font-weight:700}.ci-av-date button{border:0;background:none;color:#0a63b4;cursor:pointer;font-weight:800}
.ci-av-row{display:flex;gap:8px;align-items:flex-end}.ci-av-row>div{flex:1}
.ci-av-list .it{display:flex;gap:10px;align-items:center;border-bottom:1px solid #e3ecf3;padding:8px 0;font-size:13px}.ci-av-list .it b{min-width:105px}
.ci-av-st{border-radius:99px;padding:2px 9px;font-size:11px;font-weight:800}.ci-av-st.Pending{background:#fff3cf;color:#8a5a00}.ci-av-st.Approved{background:#e6f5ec;color:#17733a}.ci-av-st.Declined{background:#ffe8ea;color:#c4262d}
.ci-av-frame{width:100%;height:620px;border:1px solid #d7e5f0;border-radius:10px;background:#fff}
</style>
<script id="ci-availability-script">
(function(){
 const tok=()=>{try{return ciToken||'';}catch(e){return '';}};
 const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const nice=d=>{const p=new Date(d+'T12:00:00');return isNaN(p)?d:p.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});};
 const hm=t=>{if(!t)return '';const [h,m]=t.split(':').map(Number);return new Date(2000,0,1,h,m).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});};
 window.ciAvailabilityOpen_=function(){
  const items=document.getElementById('ci-workspace-items'),detail=document.getElementById('ci-workspace-detail');
  items.hidden=true;detail.hidden=false;
  const today=new Date();const iso=x=>x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
  detail.innerHTML='<div class="ci-nt-wrap" style="max-width:1200px"><div class="ci-nt-bar"><button type="button" class="ci-secondary-back" aria-label="Back to My CI Workspace">‹</button><h2>Submit Availability</h2><a class="ci-res-btn" id="ci-av-open" target="_blank" rel="noopener" style="text-decoration:none" hidden>Open in Google Calendar</a></div>'+
  '<div class="ci-av-grid"><div><div class="ci-av-card"><h3>Add availability</h3>'+
   '<label for="ci-av-date">Date</label><div class="ci-av-row"><div><input type="date" id="ci-av-date" min="'+iso(today)+'"></div><button type="button" class="ci-nt-btn ghost" id="ci-av-adddate">Add date</button></div><div class="ci-av-dates" id="ci-av-dates"></div>'+
   '<label style="display:flex;gap:8px;align-items:center;font-size:13px;color:#214360"><input type="checkbox" id="ci-av-allday" checked style="width:auto"> All day</label>'+
   '<div class="ci-av-row" id="ci-av-times" hidden><div><label for="ci-av-start">From</label><input type="time" id="ci-av-start" value="08:00"></div><div><label for="ci-av-end">To</label><input type="time" id="ci-av-end" value="16:00"></div></div>'+
   '<label for="ci-av-note">Note for the coordinator (optional)</label><textarea id="ci-av-note" rows="2" maxlength="500" placeholder="e.g. preferred site, mornings only"></textarea>'+
   '<div style="display:flex;justify-content:flex-end;margin-top:12px"><button type="button" class="ci-nt-btn" id="ci-av-submit">Submit availability</button></div><div id="ci-av-msg" role="status" style="font-size:13px;margin-top:8px"></div>'+
   '<p style="font-size:12px;color:#5e7288;margin:10px 0 0">New entries show on the shared calendar as <b>Pending</b> (yellow). The coordinator approves them there.</p></div>'+
   '<div class="ci-av-card" style="margin-top:14px"><h3>My availability</h3><div class="ci-av-list" id="ci-av-list">Loading…</div></div></div>'+
   '<div><iframe class="ci-av-frame" id="ci-av-frame" title="Shared clinical instructor availability calendar" hidden></iframe><div class="ci-res-status" id="ci-av-frame-note">Loading the shared calendar…</div></div></div></div>';
  detail.querySelector('.ci-secondary-back').onclick=()=>ciSecondaryBack('workspace');
  const dates=new Set();const $=id=>document.getElementById(id);
  const drawDates=()=>{$('ci-av-dates').innerHTML=[...dates].sort().map(d=>'<span class="ci-av-date">'+esc(nice(d))+' <button type="button" data-d="'+d+'" aria-label="Remove '+esc(d)+'">×</button></span>').join('');
   $('ci-av-dates').querySelectorAll('button').forEach(b=>b.onclick=()=>{dates.delete(b.dataset.d);drawDates();});};
  $('ci-av-adddate').onclick=()=>{const v=$('ci-av-date').value;if(v){dates.add(v);drawDates();$('ci-av-date').value='';}};
  $('ci-av-date').addEventListener('change',()=>{const v=$('ci-av-date').value;if(v){dates.add(v);drawDates();$('ci-av-date').value='';}});
  $('ci-av-allday').onchange=()=>{$('ci-av-times').hidden=$('ci-av-allday').checked;};
  let frameUrl='';
  const load=async()=>{
   try{const r=await ciRun('ciR1AvailabilityList',tok());
    if(!frameUrl){frameUrl=r.embedUrl;$('ci-av-frame').src=r.embedUrl;$('ci-av-frame').hidden=false;$('ci-av-frame-note').textContent='Not seeing the calendar? Make sure you are signed in to Google with your college account, or use Open in Google Calendar.';$('ci-av-frame-note').style.marginTop='8px';const o=$('ci-av-open');o.href=r.openUrl;o.hidden=false;}
    else $('ci-av-frame').src=frameUrl;
    const now=iso(new Date());const up=(r.events||[]).filter(e=>e.date>=now);
    $('ci-av-list').innerHTML=up.length?up.map(e=>'<div class="it"><b>'+esc(nice(e.date))+'</b><span style="flex:1">'+(e.allDay?'All day':esc(hm(e.start)+' – '+hm(e.end)))+(e.note?'<br><span style="color:#5e7288">'+esc(e.note)+'</span>':'')+(e.coordinatorNote?'<br><span style="color:'+(e.status==='Declined'?'#c4262d':'#17733a')+'">Coordinator: '+esc(e.coordinatorNote)+'</span>':'')+'</span><span class="ci-av-st '+esc(e.status)+'">'+esc(e.status)+'</span>'+(e.status==='Approved'?'':'<button type="button" class="ci-nt-btn ghost" style="padding:4px 9px;font-size:12px" data-id="'+esc(e.id)+'">Remove</button>')+'</div>').join(''):'<div style="color:#5e7288;font-size:13px">No upcoming availability submitted.</div>';
    $('ci-av-list').querySelectorAll('button[data-id]').forEach(b=>b.onclick=async()=>{if(!confirm('Remove this availability from the shared calendar?'))return;b.disabled=true;try{await ciRun('ciR1AvailabilityRemove',tok(),b.dataset.id);load();}catch(e){b.disabled=false;alert(String(e?.message||e));}});
   }catch(e){$('ci-av-list').textContent='Could not load availability: '+String(e?.message||e);$('ci-av-frame-note').textContent='The shared calendar could not be loaded.';}
  };
  $('ci-av-submit').onclick=async()=>{
   const pending=$('ci-av-date').value;if(pending)dates.add(pending);
   const msg=$('ci-av-msg');if(!dates.size){msg.textContent='Choose at least one date.';return;}
   const req={dates:[...dates].sort(),allDay:$('ci-av-allday').checked,start:$('ci-av-start').value,end:$('ci-av-end').value,note:$('ci-av-note').value};
   const b=$('ci-av-submit');b.disabled=true;b.textContent='Submitting…';msg.textContent='';
   try{const r=await ciRun('ciR1AvailabilityAdd',tok(),req);dates.clear();drawDates();$('ci-av-note').value='';
    msg.textContent='✓ '+(r.created||[]).length+' availability entr'+((r.created||[]).length===1?'y':'ies')+' added'+(r.skipped?' · '+r.skipped+' already on the calendar':'')+'.';load();}
   catch(e){msg.textContent='Not submitted: '+String(e?.message||e);}
   b.disabled=false;b.textContent='Submit availability';
  };
  load();
 };
})();
</script>
